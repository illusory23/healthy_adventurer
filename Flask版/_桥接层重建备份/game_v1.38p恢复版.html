function inRegionTime(t){
  const now = new Date();
  const cur = now.getHours()*60 + now.getMinutes();
  const [a,b] = t.split("-");
  const ah = +a.split(":")[0]*60 + +a.split(":")[1];
  const bh = +b.split(":")[0]*60 + +b.split(":")[1];
  return cur >= ah && cur <= bh;
}
function prevHealthScore(){
  return S.history.length ? (S.history[S.history.length-1].score || 0) : 0;
}
/* v1.38l：昨日评分 → 今日委托成功率加成（successRate / rateBreakdown 与首页展示共用，含健康加成上限修正） */
function healthRateBonus(){
  const H = prevHealthScore();
  return H * 0.002 * (1 + gearEffects().healthUp + heatBonus() + (titleActive("安眠守护者") ? 0.05 : 0));
}
function doExplore(i){
  const r = REGIONS[i];
  if(S.lvIdx < 1) return showAlert("自由探索需要完成 9 次 Lv2 委托后解锁。", "探索");
  if(S.exploreActive) return showAlert("已经有一次探索正在进行中。<br><br>等待它完成，或中途返回（不会有任何收获）。", "探索");
  if(r.lv && S.lvIdx < r.lv - 1) return showAlert("「" + r.n + "」需要等级 <b>Lv" + r.lv + "</b> 才能进入。<br><br>当前等级：" + lvName(), "探索");
  if(prevHealthScore() < 60) return showAlert("前一日健康评分低于 60，今天不能探索。<br><br>先把作息调整好。", "探索");
  if(S.exploreUsed >= 2) return showAlert("今天已经探索 2 次了，明天再来。", "探索");
  if(S.explore < r.c) return showAlert("探索点不足。<br><br>「"+r.n+"」需要 " + r.c + " 点，当前只有 " + S.explore + " 点。", "探索");
  if(!inRegionTime(r.t)) return showAlert("「"+r.n+"」不在开放时间内。<br><br>开放时间：" + r.t, "探索");

  // 出发：占探索点与次数，进入现实时间探索（2~12 小时，到点后结算）
  S.explore -= r.c;
  S.exploreUsed++;
  S.exploreActive = {idx:i, n:r.n, c:r.c, h:r.h, startTs:Date.now(), finishTs:Date.now() + r.h*3600000};
  addLog("🧭 开始探索「"+r.n+"」（-"+r.c+"点，需 "+r.h+" 小时）","");
  save(); render();
  showAlert("🧭 出发！<br><br>你进入了「"+r.n+"」——这次探索大约需要 <b>"+r.h+" 小时</b>。<br><br>探索结束后结算掉落；<b>中途返回将没有任何收获</b>。", "自由探索");
}
/* 中途返回：放弃探索，不获得任何材料掉落（探索点与次数不退还） */
function exploreReturn(){
  const ea = S.exploreActive;
  if(!ea) return;
  showConfirm("确定中途返回吗？<br><br>放弃「"+ea.n+"」的探索——<b>不会获得任何材料掉落</b>（探索点与次数也不退还）。", function(){
    S.exploreActive = null;
    addLog("🚶 放弃了「"+ea.n+"」的探索——没有任何收获","");
    save(); render();
  }, "中途返回");
}
/* 探索完成判定：到点后结算掉落与事件（幂等，可重复调用） */
function exploreFinishCheck(){
  const ea = S.exploreActive;
  if(!ea || Date.now() < ea.finishTs) return;
  S.exploreActive = null;
  const r = REGIONS[ea.idx];

  // 掉落：每个掉落物独立判定（单次探索可同时获得多个；「空手」项不参与判定）
  const gains = [];
  for(const pair of r.d){
    const name = pair[0];
    if(!name) continue;                          // 「空手」项不参与独立判定
    if(Math.random() * 100 >= pair[1]) continue; // 该项未命中
    if(name === "旧宝箱"){
      const sub = Math.random();
      if(sub < 0.4){ const c = 20 + Math.floor(Math.random()*31); S.money += c; gains.push("铜币 " + c); }
      else if(sub < 0.7){ const m = randomMat("普通"); S.mats[m]=(S.mats[m]||0)+3; gains.push("旧宝箱开出 " + m + " ×3"); }
      else if(sub < 0.9){ const m = randomMat("精良"); S.mats[m]=(S.mats[m]||0)+2; gains.push("旧宝箱开出 " + m + " ×2"); }
      else { gains.push("旧宝箱（空的）"); }
    } else if(ITEM_DESC[name] !== undefined){   // 按道具清单判断（修复首次获得时误进材料分支）
      S.items[name] = (S.items[name]||0) + 1;
      gains.push("规则道具「" + name + "」×1");
    } else {
      const n = 1 + Math.floor(Math.random()*3);
      S.mats[name] = (S.mats[name]||0) + n;
      gains.push(name + " ×" + n);
    }
  }

  let msg, cls = "";
  if(!gains.length){
    msg = "空手而归……什么都没找到。";
  } else {
    msg = "获得：" + gains.join("、");
    if(gains.join("").indexOf("规则道具") >= 0) cls = "gold";
  }
  addLog("🧭 探索「"+r.n+"」完成 → " + msg, cls);
  save(); render();
  const evName = pickExploreEvent(r);          // 探索事件判定（与掉落并行，点「确定」后弹出）
  dlg("探索归来 · " + r.n, '<div class="dlg-msg">'+msg+'</div>', [
    {text:"确定", cls:"pri", fn: evName ? function(){ runExploreEvent(evName, r); } : null}
  ]);
}
function randomMat(tier){
  const pool = Object.keys(M).filter(k => M[k][1] === tier);
  return pool[Math.floor(Math.random()*pool.length)] || "止血草";
}

/* 区域事件是否仍可触发（一次性事件完成后不再出现） */
function exploreEventAvailable(name){
  if(name === "受伤小狼") return !S.wolfDone && !S.pendingPet && S.pets.indexOf("小狼") < 0;
  if(name === "古代石碑") return !S.blueprints["安神吊坠"];

  return true;
}

  {ev:"毛球来访", pet:"绒球兽"},
  {ev:"黏糊糊的果冻", pet:"史莱姆"},
  {ev:"捣蛋小鬼", pet:"捣蛋鬼"}
];
function petEventPool(){
  return PET_EVENT_POOL.filter(function(x){
    return (S.pets||[]).indexOf(x.pet) < 0 && !(S.pendingPet && S.pendingPet.name === x.pet);
  });
}
function pickExploreEvent(r){
  if(Math.random() >= EXPLORE_EVENT_CHANCE) return null;
  const pe = petEventPool();                       // v1.35：宠物奇遇（25% 事件位）
  if(pe.length && Math.random() < 0.25) return pe[Math.floor(Math.random()*pe.length)].ev;
  const bound = REGION_EVENTS[r.n];
  if(!bound || !exploreEventAvailable(bound)) return "盗贼伏击";
  return Math.random() < 0.30 ? "盗贼伏击" : bound;
}

function feedVal(name){ return WOLF_FEED_VALUE[(M[name] && M[name][1]) || "普通"] || 2; }
function feedWolf(name){
  if(!S.wolf) return showAlert("还没有小狼伙伴。", "宠物养成");
  if(!S.mats[name]) return;
  if(S.wolf.stage >= 4) return showAlert("远古魔狼已是最终形态，不再需要喂食。", "宠物养成");
  if(!WOLF_FOODS.has(name))
    return showAlert("「"+name+"」不能喂食，小狼不吃这个。<br><br>可喂食：食材（蘑菇 / 河鱼 / 泉水 / 蜂蜜 / 兽肉 / 香草 / 山珍）、草药（止血草 / 晨露花 / 月光草 / 暗影草 / 世界树汁液）及高级特殊材料（龙血 / 龙心）。", "宠物养成");
  if(feedLeft() <= 0)
    return showAlert("今天已经喂食 "+WOLF_DAILY_FEED+" 次了，小狼吃饱啦——明天再喂吧。", "宠物养成");
  const w = S.wolf;
  const need = WOLF_STAGES[w.stage].need;
  const growthFull = w.growth >= need;             // 本阶段成长值已满
  const v = feedVal(name);
  const mv = WOLF_MUTATE_VALUE[name] || 0;         // 高级特殊材料 → 变异值
  S.mats[name]--; if(S.mats[name] <= 0) delete S.mats[name];
  w.fedDate = todayStr();
  w.fedCount = (w.fedCount || 0) + 1;
  if(!growthFull) w.growth += v;                   // 成长值满后不再增加（但仍可继续喂食）
  if(mv) w.mutate = (w.mutate || 0) + mv;
  const parts = [];
  if(!growthFull) parts.push("成长值 +"+v);
  if(mv) parts.push("变异值 +"+mv);
  if(!parts.length) parts.push("成长值已满，未获得加成");
  addLog("🐺 喂食「"+name+"」（"+parts.join("，")+"）→ "+WOLF_STAGES[w.stage].name
    + " 成长 "+w.growth+"/"+need + (w.mutate ? "　变异值 "+w.mutate+"/"+WOLF_MUTATE_NEED : ""), "ok");
  if(w.stage === 1 && w.growth >= WOLF_STAGES[1].need){
    w.stage = 2; w.growth = 0;
    addLog("🎉 小狼成长为「成年狼」：所有委托材料掉落率 +3%","gold");
    if(S.daily) S.daily.events.push("🐺 宠物成长：成年狼");
    save(); render();
    return showAlert("🎉 小狼长大了！<br><br>成为 <b>成年狼</b>——所有委托材料掉落率 <b>+3%</b>。", "宠物成长");
  }
  if(w.stage === 2 && w.growth >= WOLF_STAGES[2].need){
    w.stage = 3; w.growth = 0;
    addLog("🎉 成年狼成长为「巨狼」：材料掉落率 +5%、委托成功率 +1%","gold");
    if(S.daily) S.daily.events.push("🐺 宠物成长：巨狼");
    save(); render();
    return showAlert("🎉 它变得更加强壮——<br><br>成为 <b>巨狼</b>：材料掉落率 <b>+5%</b>、委托成功率 <b>+1%</b>。<br><br>接下来把成长值喂满，再用<b>高级特殊材料</b>（龙血 / 龙心）积累<b>变异值</b>，就能尝试变异。", "宠物成长");
  }
  save(); render();
  openWolfFeed();                       // 重开喂食窗，刷新库存与成长值
}
function evolveWolf(){
  const w = S.wolf;
  if(!w || w.stage !== 3) return showAlert("只有巨狼可以进化为远古魔狼。", "宠物养成");
  if(w.growth < WOLF_STAGES[3].need)
    return showAlert("成长值尚未积满（"+w.growth+" / "+WOLF_STAGES[3].need+"）。<br><br>先用食材把成长值喂满吧。", "宠物养成");
  if((w.mutate || 0) < WOLF_MUTATE_NEED)
    return showAlert("变异值尚未积满（"+(w.mutate||0)+" / "+WOLF_MUTATE_NEED+"）。<br><br>继续喂食<b>高级特殊材料</b>：龙血 / 暗影草 +5、龙心 / 世界树汁液 +12 变异值。", "宠物养成");
  showConfirm("巨狼气息翻涌，血脉深处仿佛有什么在苏醒——<br><br>确定让它变异为「远古魔狼」？", function(){
    S.wolf = {stage:4, growth:0, mutate:0, fedDate:"", fedCount:0};
    addLog("🌌 巨狼变异为「远古魔狼」：材料掉落率 +8%、委托成功率 +3%","gold");
    if(S.daily) S.daily.events.push("🐺 宠物变异：远古魔狼");
    save(); render();
    showAlert("🌌 变异成功！<br><br>它睁开金瞳，仰天长啸——<br><b>远古魔狼</b>：材料掉落率 <b>+8%</b>、委托成功率 <b>+3%</b>。", "远古魔狼");
  }, "远古魔狼");
}
function openWolfFeed(){
  if(!S.wolf) return;
  const w = S.wolf;
  if(w.stage >= 4) return showAlert("远古魔狼已是最终形态，不再需要喂食。", "宠物养成");
  const wst = WOLF_STAGES[w.stage];
  const growthFull = w.growth >= wst.need;
  const left = feedLeft();
  const keys = Object.keys(S.mats).filter(function(k){ return WOLF_FOODS.has(k); })
                 .sort(function(a,b){ return M[b][2] - M[a][2]; });
  let body = '<div class="dlg-msg" style="font-size:13px">今日剩余喂食次数：<b style="color:'+(left>0?"var(--gold)":"var(--red)")+'">'+left+" / "+WOLF_DAILY_FEED+'</b>　（每天最多 3 次，每次 1 个）</div>';
  if(growthFull) body += '<div class="muted" style="font-size:12px;margin-bottom:6px;color:var(--gold2)">成长值已满——普通食材 / 草药不再增加成长值；只有龙血 / 暗影草 / 龙心 / 世界树汁液（高级特殊材料）能继续积累变异值。</div>';
  if(!keys.length) body += '<div class="muted">背包里没有可喂食的物品——小狼吃：食材、草药，以及龙血 / 龙心。</div>';
  keys.forEach(function(k){
    const m = M[k], v = feedVal(k), mv = WOLF_MUTATE_VALUE[k] || 0;
    const zero = (growthFull && !mv) ? '<span style="color:var(--dim2)">（成长已满 · 无加成）</span>' : "";
    body += '<div class="li" style="gap:8px"><div style="flex:1">'+matIcon(k)+k+'<span class="tier t-'+m[1]+'">'+m[1]+'</span>'
          + '<div class="muted">'+(growthFull ? '' : '成长值 +'+v+'　')+(mv ? '<span style="color:var(--gold2)">变异值 +'+mv+'</span>　' : '')+zero+'库存 ×'+S.mats[k]+'</div></div>'
          + '<button class="btn sm pri" onclick="clrDlg();feedWolf(\''+k+'\')">喂食</button></div>';
  });
  dlg("🍖 喂食 · "+wst.name+"（成长 "+w.growth+" / "+wst.need+"　变异 "+(w.mutate||0)+" / "+WOLF_MUTATE_NEED+"）", body, [{text:"关闭", fn:null}]);
}

  document.body.appendChild(a);

}
function importSave(){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.onchange = function(e){
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = function(ev){
      let d;
      try{ d = JSON.parse(ev.target.result); }
      catch(err){ return showAlert("导入失败：不是有效的 JSON 文件"); }
      if(!d || typeof d !== "object" || Array.isArray(d))
        return showAlert("导入失败：存档格式不正确");
      showConfirm("导入将覆盖当前进度，确定继续？", function(){
        S = migrate(Object.assign({}, d));   // 缺失字段用默认值补齐
        save();
        tick();
        hideIntro();
        addLog("📂 已导入存档（来自 "+f.name+"）","gold");
        render();
      }, "导入存档");
    };
    r.readAsText(f);
  };
  inp.click();
}

/* v1.38：尾巴提醒——昨天错过入睡打卡时，今天首次打开温和提一句（每游戏日最多一次） */
function checkLastNightHint(){
  try{
    const hs = S.history || [];
    if(!hs.length) return;
    const t0 = new Date(todayStr() + "T12:00:00");
    t0.setDate(t0.getDate() - 1);
    const y = t0.getFullYear() + "-" + String(t0.getMonth()+1).padStart(2,"0") + "-" + String(t0.getDate()).padStart(2,"0");
    const last = hs[hs.length-1];
    if(last.date !== y || last.sleep) return;                 // 只提醒「昨晚」且确实没早睡
    if(localStorage.getItem("adv_nighthint") === todayStr()) return;
    localStorage.setItem("adv_nighthint", todayStr());
    const shielded = (S.shieldDays || []).indexOf(last.date) >= 0;
    setTimeout(function(){ try{
      toast(shielded
        ? "🛡 昨晚没早睡——连击保险替你挡下了（每月 1 次），今晚继续 🌙"
        : "🌙 昨晚的入睡打卡错过了（差一点点）。今晚 23:45 前记得——公会给你的房间留了灯");
    }catch(e){} }, 2600);
  }catch(e){}
}
/* v1.38：吟游诗人的周报——每 7 天首次打开，用一封信回顾自己的健康（localStorage 记展示频率） */
function tryBardLetter(){
  try{
    if(typeof _queueBusy !== "undefined" && _queueBusy) return;   // 结算弹窗忙时让路
    const modal = document.getElementById("modal");
    if(modal && modal.classList.contains("on")) return;
    const dlgEl = document.getElementById("dlg");
    if(dlgEl && dlgEl.classList.contains("on")) return;
    const hs = S.history || [];
    if(hs.length < 3) return;
    const today = todayStr();
    const last = localStorage.getItem("adv_bard");
    if(last){
      const d0 = new Date(last + "T12:00:00"), d1 = new Date(today + "T12:00:00");
      if((d1 - d0) / 86400000 < 7) return;                        // 距上次未满 7 天
    }
    const week = hs.slice(-7);
    const prev = hs.slice(-14, -7);
    const sleepN = week.filter(function(x){ return x.sleep; }).length;
    const avg = Math.round(week.reduce(function(a,x){ return a + (x.score||0); },0) / week.length);
    const great = week.filter(function(x){ return (x.score||0) >= 90; }).length;
    const mx = week.reduce(function(a,x){ return Math.max(a, x.score||0); },0);
    let cmp = "";
    if(prev.length){
      const pAvg = Math.round(prev.reduce(function(a,x){ return a + (x.score||0); },0) / prev.length);
      const diff = avg - pAvg;
      cmp = diff >= 3 ? '　比上一程高了 <b style="color:var(--green)">' + diff + '</b> 分——风都在为你鼓掌。'
          : (diff <= -3 ? '　比上一程低了 <b style="color:var(--red)">' + (-diff) + '</b> 分——没关系，路还长。'
          : "　与上一程不相上下。");
    }
    const openers = [
      "旅人，篝火正旺，且听我唱一程——",
      "远方的冒险者，你的故事飘到了我的琴弦上——",
      "我在酒馆听说了你。来，让琴声记下这一程——"
    ];
    localStorage.setItem("adv_bard", today);
    dlg("📜 吟游诗人的信",
      '<div class="dlg-msg" style="line-height:2">'
      + openers[Math.floor(Math.random()*openers.length)] + "<br><br>"
      + '过去 <b>' + week.length + '</b> 天：早睡 <b style="color:var(--gold2)">' + sleepN + '</b> 天 · 平均 <b style="color:var(--green)">' + avg + '</b> 分 · 高光 <b>' + mx + '</b> 分'
      + (great ? '，其中优秀 ' + great + ' 天' : '') + '。<br>'
      + cmp + '<br><br><span class="muted">——琴声止处，愿你今晚好眠。</span></div>');
  }catch(e){}
}

function renderQuest(){
  const el = document.getElementById("tab-quest");
  const limit = dailyLimitNow();
  let hL = "";             // 左栏：委托流
  let hR = "";             // 右栏：自由探索 + 特殊事件

  // ── v1.35：今日概览带（快速扫视）──
  const _ovGi = gradeInfo(S.health.score), _ovDone = (S.health.done||[]).filter(function(x){ return x; }).length;
  hL += `<div class="card" style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;padding:11px 14px">
    <span class="muted" style="width:100%;font-size:11px">今日概览</span>
    <span>⚡ 精力 <b>${S.energy}/${energyMaxNow()}</b></span>
    <span>❤️ 健康 <b style="color:${_ovGi.c}">${S.health.score} ${_ovGi.n}</b></span>

  // ═══ 左栏 · 委托流 ═══

    if(S.privQuest){

      const rate = successRate(q);
      hL += `<div class="quest" style="cursor:default;border-color:var(--gold);border-left:3px solid ${DIFF_COLORS[q[4]]||"#454b7a"}">

        <div class="meta" style="margin-top:6px">

          <span>✦${q[6]}</span>

    } else if(S.privToday){

    } else {
      hL += `<div class="muted" style="font-size:12px">本日 <b>08:00</b> 刷新时出现（W 级公会特权 · 每日 1 个 · 计入每日接取次数）</div>`;

      const q = S.glassQuest;
      const rate = successRate(q);
      hL += `<div class="quest" style="cursor:default;border-color:var(--gold);border-left:3px solid ${DIFF_COLORS[q[4]]||"#454b7a"}">
        <b style="color:${qLvColor(S.lvIdx+1)}">${q[0]}</b>
        <div class="meta"><span class="diff d-${q[4]}">${q[4]}</span><span>${fmtDur(q[3])}</span><span style="color:${qLvColor(S.lvIdx+1)}">${q[1]}</span></div>
        <div class="meta" style="margin-top:6px">

          <span>✦${q[6]}</span>
        </div>

    } else if(S.glassToday){

      hL += `<div class="muted" style="font-size:12px">本日 <b>08:00</b> 刷新时出现（时间沙漏特权 · 每日 1 个 · 计入每日接取次数）</div>`;

  if(S.lvIdx >= 2 && S.bonusQuests && S.bonusQuests.length){

      <div class="grid grid2">`;
    S.bonusQuests.forEach(function(q, i){
      const rate = successRate(q);
      hL += `<div class="quest" style="cursor:default;border-color:var(--gold);border-left:3px solid ${DIFF_COLORS[q[4]]||"#454b7a"}">

        <div class="meta" style="margin-top:6px">
          <span class="rate">成功率 ${Math.round(rate*100)}%</span>

          <span>⚡${q[7]}</span>
          <span>✦${q[6]}</span>

      </div>`;

    hL += `</div></div>`;
  }

  // ── 今日状态 ──
  const giNow = gradeInfo(S.health.score), giPrev = gradeInfo(prevHealthScore());
  const _hrb = healthRateBonus();   // v1.38l：昨日评分 → 今日委托成功率加成（具体数值）
  const prevTxt = (S.history && S.history.length)

  hL += `<div class="card"><h3>今日状态</h3>
    <div class="li"><span>精力</span><b>${S.energy} / ${energyMaxNow()}</b></div>
    <div class="li"><span>健康评分</span><b>${S.health.score} 分 <span style="color:${giNow.c};font-weight:600">${giNow.n}</span></b></div>
    <div class="li"><span>昨日评分（影响今日委托成功率）</span><b>${prevTxt}</b></div>
    <div class="li"><span>今日接取</span><b>${S.accepted} / ${limit}</b></div>
    <div class="li"><span>公会额外委托</span><b>${S.bonusToday?"已触发 +1":"未触发"}</b></div>
    ${(S.pets||[]).length?`<div class="li"><span>🐾 携带宠物</span><b>${carryPetLabel() ? carryPetLabel() + (petBonusNote(S.carryPet) ? '<span class="muted" style="font-size:11px">　' + petBonusNote(S.carryPet) + '</span>' : "") : '<span class="muted">未携带（背包·宠物中设置）</span>'}</b></div>`:""}
  </div>`;

  // ═══ 右栏 · 自由探索 + 特殊事件 ═══
  // ── 自由探索 ──
  const ph = prevHealthScore();
  const locked = S.lvIdx < 1;
  hR += `<div class="card"><h3>🧭 自由探索</h3>
    <div class="row" style="margin-bottom:8px">
      <span class="muted">探索点</span>
      <b style="color:var(--gold)">${S.explore} 点</b>

    <div class="row" style="margin-bottom:8px">
      <span class="muted">今日已探索</span><b>${S.exploreUsed} / 2 次</b>
    </div>`;
  if(S.exploreActive){
    const ea = S.exploreActive;
    const leftMs = Math.max(0, ea.finishTs - Date.now());

    const leftTxt = hh>0 ? hh+" 小时 "+(mm%60)+" 分" : mm+" 分钟";
    const pct = Math.min(100, Math.max(0, (1 - leftMs/(ea.h*3600000))*100));
    hR += `<div class="li" style="flex-direction:column;align-items:stretch;gap:6px">
      <div class="row"><b>🧭 探索中：${ea.n}</b><span class="muted">剩余 ${leftTxt}</span></div>
      <div class="bar" style="height:5px"><i style="width:${pct}%;background:var(--blue)"></i></div>
      <div class="muted" style="font-size:11px">探索结束后结算掉落；中途返回将没有任何收获。</div>

    </div>`;

  } else {
    hR += `<div class="muted" style="margin-bottom:8px;font-size:11px">前一日健康 ${ph} 分 → 今日 ${S.explore} 点探索点（每日刷新）</div>`;

      const lvOk = !r.lv || S.lvIdx >= r.lv - 1;

      hR += `<div class="li" style="flex-direction:column;align-items:stretch;gap:4px;opacity:${can?1:.5}">
        <div class="row"><b>${r.n}</b>
          <button class="btn sm ${can?"pri":""}" onclick="doExplore(${i})">探索 ${r.c} 点</button></div>
        <div class="muted" style="font-size:11px">${r.t}　耗时 ${r.h} 小时${r.lv?"　🔒 Lv"+r.lv+" 开放":""}${!timeOk?"　（当前不在开放时间）":""}${!lvOk?"　（等级不足）":""}</div>
      </div>`;
    });
  }
  hR += `</div>`;

  // ── 特殊事件（传奇事件 / 世界级事件；v1.38p：未触发时整卡隐藏，触发才出现并显示内容） ──
  if(S.legendActive){

           ${weekLocked?`<div class="muted" style="margin-top:4px;font-size:11px;color:var(--red)">本周已接取过，下周才能再接</div>`:""}

    </div>`;
    hR += `</div>`;
  }

  // ── v1.35：酒馆传闻（每日一条风味；v1.38o：每存档独立随机刷新）──
  if(!S.rumor || S.rumor.date !== todayStr()) S.rumor = {date:todayStr(), idx:Math.floor(Math.random()*RUMORS.length)};
  hR += `<div class="card"><h3>🍺 酒馆传闻</h3>
    <div class="muted" style="font-size:12.5px;line-height:1.9">${RUMORS[S.rumor.idx % RUMORS.length]}</div></div>`;

  el.innerHTML = `<div class="qsplit"><div class="qcol">${hL}</div><div class="qcol">${hR}</div></div>`;
}

let _lastShownScore = null;      // v1.35：健康分数字跳动动画用
function renderHealth(){
  const el = document.getElementById("tab-health");
  // v1.35：100 分构成可视化（每格 = 一项任务满分占比；亮度 = 完成度）
  let _segHtml = "";
  CFG.tasks.forEach(function(t,i){
    const on = S.health.done[i] ? 1 : 0;
    _segHtml += `<i title="${t[0]} +${t[1]}" style="flex:${t[1]};border-radius:2px;background:linear-gradient(180deg,#ffd97a,#e8b54a);opacity:${on?1:.18}"></i>`;
  });
  CFG.multiTasks.forEach(function(t,i){
    const mx = t[1]*t[2], rr = mx ? Math.min(1,(S.health.multi[i]||0)*t[1]/mx) : 0;
    _segHtml += `<i title="${t[0]} +${t[1]}/次 ×${t[2]}" style="flex:${mx};border-radius:2px;background:linear-gradient(180deg,#5fd49a,#3fae75);opacity:${(0.18+0.82*rr).toFixed(2)}"></i>`;
  });
  const _scChanged = (_lastShownScore !== null && _lastShownScore !== S.health.score);
  _lastShownScore = S.health.score;
  let h = `<div class="card"><h3>今日健康评分</h3>
    <div class="total${_scChanged?" pop":""}">${S.health.score}<small> / 100</small></div>
    <div style="display:flex;gap:2px;height:9px;margin:10px 2px 4px">${_segHtml}</div>
    <div class="muted" style="text-align:center;font-size:11px">金色=每日任务 · 绿色=多次任务 · 亮度=完成度</div>
    <div class="muted" style="text-align:center;margin-top:4px">${grade(S.health.score)}</div>
  </div>`;
  // 次日区间奖励展示（v1.19）
  if(S.buffNext && S.buffNext.date === todayStr()){
    const b = S.buffNext, parts = [];
    if(b.pay) parts.push("委托报酬 +" + Math.round(b.pay*100) + "%");
    if(b.energy) parts.push("精力上限 " + (b.energy>0?"+":"") + b.energy);
    if(b.con) parts.push("贡献 +" + b.con + (b.claimed?"（已到账）":"（待领取）"));
    if(b.vit) parts.push("活力点 +" + b.vit + (b.claimed?"（已到账）":"（待领取）"));
    if(parts.length) h += `<div class="card"><h3>🌟 今日区间奖励（昨日健康 ${S.buffNext.score||"—"} 分）</h3><div class="muted" style="line-height:1.9">${parts.join("　·　")}</div></div>`;
  }

  h += `<div class="card"><h3>每日一次任务</h3>`;
  CFG.tasks.forEach((t,i)=>{
    if(i === 5){   // v1.28：完整吃三餐 → 早/午/晚三按钮（全点才 +15）
      const meals = S.health.meals || [0,0,0];
      const cnt = meals.filter(function(x){ return x; }).length;
      h += `<div class="hitem"><div class="nm">${t[0]}<span class="pt">+${t[1]}</span>
        <div class="muted">早/午/晚三项全打卡才得分（当前 ${cnt}/3）</div></div>
        <div class="cnt">` + MEAL_NAMES.map(function(nm, mi){
          const on = meals[mi], ok = inWindowNow(CFG.mealWindows[mi]);
          return `<button class="btn meal-btn ${on?"pri":""}" style="${(!on&&!ok)?"opacity:.45":""}" onclick="toggleMeal(${mi})">${nm}${on?" ✓":""}</button>`;
        }).join("") + `</div></div>`;
      return;
    }
    const on = S.health.done[i];
    const win = CFG.taskWindows[i];
    const off = win && !on && !inWindowNow(win);
    h += `<div class="hitem"><div class="nm">${t[0]}<span class="pt">+${t[1]}</span>${win?`<div class="muted">打卡时段 ${win[0]}–${win[1]}</div>`:""}</div>
      <button class="btn sm ${on?"pri":""}" style="${off?"opacity:.45":""}" onclick="toggleTask(${i})">${on?"✓ 已达成":"打卡"}</button></div>`;
  });
  h += `</div>`;

  h += `<div class="card"><h3>每日多次任务</h3>`;
  CFG.multiTasks.forEach((t,i)=>{
    h += `<div class="hitem"><div class="nm">${t[0]}<span class="pt">+${t[1]}/次</span>
      <div class="muted">最多 ${t[2]} 次</div></div>

      配方：主材料（图纸指定）　+　副材料（与主材料<b>同系品类</b>、同阶或低一阶）　+　加工费<br>
      需求量按品级与部位：主材料 普通 2 / 精良 3 / 稀有 4 / 史诗 5 / 传说 6（饰品 −1）；副材料 2 / 3 / 4 / 6 / 8（护甲 +1）</div>`;
    const _parts = [];
    const _cntByPart = {};
    owned.forEach(function(g){
      if(g[2] && _parts.indexOf(g[2]) < 0) _parts.push(g[2]);
      if(g[2]) _cntByPart[g[2]] = (_cntByPart[g[2]] || 0) + 1;
    });
    const _partFiltered = owned.filter(function(g){ return craftPart === "全部" || g[2] === craftPart; });   // v1.38j：部位筛选（计数联动）
    const _canCraftG = function(g){   // v1.38j：轻量"能否打造"判定（仅统计用，无副作用）
      const _mm2 = craftMainMat(g[0]);
      return (S.mats[_mm2.mat]||0) >= _mm2.cnt
          && !!pickSubMats(g[1], _mm2.mat, subMatCount(g[1], g[2]))
          && S.money >= craftCost(g[1]) * 10000;
    };
    let _okNow = 0;
    _partFiltered.forEach(function(g){ if(_canCraftG(g)) _okNow++; });
    h += `<div style="margin-bottom:6px;line-height:2.1">`
      + `<button class="btn sm${craftPart==="全部"?" pri":""}" onclick="setBagFilter('part','全部')">全部（${owned.length}）</button> `
      + _parts.map(function(p2){ return `<button class="btn sm${craftPart===p2?" pri":""}" onclick="setBagFilter('part','${p2}')">${p2}（${_cntByPart[p2]||0}）</button>`; }).join(" ")
      + `</div>`;
    h += `<div style="margin-bottom:8px;line-height:2.1">
      <button class="btn sm${craftFilter==="可打造"?" pri":""}" onclick="setBagFilter('craft','${craftFilter==="可打造"?"全部":"可打造"}')">✅ 只看材料齐备（${_okNow}）</button></div>`;
    h += `<div class="scroll-y">`;
    let _shown = 0;
    _partFiltered.forEach(function(g){
      const n = g[0];
      const mm = craftMainMat(n);
      const sub = subTiers(g[1]).join(" 或 ");
      const subCnt = subMatCount(g[1], g[2]);
      const cost = craftCost(g[1]) * 10000;
      const hasMain = (S.mats[mm.mat]||0) >= mm.cnt;
      const subsOk = !!pickSubMats(g[1], mm.mat, subCnt);
      const moneyOk = S.money >= cost;
      const ok = hasMain && subsOk && moneyOk;
      if(craftFilter === "可打造" && !ok) return;      // v1.38g：只显示材料齐备的图纸
      _shown++;                                        // v1.38j：已显示计数（空列表提示用）
      const missing = [];
      if(!hasMain) missing.push("主材料 " + mm.mat + "×" + mm.cnt + "（有 " + (S.mats[mm.mat]||0) + "）");
      if(!subsOk) missing.push("副材料 ×" + subCnt + "（" + sub + "）");
      if(!moneyOk) missing.push("加工费 " + fmtMoney(cost));
      h += `<div class="li" style="flex-direction:column;align-items:stretch;gap:4px">
        <div class="row" onclick="showGearDetail('${n}')" style="cursor:pointer"><b>${gearIcon(n)}${n}</b><span><span class="tier t-${g[1]}">${g[1]}</span> <span class="muted" style="font-size:10px">${gearMainTxt(g)}</span></span></div>
        <div class="muted" style="font-size:11px">${matIcon(mm.mat)}${mm.mat}×${mm.cnt}　+　${sub} ×${subCnt}　+　${fmtMoney(cost)}</div>
        <div class="row">
          <span class="muted" style="font-size:11px;color:${ok?"var(--green)":"var(--red)"}">${ok?"✅ 材料齐备":missing.join("　")}</span>
          <button class="btn sm ${ok?"pri":""}" onclick="craft('${n}')">打造</button>
        </div>
      </div>`;
    });
    if(!_shown) h += `<div class="muted" style="font-size:12px">当前筛选下没有${craftFilter==="可打造"?"可打造":"可"}的图纸。</div>`;
    h += `</div>`;
  }
  h += `</div>`;

  // ── 规则道具 ──
  const items = Object.keys(S.items || {});
  h += `<div class="card"><h3>🪄 规则道具</h3>`;
  if(!items.length){
    h += `<div class="muted">还没有道具。探索或兑换可以获得。</div>`;
  } else {
    items.forEach(function(n){
      h += `<div class="li" style="flex-direction:column;align-items:stretch;gap:4px">
        <div class="row"><b style="cursor:pointer" onclick="showItemDetail('${n}')">${n}</b>
          <div class="cnt"><span>×${S.items[n]}</span>
          <button class="btn sm pri" onclick="useItem('${n}')">使用</button></div></div>
        <div class="muted" style="font-size:11px">${ITEM_DESC[n]||""}</div>
      </div>`;
    });
  }
  h += `</div>`;

  // ── v1.35：宠物 ──
  const _pets = S.pets || [];
  h += `<div class="card"><h3>🐾 宠物（${_pets.length}）</h3>`;
  if(!_pets.length){
    h += `<div class="muted">还没有伙伴。<br><br>据说，冒险途中会遇见愿意同行的小家伙——去探索看看吧。</div>`;
  } else {
    h += `<div class="scroll-y">`;
    _pets.forEach(function(n){
      const L = PET_LINES[n], F = PET_FIXED[n];
      const pd = L ? petDataOf(n) : null;
      let nm = n, icon = "🐾", sub = petBonusNote(n) || "", btn = "";
      if(L && pd){
        icon = L.icon;
        nm = pd.stage >= 4 ? L.mut.name : L.stages[pd.stage-1].name;
        if(pd.stage < 4){
          const need = L.stages[pd.stage-1].need;
          sub = "成长 "+pd.growth+" / "+need+(pd.stage>=2?"　变异 "+(pd.mutate||0)+" / "+L.need:"")+"　·　"+sub;
          if(pd.stage === 3 && pd.growth >= need && (pd.mutate||0) >= L.need){
            btn = `<button class="btn sm pri" onclick="evolvePet('${n}')">变异！</button>`;
          } else {
            btn = `<button class="btn sm" onclick="openPetFeed('${n}')">喂食</button>`;
          }
        } else { sub = "变异形态 · " + sub; }
      } else if(n === "小狼" && S.wolf){
        icon = "🐺";
        nm = WOLF_STAGES[S.wolf.stage].name;
        const need = WOLF_STAGES[S.wolf.stage].need;
        const _wb = "材料+"+Math.round(wolfMatBonus()*100)+"%"+(wolfRateBonus()?"、成功率+"+Math.round(wolfRateBonus()*100)+"%":"");
        sub = S.wolf.stage < 4 ? ("成长 "+S.wolf.growth+" / "+need+"　·　"+_wb) : _wb;
        if(S.wolf.stage >= 4){}
        else if(S.wolf.stage === 3 && S.wolf.growth >= need && (S.wolf.mutate||0) >= WOLF_MUTATE_NEED){
          btn = `<button class="btn sm pri" onclick="evolveWolf()">变异！</button>`;
        } else {
          btn = `<button class="btn sm" onclick="openWolfFeed()">喂食</button>`;
        }
      } else if(F){
        sub = F.note;
      }
      const _carry = S.carryPet === n, _growable = !!L || n === "小狼";
      const carryBtn = _growable ? `<button class="btn sm${_carry?" pri":""}" style="margin-right:6px" onclick="setCarryPet('${n}')">${_carry?"📌 携带中":"携带"}</button>` : "";
      h += `<div class="li"><div style="flex:1;cursor:pointer" onclick="showPetDetail('${n}')"><span style="font-size:16px">${icon}</span> <b>${nm}</b>${nm!==n?`<span class="muted" style="font-size:11px">（${n}）</span>`:""}
        <div class="muted" style="font-size:11px">${sub}</div></div><div class="cnt">${carryBtn}${btn}</div></div>`;
    });
    h += `</div>`;
  }
  h += `</div>`;

  const total = keys.reduce((a,k)=>a+M[k][2]*S.mats[k],0);
  const mp = moneyParts(S.money);
  h += `<div class="card"><h3>💰 资产</h3>
    <div class="li"><span>铂金币</span><b style="color:#b89fd9">${mp.plat}</b></div>
    <div class="li"><span>金币</span><b style="color:var(--gold)">${mp.gold}</b></div>
    <div class="li"><span>银币</span><b style="color:#c0c8d8">${mp.silver}</b></div>
    <div class="li"><span>铜币</span><b style="color:#c08050">${mp.copper}</b></div>
    <div class="li" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px">
      <span>折算总额</span><b style="color:var(--gold2)">${fmtMoney(S.money)}</b></div>
    <div class="li"><span>材料估值</span><b>${fmtMoney(total)}</b></div>
  </div>`;

  el.innerHTML = h;
}

        <div class="cnt"><span>${it.vit} 点</span>

  h += `<div class="card"><h3>贡献商店（${S.con} 贡献）</h3>`;
  CON_SHOP.forEach((it,i)=>{ h += shopRow(it, i, "con", "buyCon", "兑换"); });
  h += `</div>`;

  // ── 图纸商店 ──
  h += `<div class="card"><h3>📜 图纸商店</h3>
    <div class="muted" style="font-size:11px;margin-bottom:8px;line-height:1.7">
      图纸按品质分档解锁。未达到公会等级的档位<b>看不到具体内容</b>。</div>`;
  const tierGroups = {};
  GEAR.forEach(function(g){
    if(g[5] === "—" || S.blueprints[g[0]]) return;      // 无图纸的 / 已有的不列
    (tierGroups[g[1]] = tierGroups[g[1]] || []).push(g[0]);
  });
  QUALITY_ORDER.forEach(function(q){
    const info = BP_SHOP[q];
    const unlocked = guildIdx() >= info.guild;
    const list = tierGroups[q] || [];
    h += `<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line)">
      <div style="font-size:12px;color:var(--gold)">${q} 图纸</div>`;
    if(!unlocked){
      h += `<div class="muted" style="font-size:11px;margin-top:2px">🔒 需公会 <b>${CFG.guildName[info.guild]} 级</b>（当前 ${guildName()} 级）　<span style="color:var(--dim2)">? 张图纸</span></div>`;
    } else if(!list.length){
      h += `<div class="muted" style="font-size:11px;margin-top:2px">该档位图纸已全部收集 ✅</div>`;
    } else {
      list.forEach(function(n){
        const canBuy = S.money >= info.price * info.curMul;
        h += `<div class="li">
          <div onclick="showGearDetail('${n}')" style="cursor:pointer;flex:1">${gearIcon(n)}${n}图纸 <span class="muted" style="font-size:10px">${gearMainTxt(gearDef(n))}</span>

          <button class="btn sm ${canBuy?"pri":""}" onclick="event.stopPropagation();buyBlueprint('${n}')">购买</button></div>`;
      });
    }
    h += `</div>`;
  });
  h += `</div>`;

  // ── 技能树 ──
  const cap = skillCap(), tot = skillTotal();
  h += `<div class="card"><h3>🌳 技能树（${tot} / ${cap || "未开放"} 级）</h3>`;
  if(cap === 0){
    h += `<div class="muted">🔒 需要公会达到 <b>D 级</b>（400 声望）才能开始升级技能。</div>`;
  } else {
    h += `<div class="muted" style="font-size:11px;margin-bottom:8px">当前贡献：${S.con}　（总级数上限随公会等级提升）</div>`;
    SKILLS.forEach(function(s){
      const lv = S.skills[s.n] || 0;
      const need = lv < 5 ? SKILL_COST[lv] : null;
      const canUp = lv < 5 && tot < cap && S.con >= need;
      h += `<div class="li" style="flex-direction:column;align-items:stretch;gap:4px">
        <div class="row"><b>${s.n}</b>
          <div class="cnt"><span>${lv} / 5</span>
          <button class="btn sm ${canUp?"pri":""}" onclick="upSkill('${s.n}')">${lv>=5?"满级":need+" 贡献"}</button></div></div>
        <div class="muted" style="font-size:11px">${s.d}</div>
      </div>`;
    });
  }
  h += `</div>`;

  h += `<div class="card"><h3>🌙 冥念护符（${S.charm} / 5 级）</h3>
    <div class="muted" style="font-size:11px;margin-bottom:8px">终极目标。成功率加成<b>不计入 E 上限</b>。</div>`;
  if(S.charm < 5){
    const c = CHARM[S.charm];
    const ok = charmUnlocked(S.charm) && S.vit >= c.cost;
    h += `<div class="li" style="flex-direction:column;align-items:stretch;gap:4px">
      <div class="row"><b>第 ${S.charm+1} 级</b>
        <button class="btn sm ${ok?"pri":""}" onclick="buyCharm()">${c.cost} 活力点</button></div>
      <div class="muted" style="font-size:11px">报酬 +${Math.round(c.pay*100)}%　成功率 +${Math.round(c.rate*100)}%${c.vit?"　活力点获取 +"+Math.round(c.vit*100)+"%":""}${c.other?"　"+c.other:""}</div>
      <div class="muted" style="font-size:11px;color:${charmUnlocked(S.charm)?"var(--green)":"var(--orange)"}">解锁条件：${c.req}${charmUnlocked(S.charm)?" ✅":"（未满足）"}</div>
    </div>`;
  } else {
    h += `<div style="color:var(--gold2);font-size:13px">✨ 已满级：报酬 +30%、成功率 +10%、活力点获取 +20%</div>`;
  }
  h += `</div>`;

  // ── 公会厨房 ──
  const meal = activeMeal();
  h += `<div class="card"><h3>🍲 公会厨房</h3>
    <div class="muted" style="margin-bottom:8px;font-size:12px;line-height:1.7">
      用食材烹饪料理。材料从背包扣除。<br>
      <b style="color:var(--gold2)">报酬 / 成功率加成只作用于「接取委托前最后吃的那道菜」</b>，精力恢复与上限提升则立即生效。
    </div>`;
  CFG.recipes.map(function(r, i){ return {r:r, i:i}; })                                          // v1.38h：按料理品级低→高展示
    .sort(function(a,b){ return QUALITY_ORDER.indexOf(cookTier(a.r)) - QUALITY_ORDER.indexOf(cookTier(b.r)); })
    .forEach(function(o){
    const r = o.r, i = o.i;
    const ok = canCook(r);
    const ing = Object.keys(r.ing).map(k => k+"×"+r.ing[k]).join("　+　");
    h += `<div class="li" style="flex-direction:column;align-items:stretch;gap:4px">
      <div class="row"><span><b>${r.n}</b><span class="tier t-${cookTier(r)}" style="font-size:9px;margin-left:6px">${cookTier(r)}</span></span>
        <button class="btn sm ${ok?"pri":""}" onclick="cook(${i})">烹饪</button></div>
      <div class="muted" style="font-size:11px">${ing}</div>
      <div style="font-size:12px;color:var(--green)">${r.desc}</div>
    </div>`;
  });
  if(meal){
    const mb = Math.round((meal.bonus||0)*100), mr = Math.round((meal.rate||0)*100);
    h += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--green);line-height:1.8">
      🍽 当前生效：<b>${meal.name}</b>${mb?"　报酬 +"+mb+"%":""}${mr?"　成功率 +"+mr+"%":""}<br>
      <span class="muted">下一次接取的委托享受此加成（每个委托只吃一道菜）</span></div>`;
  }
  h += `</div>`;

  h += `<div class="card"><h3>说明</h3><div class="muted">
    货币为铜本位制，金银铂金在显示时自动拆分（1 金 = 100 银 = 10,000 铜）——材料买卖的银币、委托报酬的金币都以铜结算。<br>
    公会商店（图纸）、铂金商店、贡献商店、交易所（材料买卖）均已实装；货币兑换因自动拆分而无需单独操作。
  </div></div>`;

  el.innerHTML = h;
}

function remindSeen(key){        // 每条提醒每天只触发一次（localStorage 记账）
  const day = todayStr();
  let o = {};
  try { o = JSON.parse(localStorage.getItem("adv_reminds")||"{}"); } catch(e){}
  if(o[key]) return true;
  o[key] = 1;
  for(const k in o) if(k.indexOf(day) !== 0) delete o[k];   // 只保留当天的记录

  return false;
}

/* ══════════════════════════════════════════════════
   ★ Flask 桥接层
   状态由服务端（SQLite + 补算引擎）权威提供。
   本段重定义原型的存档 / 补算 / 动作函数为 API 调用——同名函数声明，
   后声明生效，覆盖上方原型实现（原实现保留作参考，不再被调用）。
   ══════════════════════════════════════════════════ */

/* ── 状态适配：服务端 snake_case → 原型 S 结构 ── */
function camelKey(k){ return k.replace(/_([a-z])/g, function(_, c){ return c.toUpperCase(); }); }
function adaptState(sv){
  const out = {};
  for(const k in sv) out[camelKey(k)] = sv[k];
  // 日志：服务端 {ts,msg,cls} → 原型 {t,m,c}
  out.log = (sv.log || []).map(function(e){
    const d = new Date(e.ts);
    return { t:(d.getMonth()+1+"").padStart(2,"0")+"-"+(d.getDate()+"").padStart(2,"0")+" "+hhmm(d),
             m:e.msg, c:e.cls || "" };
  });
  out.results = sv.results || [];
  out.pendingRare = sv.pending_rare || [];
  out.exploreResult = sv.explore_result || null;
  out.pendingEvent = sv.pending_event || null;
  out.eventResult = sv.event_result || null;
  out.legendPool = null;
  return out;
}

/* ── 轻提示（展示服务端消息） ── */
let _toastEl = null, _toastTimer = null;
function toast(msg){
  if(!_toastEl){
    _toastEl = document.createElement("div");
    _toastEl.style.cssText = "position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:500;"
      + "background:rgba(28,28,38,.97);border:1px solid var(--line);border-radius:10px;padding:8px 16px;"
      + "font-size:12.5px;color:var(--gold2);max-width:86vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s";
    document.body.appendChild(_toastEl);
  }
  _toastEl.textContent = msg;
  _toastEl.style.opacity = "1";
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ _toastEl.style.opacity = "0"; }, 2600);
}

/* ── API 通讯 ── */
async function apiCall(action, data){
  const r = await fetch("/api/action", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({action:action}, data || {})) });
  const j = await r.json().catch(function(){ return { error:"无法连接服务器" }; });
  if(!j.state){
    showAlert(j.error || "无法连接服务器", "提示");
    if(j.gate) setTimeout(function(){ location.reload(); }, 1200);   // 口令失效 → 回访问验证页
    return j;
  }
  applyServer(j);
  if(j.error) showAlert(j.error);
  return j;
}
async function refreshState(){
  const r = await fetch("/api/state", {cache:"no-store"});
  const j = await r.json().catch(function(){ return {}; });
  if(!j.state){
    if(j.gate) setTimeout(function(){ location.reload(); }, 600);     // 口令失效 → 自动回验证页
    return j;
  }
  applyServer(j);
  return j;
}
function applyServer(j){
  S = adaptState(j.state);
  S.account = j.account || S.account;          // v1.37：账号（接入码）
  (j.msgs || []).forEach(function(m){ toast(m); });
  render();
  if(!S.name) showIntro(); else hideIntro();   // v1.37：接入码找回后自动进入游戏
  flushResults();
  maybeShowExploreFlow();
}
/* tick 覆盖：原型本地补算 → 服务端 catch_up */
async function tick(){ await refreshState(); }

/* ── 结算结果 / 稀有事件弹窗队列（服务端驱动；播 3D 骰子后逐条展示） ── */
let _queueBusy = false, _resultResolve = null;
function flushResults(){
  if(_queueBusy) return;
  if(document.getElementById("modal").classList.contains("on")) return;
  _queueBusy = true;
  (async function(){
    let consumed = false;
    while(S.results && S.results.length){
      consumed = true;
      const r = S.results.shift();                 // UI 侧消费（消费完统一 ack）
      await queueRoll3D(r.roll);
      await questAnimWait(r);                      // v1.35：emoji 迷你动画
      await showResultModal(r);
    }
    while(S.pendingRare && S.pendingRare.length){
      consumed = true;
      const ev = S.pendingRare.shift();
      await showRareModal(ev);
    }
    if(S.pendingLegend){
      consumed = true;
      const pl = S.pendingLegend;
      S.pendingLegend = null;                      // 本地清空防重复；服务端随 results_ack 落库
      await new Promise(function(resolve){
        dlg("特殊事件",
          "<div style='text-align:center;font-size:15px;color:var(--gold);margin-bottom:8px'>⚡ 触发特殊事件！</div>"
          + (pl.preview
              ? "你隐约听见【" + pl.title + "】「" + pl.name + "」的低语——尚未达到参与条件，只能远远望见（仅预览）。<br><br>到「冒险者委托」页 · 特殊事件窗口查看详情。"
              : "【" + pl.title + "】「" + pl.name + "」已出现。<br><br>到「冒险者委托」页 · 特殊事件窗口查看详情并接取。"),
          [{text:"确定", cls:"pri", fn:resolve}]);
      });
    }
    _queueBusy = false;
    if(consumed){ await apiCall("results_ack"); return; }
    // 昨日快照（优先级最低）
    if(S.yesterday && !S.yesterdayShown && !document.getElementById("dlg").classList.contains("on")){
      showYesterday();
    }
  })();
}
function showResultModal(r){
  return new Promise(function(resolve){
    _resultResolve = resolve;
    showResult(r.name, r.roll, r.need, r.title, r.gold, r.exp, r.got, r.cls);
  });
}
function showRareModal(ev){
  return new Promise(function(resolve){
    dlg("稀有事件",
      "<div style='text-align:center;font-size:15px;color:var(--gold);margin-bottom:8px'>✨ " + ev.name + "</div>" + ev.msg,
      [{text:"确定", cls:"pri", fn:resolve}]);
  });
}
function closeModal(){
  document.getElementById("modal").classList.remove("on");
  const f = _resultResolve; _resultResolve = null;
  if(f) f();
  setTimeout(flushResults, 260);
}

/* ── 探索结果 / 探索事件弹窗流（服务端驱动） ── */
function maybeShowExploreFlow(){
  if(_queueBusy) return;
  if(document.getElementById("modal").classList.contains("on")) return;
  if(document.getElementById("dlg").classList.contains("on")) return;
  if(S.exploreResult){
    const er = S.exploreResult;
    dlg("探索 · " + er.region, '<div class="dlg-msg">' + er.msg + '</div>',
      [{text:"确定", cls:"pri", fn:function(){ apiCall("explore_ack"); }}]);
    return;
  }

      if(!j.error) showAlert("🌌 变异成功！<br><br>它睁开金瞳，仰天长啸——<br><b>远古魔狼</b>：材料掉落率 <b>+8%</b>、委托成功率 <b>+3%</b>。", "远古魔狼");
    });
  }, "远古魔狼");
}

/* ── 存档（SQLite 后端） ── */
async function exportSave(){
  try{ await refreshState(); }catch(e){}
  const snap = Object.assign({}, S);          // v1.38d：导出 camel 存档（与原型创造版互通）
  delete snap.account;
  delete snap.legendPool;
  const data = JSON.stringify(snap, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a2 = document.createElement("a");
  a2.href = url;
  a2.download = "健康的冒险者的一天_"+(S.name||"冒险者")+"_"+todayStr()+".json";
  document.body.appendChild(a2);
  a2.click();
  document.body.removeChild(a2);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showAlert("已导出存档快照（JSON）。<br><br>该文件可导入原型创造版；正式备份请复制电脑上的 <b>Flask版/data/adventurer.db</b>。", "导出快照");
}
function importSaveFile(){                          // v1.38d：导入原型 / 快照 JSON（存档互通）
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.onchange = function(e){
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = function(ev){
      let d;
      try{ d = JSON.parse(ev.target.result); }
      catch(err){ return showAlert("导入失败：不是有效的 JSON 文件"); }
      if(!d || typeof d !== "object" || Array.isArray(d))
        return showAlert("导入失败：存档格式不正确");
      showConfirm("导入将<b>覆盖当前账号的进度</b>（建议先「导出快照」备份），确定继续？", function(){
        apiCall("import_save", {data: d}).then(function(j){
          if(!j.error) showAlert("已导入存档：「" + ((j.state && j.state.name) || "未命名") + "」", "导入存档");
        });
      }, "导入存档");
    };
    r.readAsText(f);
  };
  inp.click();
}
function importSave(){
  showAlert("存档保存在电脑的 SQLite 数据库：<b>Flask版/data/adventurer.db</b><br><br>"
    + "· 备份 / 恢复：复制或替换该文件即可<br>"
    + "· 电脑与手机访问的是同一份存档<br>"
    + "· 「导出快照」下载的 JSON 仅用于查阅", "数据说明");
}
function resetAll(){
  showConfirm("确定清空所有进度重新开始？<br>此操作不可撤销。<br><br>建议先备份电脑上的 data/adventurer.db 文件。", function(){
    apiCall("reset").then(function(){
      document.getElementById("nameInput").value = "";
      showIntro();
    });
  }, "重置存档");
}
</script>

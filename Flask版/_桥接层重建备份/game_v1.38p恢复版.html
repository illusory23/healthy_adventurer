<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="健康的冒险者的一天">
<title>健康的冒险者的一天</title>
<!-- 3D 物理骰子引擎（来自「尘封之卷」骰娘项目的 dice-engine-v3） -->
<script type="importmap">{"imports":{"three":"./3d骰子/three/three.module.min.js","cannon-es":"./3d骰子/three/cannon-es.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1a1c30; --panel:#242844; --panel2:#2e3254; --line:#40456e;
  --gold:#e8b54a; --gold2:#ffd97a; --green:#5fd49a; --red:#f07a72;
  --blue:#6cb4f5; --purple:#b48cf0; --orange:#f5a04e;
  --txt:#eef0fb; --dim:#9aa0c8; --dim2:#6c7198;
}
body{
  /* v1.35：晨昏背景——光晕颜色由 data-tod 切换（JS 按现实时间设置） */
  --amb1:rgba(124,104,255,.16); --amb2:rgba(232,181,74,.08); --amb3:rgba(96,160,255,.07); --bgc:var(--bg);
  background:
    radial-gradient(1100px 520px at 50% -8%, var(--amb1) 0%, transparent 58%),
    radial-gradient(900px 460px at 88% 4%, var(--amb2) 0%, transparent 52%),
    radial-gradient(760px 520px at 6% 100%, var(--amb3) 0%, transparent 55%),
    var(--bgc);
  background-attachment:fixed;
  color:var(--txt); font-size:15px; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
body[data-tod="dawn"]{   --amb1:rgba(255,170,90,.15); --amb2:rgba(255,220,140,.13); --amb3:rgba(255,140,120,.08); --bgc:#2b2030 }
body[data-tod="day"]{    --amb1:rgba(110,170,255,.18); --amb2:rgba(255,230,160,.10); --amb3:rgba(120,220,255,.08); --bgc:#1c2238 }
body[data-tod="dusk"]{   --amb1:rgba(255,120,90,.15); --amb2:rgba(255,170,80,.12); --amb3:rgba(170,90,200,.10); --bgc:#291c33 }
body[data-tod="evening"]{--amb1:rgba(140,110,255,.18); --amb2:rgba(200,130,255,.08); --amb3:rgba(90,110,255,.08); --bgc:#1c1a2e }
/* ── 顶部固定区（资源栏 + 标签栏 一起吸顶）── */
#topbar{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(180deg,#2a2e52 0%,#222540 100%);
  box-shadow:0 4px 18px rgba(0,0,0,.5), inset 0 -1px 0 rgba(232,181,74,.22);
}
#hud{
  background:transparent;
  border-bottom:1px solid rgba(232,181,74,.14); padding:8px 12px calc(8px + env(safe-area-inset-top,0));
  padding-top:calc(8px + env(safe-area-inset-top,0));
}
.hud-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hud-lv{font-weight:700;color:var(--gold2);font-size:16px}
.hud-guild{font-size:12px;color:var(--dim)}
.hud-date{font-size:12px;color:var(--dim)}
.hud-bars{display:flex;gap:8px;margin-bottom:6px}
.bar{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.bar-exp i{background:linear-gradient(90deg,#4a86e8,#6cb4f5)} .bar-en i{background:linear-gradient(90deg,#3fae75,#5fd49a)}
.bar-en i.warn{background:linear-gradient(90deg,#c9a227,#e8c84a)}   /* v1.34：精力 ≤66% 黄 */
.bar-en i.low{background:linear-gradient(90deg,#b0332a,#e05a4a)}    /* v1.34：精力 ≤33% 红 */
.bar-lab{font-size:10px;color:var(--dim2);margin-top:2px;display:flex;justify-content:space-between}
.hud-res{display:flex;gap:10px;font-size:12px;flex-wrap:wrap}
.hud-res span{color:var(--dim)}
.hud-res b{color:var(--txt);font-weight:600}
/* ── 标签页 ── */
#tabs{
  display:flex; background:linear-gradient(180deg,#20233e,#1d2036);
  border-bottom:1px solid var(--line);
}
#tabs button{
  flex:1; padding:10px 2px; background:none; border:none; color:var(--dim);
  font-size:12px; font-family:inherit; cursor:pointer; border-bottom:2px solid transparent;
  white-space:nowrap;
}
#tabs button.on{color:var(--gold2);border-bottom-color:var(--gold);text-shadow:0 0 14px rgba(255,217,122,.5)}
main{padding:14px;max-width:980px;margin:0 auto}
/* ── 通用 ── */
.card{background:linear-gradient(165deg,#2b2f52 0%,#232744 62%);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.035);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.42),0 0 0 1px rgba(232,181,74,.16),inset 0 1px 0 rgba(255,255,255,.04)}   /* v1.35 微交互 */
.card h3{font-size:15.5px;color:var(--gold2);margin-bottom:10px;font-weight:600;padding-left:9px;border-left:3px solid var(--gold);line-height:1.25;text-shadow:0 0 16px rgba(232,181,74,.3)}
.muted{color:var(--dim);font-size:12.5px}
.btn{
  display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid #4a5080;
  background:linear-gradient(180deg,#343a62,#282c4c);color:var(--txt);font-size:13px;font-family:inherit;white-space:nowrap;flex-shrink:0;min-width:max-content;
  cursor:pointer;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.btn:active{transform:scale(.97)} .btn:hover{filter:brightness(1.1)}   /* v1.35 微交互 */
.btn.pri{background:linear-gradient(180deg,#f2c65e,#d9a03c);border-color:#f7d47a;color:#241d08;font-weight:600;box-shadow:0 2px 12px rgba(232,181,74,.4)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.meal-btn{padding:8px 13px;font-size:13px;white-space:nowrap;min-width:72px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center}   /* v1.32：三餐按钮加大 + 文本居中 */
.cnt{flex-wrap:wrap;justify-content:flex-end}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:8px}
.grid2{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
/* ── 委托页双栏布局 ── */
.qsplit{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:900px){
  main:has(#tab-quest.on){max-width:1400px}
  .qsplit{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:10px;align-items:start}
}
/* ── 委托卡 ── */
.quest{background:linear-gradient(160deg,#30345a,#282c4c);border:1px solid #454b7a;border-radius:10px;padding:13px;cursor:pointer;transition:.15s;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.quest:hover{box-shadow:0 0 0 1px rgba(232,181,74,.5),0 7px 20px rgba(0,0,0,.4)}   /* v1.35 微交互 */
/* v1.35：图鉴收集册 */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.gal-cell{background:linear-gradient(160deg,#30345a,#282c4c);border:1px solid #454b7a;border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;line-height:1.35;font-size:12px}
.gal-cell.dim{opacity:.3;filter:grayscale(.85)}
.gal-cell.bp{opacity:.62;filter:grayscale(.3)}
.gal-cell .gname{font-size:11.5px}
.quest:active{transform:scale(.98)}
@media(hover:hover){.quest:hover{border-color:#6068a8;transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.35)}}
.quest.dis{opacity:.4;cursor:not-allowed}
.quest b{display:block;font-size:15.5px;margin-bottom:5px}
.quest .meta{font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:7px}
.diff{font-size:10.5px;padding:2px 6px;border-radius:3px;font-weight:600}
.d-简单{background:linear-gradient(180deg,#2f6046,#264c38);color:#8fe9b2;border:1px solid #3d7a58}
.d-普通{background:linear-gradient(180deg,#2e4a66,#264058);color:#8cc6f2;border:1px solid #3d648c}
.d-困难{background:linear-gradient(180deg,#5c452a,#4a3a24);color:#f0c084;border:1px solid #7c5f3a}
.d-噩梦{background:linear-gradient(180deg,#5e3030,#4a2828);color:#f59a92;border:1px solid #8a4444}
.rate{color:var(--gold2);font-weight:600}
/* ── 健康打卡 ── */
.hitem{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:none}
.hitem .nm{font-size:15px}
.hitem .pt{font-size:12px;color:var(--gold);margin-left:6px}
.cnt{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cnt button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:16px;cursor:pointer;font-family:inherit}
.cnt span{min-width:20px;text-align:center;font-size:13px}
.total{font-size:36px;font-weight:700;color:var(--gold2);text-align:center;text-shadow:0 0 24px rgba(232,181,74,.4)}
.total small{font-size:14px;color:var(--dim);font-weight:400}
/* ── 列表 ── */
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:none}
.li>div:first-child{flex:1;min-width:0}   /* v1.38f：名字区可收缩，防止按钮被挤压导致文字溢出 */
.scroll-y{max-height:300px;overflow-y:auto;overflow-x:hidden;padding-right:2px}   /* v1.38g：长列表滚动（仅纵向，避免横向滚动条遮挡右侧按钮） */
.shopR{width:76px;accent-color:var(--gold);cursor:pointer;touch-action:none}     /* v1.38k：商店数量拖动条（v1.38o：防移动端滚动抢占致"一拖到底"） */
.scroll-y::-webkit-scrollbar{width:6px}
.scroll-y::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.tier{font-size:10px;padding:1px 5px;border-radius:3px;margin-left:6px}
.t-普通{background:#3c4266;color:#aab0d8} .t-精良{background:#2f6046;color:#8fe9b2}
.t-稀有{background:#2e4a66;color:#8cc6f2} .t-史诗{background:#4a3a70;color:#c8aef5}
.t-传说{background:#6b4520;color:#f5bc74}
/* ── 日志 ── */
.log{font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.log:last-child{border-bottom:none}
.log .t{color:var(--dim2);margin-right:8px}
.log.ok{color:var(--green)} .log.bad{color:var(--red)} .log.gold{color:var(--gold)}
/* ── 弹层 ── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.on{display:flex}
#modal .box{background:linear-gradient(165deg,#2b2f52,#232744);border:1px solid #4a5080;border-radius:12px;padding:20px;max-width:340px;width:100%;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.55);animation:popIn .2s cubic-bezier(.2,.8,.3,1.1)}
#modal .d100{font-size:52px;font-weight:700;margin:12px 0}
.tabpage{display:none} .tabpage.on{display:block;animation:tabIn .22s ease-out}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}   /* v1.35 微交互 */
.float-txt{position:fixed;left:50%;top:36%;transform:translateX(-50%);font-size:26px;font-weight:700;pointer-events:none;z-index:500;text-shadow:0 2px 14px rgba(0,0,0,.7);animation:floatUp 1s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,14px) scale(.8)}18%{opacity:1;transform:translate(-50%,0) scale(1.06)}100%{opacity:0;transform:translate(-50%,-48px) scale(1)}}
@keyframes numPop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
.total.pop{animation:numPop .32s ease}   /* v1.35 打卡反馈 */
.celebrate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:600;animation:celeFade 2.3s ease forwards}
.celebrate-inner{text-align:center;animation:celeZoom .75s cubic-bezier(.2,.8,.3,1.2)}
.celebrate-ico{font-size:64px;filter:drop-shadow(0 0 30px rgba(232,181,74,.9))}
.celebrate-t{font-size:28px;font-weight:800;color:var(--gold2);text-shadow:0 0 30px rgba(232,181,74,.8);letter-spacing:5px;margin-top:6px}
.celebrate-s{font-size:15px;color:var(--gold);margin-top:4px}
@keyframes celeZoom{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes celeFade{0%,72%{opacity:1}100%{opacity:0}}
#modal .box.gold-glow{animation:popIn .2s cubic-bezier(.2,.8,.3,1.1),goldPulse 1.5s ease}
@keyframes goldPulse{0%,100%{box-shadow:0 14px 44px rgba(0,0,0,.55)}50%{box-shadow:0 0 60px rgba(232,181,74,.6),0 14px 44px rgba(0,0,0,.55)}}   /* v1.35 时刻演出 */
/* v1.35：委托 emoji 迷你动画（目标移动 → 武器突进 → 命中 → 结算文本） */
.qanim{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:550;background:rgba(10,12,26,.6);animation:qanimBg 2.5s ease forwards}
.qanim-stage{position:relative;width:min(340px,82vw);height:130px;overflow:hidden}
.qanim-target,.qanim-weapon,.qanim-hit,.qanim-fall{position:absolute;top:42px;font-size:46px}
.qanim-target{left:50%;transform:translateX(-50%)}
.qanim-weapon{left:0;top:48px;font-size:36px;opacity:0}
.qanim-hit{left:50%;transform:translateX(-50%) scale(.3);opacity:0;font-size:42px;top:38px}
.qanim-fall{left:50%;transform:translateX(-50%);opacity:0;top:48px;font-size:40px}
.qanim-text{font-size:18px;font-weight:700;letter-spacing:1px;opacity:0;animation:qText 2.5s ease forwards;text-align:center;padding:0 16px}
.qanim.win .qanim-text{color:var(--gold2)}
.qanim.lose .qanim-text{color:var(--red)}
.qanim.win .qanim-target{animation:qTarget 2.5s ease forwards}
.qanim.lose .qanim-target{animation:qTargetFlee 2.5s ease forwards}
.qanim .qanim-weapon{animation:qWeapon 2.5s ease forwards}
.qanim.win .qanim-hit{animation:qHit 2.5s ease forwards}
.qanim.win .qanim-fall{animation:qFall 2.5s ease forwards}
@keyframes qanimBg{0%{opacity:0}10%{opacity:1}84%{opacity:1}100%{opacity:0}}
@keyframes qTarget{0%{left:34%;opacity:0}12%{opacity:1}24%{left:66%}36%{left:42%}48%{left:58%}56%{left:50%;opacity:1}60%{opacity:0}100%{left:50%;opacity:0}}
@keyframes qTargetFlee{0%{left:34%;opacity:0}12%{opacity:1}24%{left:66%}40%{left:44%}52%{left:60%}66%{left:50%;opacity:1}100%{left:130%;opacity:0}}
@keyframes qWeapon{0%,26%{left:4%;opacity:0;transform:rotate(0)}32%{opacity:1}52%{left:44%;opacity:1;transform:rotate(10deg)}58%{left:46%;opacity:1}64%{opacity:0}100%{left:46%;opacity:0}}
@keyframes qHit{0%,53%{opacity:0;transform:translateX(-50%) scale(.3)}58%{opacity:1;transform:translateX(-50%) scale(1.5)}78%{opacity:0;transform:translateX(-50%) scale(2)}100%{opacity:0}}
@keyframes qFall{0%,58%{opacity:0}64%{opacity:1}100%{opacity:1}}
@keyframes qText{0%,70%{opacity:0}82%{opacity:1}100%{opacity:1}}
/* ── 开场 ── */
#intro{position:fixed;inset:0;background:radial-gradient(900px 520px at 50% 0%,#2c3054 0%,#1a1c30 72%);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px}
#intro.hide{display:none}
.intro-box{text-align:center;max-width:330px;width:100%}
.intro-box h1{font-size:21px;color:var(--gold2);margin-bottom:22px;letter-spacing:2px;font-weight:700;text-shadow:0 0 26px rgba(232,181,74,.45)}
.intro-box .sub{font-size:13px;color:var(--dim);line-height:1.9;margin-bottom:4px}
#nameInput{width:100%;padding:13px;margin:20px 0 14px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;color:var(--txt);font-size:16px;text-align:center;font-family:inherit;letter-spacing:1px}
#nameInput:focus{outline:none;border-color:var(--gold)}
#nameInput::placeholder{color:var(--dim2);letter-spacing:0}
.intro-box .btn{width:100%;padding:12px;font-size:15px}
.intro-box .tip{font-size:11px;color:var(--dim2);margin-top:14px;line-height:1.7}
.hud-name{font-weight:700;color:var(--gold2);font-size:16px;letter-spacing:.5px}
/* ── 通用弹窗 ── */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
#dlg.on{display:flex}
.dlg-box{background:linear-gradient(165deg,#2b2f52,#232744);border:1px solid #4a5080;border-radius:12px;padding:18px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 14px 44px rgba(0,0,0,.55);animation:popIn .2s cubic-bezier(.2,.8,.3,1.1)}
.dlg-title{font-size:16px;color:var(--gold);margin-bottom:12px;font-weight:600;text-align:center}
.dlg-msg{font-size:14px;line-height:1.8;color:var(--txt)}
.dlg-btns{display:flex;gap:8px;margin-top:16px;justify-content:center}
.dlg-btns .btn{flex:1;text-align:center}
/* ── 委托详情 ── */
.qd-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.qd-row:last-child{border-bottom:none}
.qd-row span{color:var(--dim)}
.qd-row b{color:var(--txt)}
.qd-desc{font-size:13px;line-height:1.8;color:var(--dim);background:linear-gradient(160deg,#2e3254,#272b4a);border:1px solid #3a3f68;border-radius:8px;padding:10px;margin:10px 0}
.qd-mat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.qd-rate{text-align:center;font-size:34px;font-weight:700;color:var(--gold2);margin:8px 0;text-shadow:0 0 24px rgba(232,181,74,.4)}
.qd-rate small{font-size:13px;color:var(--dim);display:block;font-weight:400}
@media(min-width:700px){ #tabs button{flex:none;padding:10px 26px;font-size:13px} }
@media(max-width:700px){   /* v1.38：手机底部导航（拇指可达） */
  #tabs{position:fixed;bottom:0;left:0;right:0;z-index:90;border-bottom:none;border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(0,0,0,.38)}
  #tabs button{padding:9px 2px 11px;font-size:11px}
  body{padding-bottom:68px}
}
</style>
</head>
<body>

<div id="topbar">
<header id="hud">
  <div class="hud-top">
    <div><span class="hud-name" id="hName">冒险者</span> <span class="hud-lv" id="hLv">Lv1</span> <span class="hud-guild" id="hGuild">公会 F</span></div>
    <div class="hud-date" id="hDate"></div>
  </div>
  <div class="hud-bars">
    <div style="flex:1"><div class="bar bar-exp"><i id="hExpBar" style="width:0%"></i></div><div class="bar-lab"><span>经验</span><span id="hExpTxt">0/40</span></div></div>
    <div style="flex:1"><div class="bar bar-en"><i id="hEnBar" style="width:100%"></i></div><div class="bar-lab"><span>精力</span><span id="hEnTxt">60/60</span></div></div>
  </div>
  <div class="hud-res">
    <span>💰<b id="hMoney">0</b></span>
    <span>⭐声望<b id="hRep">0</b></span>
    <span>🔨贡献<b id="hCon">0</b></span>
    <span>🌙活力点<b id="hVit">0</b></span>
    <span>🍀健康<b id="hHp">0</b></span>
  </div>
</header>

<nav id="tabs">
  <button class="on" data-t="quest">冒险者委托</button>

"星陨坑探查":"一颗星坠进了东边的荒地，烧焦的土里混着细碎的星尘。法师说：去看看，但别碰发光的东西。",
"游侠哨站补给护送":"边地的游侠哨站三个月没收到补给了。这一车干粮和箭矢，要走四十里野路。",
"鸦巢悬崖索降":"鸦人在悬崖上筑了巢，偷来的货物堆得像个集市。你需要一根足够长的绳子，和足够的胆量。",
"半兽人营地侦察":"半兽人在北谷扎了营，篝火彻夜不熄。公会要一张营地布防图——摸进去，再活着出来。",
"狩获沼泽巨蟒":"放贷人的骡队在沼泽边丢了两匹牲口。巨蟒的鳞皮值钱，前提是你能完整地把它带回来。",
"月下狼嚎追踪":"月圆之夜，狼嚎从未名森林传来。猎人们说那不是狼——是比狼更古老的东西在唤月。",
"采集沼泽泥炭":"沼泽的泥炭是取暖的好料，也是止血草最喜欢的温床。蹚过去——小心别陷进去。",
"矿工失踪搜救":"三个矿工在东岭矿道里失了踪。家属的哭声比矿灯更让人喘不过气。快一点。",
"破晓巡林":"天光初亮时，护林人沿着林线走一圈，查看夜里的足迹。这是份安静的差事——通常来说。",
"失踪商队搜寻":"商队连同货物消失在了迷雾谷。定金已经收了——剩下的事，就是把人和货找回来。",
"虚空裂谷取样":"北境的虚空裂谷仍在缓慢生长。法师塔要一份「活的」样本——报酬丰厚，活着回来更重要。",
"石化蜥蜴巢穴":"传说荒原之下的巢穴里睡着石化蜥蜴。它的眼睛能换一栋房子，可惜前提是——你还得能眨眼睛。",
"被遗忘的圣坛":"旧神被遗忘之后，圣坛无人打理。考古学会想知道：祭坛上那枚符文石为什么还在发烫。",
"猎杀双足飞龙":"双足飞龙在峡谷筑巢后，商队不得不绕行三天。王的悬赏贴了整整一年——今天终于列入了你的任务栏。",
"秘银矿脉深掘":"浅层的秘银已经采尽。矿工会付双倍工钱，请你护送他们深入那条发着蓝光的矿道。",
"星穹巡礼":"星界之门每十九年开启一次。王庭委托最勇敢的冒险者：去星之彼端走一遭，带回一粒星的尘埃。",
"噬星者讨伐":"噬星者的阴影已经掠过了三个村庄的夜空。所有的占星师都指向同一个结论：必须有人去做这件事。",
"世界树冠采摘":"世界树的树冠高过云层。精灵们说，只有迎着晨光爬上去的人，才够格带走那截发光的树皮。",
"泰坦遗骸发掘":"泰坦的骸骨横卧在高原上，像一道白色的山脉。考古队需要一个敢爬进巨兽颅骨里的人。",
/* ── v1.32 新增：Lv4/Lv5 简单档 ── */
"商队护卫见习":"商会新开的短途线路缺人手。跟着老护卫走一趟，认路、学规矩——真遇上事，报公会名号就行。",
"王都巡夜":"王都的夜安静得很，巡夜多半只是提着灯走几圈。偶尔拦下醉汉、帮迷路的孩子找到家门——巡的是夜，守的是人心。",
"药圃除虫":"药材圃的虫子成灾了。药师说不用药，要手工捉——手要稳，心要细，捉满一罐子就算完工。",
"猎场驱兽":"贵族猎场的野物太多，把鹿群都挤瘦了。不用伤它们，赶回深林就成——猎场管事会盯着你，别耍花招。",
"王宫礼仪护卫":"王宫的宴会需要一队站得笔直的护卫。不必拔剑——站在那里，让宾客安心，就是你的任务。",
"星象台职守":"观星夜需要有人守着星象台的阶梯。法师们说夜深露重，不许任何人打扰——你只管守着那扇门，和一整个夜空。",
"灵植园培育":"法师塔的灵植园里种着会发光的草。浇水、松土、跟它们说说话——园丁说最后一条才是关键。",
"龙巢外围巡查":"黑龙的巢穴安静了很久，王庭仍要例行巡查。远远地记下龙巢的动静就好——字面意义上的，远远地。",
};

/* 当前「游戏日」（YYYY-MM-DD）。日界线为每天早上 6 点：
   00:00~05:59 视为前一天（熬夜时段不提前跨天），06:00 起进入新的一天 */
function fmtDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayStr(d){
  d = d || new Date();
  if(d.getHours() < CFG.dayCutoffHour) d = new Date(d.getTime() - 86400000);   // 6 点前 → 算前一天
  return fmtDate(d);
}
function hhmm(d){ return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
/* ── v1.28：局外时钟 / 打卡时间窗工具 ── */
const MEAL_NAMES = ["早餐","午餐","晚餐"];
function minOfDay(d){ d = d || new Date(); return d.getHours()*60 + d.getMinutes(); }
function winRange(win){ const a = win[0].split(":"), b = win[1].split(":"); return [+a[0]*60 + +a[1], +b[0]*60 + +b[1]]; }
function inWindowNow(win, d){ const r = winRange(win); const c = minOfDay(d); return r[0] <= c && c <= r[1]; }
function todPhase(d){        // v1.35：晨昏背景时段（night / dawn / day / dusk / evening）
  const m = minOfDay(d || new Date());
  if(m < 5*60 || m >= 22*60) return "night";
  if(m < 9*60)  return "dawn";
  if(m < 17*60) return "day";
  if(m < 19*60) return "dusk";
  return "evening";
}
function timePhase(d){       // 局外时段词（如「午后」）
  d = d || new Date();
  const m = minOfDay(d);
  if(m < 5*60) return "凌晨";
  if(m < 7*60) return "清晨";
  if(m < 9*60) return "早晨";
  if(m < 11*60) return "上午";
  if(m < 13*60) return "中午";
  if(m < 17*60) return "午后";
  if(m < 19*60) return "傍晚";
  if(m < 22*60) return "晚上";
  return "深夜";
}

function migrate(o){
  const base = newState();
  for(const k in base) if(o[k] === undefined) o[k] = base[k];
  // 嵌套对象逐层补全
  if(!o.equipped || typeof o.equipped !== "object") o.equipped = {weapon:null, armor:null, accessory:null, charmSlot:null};
  ["weapon","armor","accessory","charmSlot"].forEach(function(k){ if(o.equipped[k] === undefined) o.equipped[k] = null; });
  if(!o.skills || typeof o.skills !== "object") o.skills = {体能:0,专注:0,社交:0,生存:0,幸运:0};
  ["体能","专注","社交","生存","幸运"].forEach(function(k){ if(o.skills[k] === undefined) o.skills[k] = 0; });
  if(!o.items || typeof o.items !== "object") o.items = {};
  if(!Array.isArray(o.gear)) o.gear = [];
  if(!o.daily || typeof o.daily !== "object") o.daily = {};
  const d0 = {date:todayStr(), done:0, gold:0, exp:0, rep:0, con:0, vit:0, quests:[], mats:{}, events:[]};
  for(const k in d0) if(o.daily[k] === undefined) o.daily[k] = d0[k];
  if(!o.mealCap || typeof o.mealCap !== "object") o.mealCap = {date:"", cap:0};
  if(!o.health || typeof o.health !== "object") o.health = {date:todayStr(), done:[0,0,0,0,0,0,0], multi:[0,0], score:0};
  if(!Array.isArray(o.health.meals) || o.health.meals.length !== 3)
    o.health.meals = (o.health.done && o.health.done[5]) ? [1,1,1] : [0,0,0];   // v1.28：三餐拆分迁移
  // legendWeek 旧版为数字 0，现用作周标识字符串
  if(typeof o.legendWeek !== "string") o.legendWeek = "";
  if(typeof o.legendPreview !== "boolean") o.legendPreview = false;
  if(o.exploreActive === undefined) o.exploreActive = null;
  if(!Array.isArray(o.titles)) o.titles = [];
  if(!Array.isArray(o.pets)) o.pets = [];
  if(typeof o.carryPet !== "string") o.carryPet = "";   // v1.38f：携带宠物
  if(o.privQuest === undefined) o.privQuest = null;     // v1.38o：公会特权委托
  if(o.privToday === undefined) o.privToday = false;
  if(o.glassQuest === undefined) o.glassQuest = null;   // v1.38o：时间沙漏委托
  if(o.glassToday === undefined) o.glassToday = false;
  if(!o.rumor || typeof o.rumor !== "object") o.rumor = null;   // v1.38o：酒馆传闻
  if(o.bonusQuest && !o.bonusQuests) o.bonusQuests = [o.bonusQuest];   // v1.38p：旧单委托转 6 选 1 列表
  if(o.bonusQuests === undefined) o.bonusQuests = null;
  if(!Array.isArray(o.seenMats)) o.seenMats = [];      // v1.35：图鉴
  if(!Array.isArray(o.forged)) o.forged = [];
  if(!Array.isArray(o.cooked)) o.cooked = [];
  if(!o.petData || typeof o.petData !== "object") o.petData = {};   // v1.35：宠物成长数据
  if(!Array.isArray(o.trophies)) o.trophies = [];
  if(!Array.isArray(o.legendDone)) o.legendDone = [];
  if(!o.doneQuests || typeof o.doneQuests !== "object") o.doneQuests = {};
  // v1.19 字段
  if(!Array.isArray(o.achv)) o.achv = [];
  if(!o.timTitles || typeof o.timTitles !== "object") o.timTitles = {};
  if(!o.exempt || typeof o.exempt !== "object") o.exempt = {sleep:"", early:""};
  if(typeof o.permEnergy !== "number") o.permEnergy = 0;
  if(typeof o.trainEnergy !== "number") o.trainEnergy = 0;

function dayHash(s){ let h = 0; for(let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }
function fmtMoney(c){
  if(c >= 1000000) return (c/1000000).toFixed(2).replace(/\.?0+$/,"")+"铂金";
  if(c >= 10000)   return (c/10000).toFixed(2).replace(/\.?0+$/,"")+"金";
  if(c >= 100)     return (c/100).toFixed(1).replace(/\.0$/,"")+"银";
  return c+"铜";
}
/* 货币拆分：1 铂金 = 100 金 = 10,000 银 = 1,000,000 铜 */
function moneyParts(total){
  total = total || 0;
  const plat = Math.floor(total / 1000000);
  let r = total % 1000000;
  const gold = Math.floor(r / 10000);
  r = r % 10000;
  const silver = Math.floor(r / 100);
  const copper = r % 100;
  return {plat, gold, silver, copper};
}
function fmtMoneyFull(total){
  const m = moneyParts(total);

  if(m.plat) out.push(m.plat + " 铂金");
  if(m.gold) out.push(m.gold + " 金币");
  if(m.silver) out.push(m.silver + " 银币");
  if(m.copper || !out.length) out.push(m.copper + " 铜币");
  return out.join(" ");
}

function calcHealth(){

  CFG.multiTasks.forEach((t,i)=>{ s += Math.min(S.health.multi[i], t[2]) * t[1]; });

function heatBonus(){   // 安眠室：每累计 7 天早睡 → 健康加成上限 +1%（最高 +5%）
  return Math.min(5, Math.floor((S.heatN||0)/7)) * 0.01;

function dinnerBonus(){       // 公会厨房：前一日「完整吃三餐」→ 今日成功率 +2%（计入 E）
  const h = S.history.length ? S.history[S.history.length-1] : null;

function successRate(q){
  const qi = (QUEST_LV[q[0]] !== undefined ? QUEST_LV[q[0]] : S.lvIdx);   // v1.30：基础率/上限按委托等级
  const name = q[0], diff = q[4];
  let B = CFG.sucBase[qi];
  // 难度修正（按委托等级覆盖）
  const ov = CFG.diffModByLv[qi+1] || {};
  let D = (diff in ov) ? (ov[diff]===null ? 0 : ov[diff]) : (CFG.diffMod[diff]||0);
  // 健康加成 = H × 0.2% × (1 + 健康加成上限)；上限来自装备 / 安眠室 / 称号「安眠守护者」
  const health = healthRateBonus();   // v1.38l：抽为函数（首页「昨日评分」处同源展示）
  // E = 武器 + 技能树·专注/生存 + 厨房（前一日三餐 +2%）
  let E = gearRate() + skillRate(q) + gearRateFor(q[1]);
  if(dinnerBonus()) E += 0.02;
  E = Math.min(CFG.eCap[qi], E);
  // 熬夜惩罚：前一日 23:30 前入睡未达标 → −15%（装备可减免 nightCut，减免封顶于惩罚本身，未熬夜不受益）
  const lastSleep = S.history.length ? S.history[S.history.length-1].sleep : true;
  const N = lastSleep ? 0 : Math.min(0, -0.15 + gearEffects().nightCut);
  const cap = CFG.hardCap[qi], floor = CFG.floor[qi];
  const _meal = activeMeal();
  const _mealR = _meal ? (_meal.rate || 0) : 0;
  const _dLv = Math.max(0, S.lvIdx - qi), _delta = Math.min(0.36, _dLv * 0.12);   // v1.32：等级差修正（+12%/级，上限 +36%）
  const _nm = (diff === "噩梦") ? gearEffects().nightmare : 0;   // v1.32：噩梦难度成功率词条
  let r = Math.min(cap, Math.max(floor, B + D + health + E + N + _mealR + charmRate() + _delta + (S.rareNextRate||0) + _nm));   // 稀有事件·前辈指点（下一次委托 +5%）
  const _fest = FESTIVALS[todayStr().slice(5)] ? 0.10 : 0;   // v1.38c：节日当天所有委托独立 +10%
  return Math.max(0, Math.min(1, r + wolfRateBonus() + petBonus().rate + _fest));   // 宠物/节日加成：独立叠加（不受硬上限 / E 上限约束）
}

/* ── v1.28：成功率分解（委托详情展示；熬夜惩罚可见化）── */
function rateBreakdown(q){
  const qi = (QUEST_LV[q[0]] !== undefined ? QUEST_LV[q[0]] : S.lvIdx);   // v1.30：按委托等级
  const diff = q[4];
  const B = CFG.sucBase[qi];
  const ov = CFG.diffModByLv[qi+1] || {};
  const D = (diff in ov) ? (ov[diff]===null ? 0 : ov[diff]) : (CFG.diffMod[diff]||0);
  const health = healthRateBonus();   // v1.38l：与 successRate 同源
  let E = gearRate() + skillRate(q) + gearRateFor(q[1]);
  if(dinnerBonus()) E += 0.02;
  const Ecapped = Math.min(CFG.eCap[qi], E);
  const lastSleep = S.history.length ? S.history[S.history.length-1].sleep : true;
  const N = lastSleep ? 0 : Math.min(0, -0.15 + gearEffects().nightCut);   // v1.38o：减免封顶于惩罚本身
  const _meal = activeMeal();
  const _dLv = Math.max(0, S.lvIdx - qi), _delta = Math.min(0.36, _dLv * 0.12);   // v1.32：等级差修正（+12%/级，上限 +36%）
  const _nm = (diff === "噩梦") ? gearEffects().nightmare : 0;   // v1.32：噩梦难度成功率词条
  return {B:B, D:D, health:health, E:Ecapped, eCut:E > CFG.eCap[qi], N:N, night:!lastSleep,
          mealR:_meal ? (_meal.rate||0) : 0, rare:S.rareNextRate||0, charm:charmRate(), wolf:wolfRateBonus() + petBonus().rate, delta:_delta, nm:_nm,
          fest: FESTIVALS[todayStr().slice(5)] ? 0.10 : 0};   // v1.38c：节日独立加成（详情分解展示）
}

function rateBreakdownHtml(q){

  if(b.delta) parts.push(f(b.delta)+" 等级差");
  if(b.health) parts.push(f(b.health)+" 健康");
  if(b.E) parts.push(f(b.E)+" 装备" + (b.eCut ? "（封顶）" : ""));

/* ── 材料数量判定（与种类判定独立，2026-10-02）──
   每项材料的数据为 [min,max] 区间；抽中后按「递减权重」抽数量：
   数量越少权重越高（例 [3,6] 权重 4/3/2/1 → 3 最多、6 最少） */
function rollQty(min, max){
  if(max <= min) return min;
  let total = 0;
  for(let i = min; i <= max; i++) total += (max - i + 1);
  let r = Math.random() * total;
  for(let i = min; i <= max; i++){
    r -= (max - i + 1);
    if(r < 0) return i;
  }
  return min;
}

function mixPool(){
  const out = [];
  for(let i=0;i<=S.lvIdx;i++){ const a = C[CFG.levels[i]] || []; for(let j=0;j<a.length;j++) out.push(a[j]); }
  return out;
}
function drawPool(point){
  const li = S.lvIdx;
  const n = CFG.drawCount[li];
  const list = mixPool();
  const now = new Date();
  const curMin = now.getHours()*60 + now.getMinutes();

  // 可接的（时间窗匹配）
  function inWindow(q){
    const w = q[2];
    if(w === "全天") return true;
    const [a,b] = w.split("-");
    const ah = +a.split(":")[0]*60 + +a.split(":")[1];
    const bh = +b.split(":")[0]*60 + +b.split(":")[1];
    return curMin >= ah && curMin <= bh;
  }
  const ok = list.filter(inWindow);
  const src = ok.length >= n ? ok : list;   // 可接不足则放宽

  // 随机抽 n 个不重复
  const picked = [], used = new Set();
  let guard = 0;
  while(picked.length < Math.min(n, src.length) && guard++ < 500){
    const i = Math.floor(Math.random()*src.length);
    if(!used.has(i)){ used.add(i); picked.push(src[i]); }
  }
  return picked;
}

function weeklySettle(endDateStr){
  const mk = weekKey(parseDate(endDateStr));
  if(S.weekSettled === mk) return null;
  S.weekSettled = mk;
  const days = S.history.filter(function(h){ return h.date && weekKey(parseDate(h.date)) === mk; });
  const n = Math.max(1, days.length);
  const avg = days.reduce(function(a,h){ return a + (h.score||0); }, 0) / n;
  const sleepN = days.filter(function(h){ return h.sleep; }).length;
  const sportN = days.filter(function(h){ return h.tasks && h.tasks[4]; }).length;
  const readN = days.reduce(function(a,h){ return a + (h.multi ? (h.multi[1]||0) : 0); }, 0);
  const questN = days.reduce(function(a,h){ return a + (h.done||0); }, 0);
  const tAvg = tier3(avg, 60, 75, 90), tSleep = tier3(sleepN, 5, 6, 7), tSport = tier3(sportN, 3, 5, 7), tRead = tier3(readN, 2, 4, 6), tQuest = tier3(questN, 5, 10, 15);
  const got = [];
  if(tAvg){ const c = [1000,3000,10000][tAvg-1]; S.money += c; got.push("平均健康 "+Math.round(avg)+" → "+fmtMoney(c)); }
  if(tSleep){ const v = Math.round([10,20,40][tSleep-1]*(1+charmVitGain())); S.vit += v; got.push("早睡 "+sleepN+" 天 → 活力点 +"+v); }
  if(tSport){ const c = [20,50,100][tSport-1]; S.con += c; got.push("运动 "+sportN+" 天 → 贡献 +"+c); }
  if(tRead){ const e = [5,10,20][tRead-1]; S.explore += e; got.push("阅读 "+readN+" 次 → 探索点 +"+e); }
  if(tQuest){ const c = [2000,5000,10000][tQuest-1]; S.money += c; got.push("完成委托 "+questN+" 次 → "+fmtMoney(c)); }
  // 公会周常（04_成长系统 4.7）
  const gc = [];
  if(sleepN >= 6){ S.money += 500; S.con += 50; gc.push("连续早睡（周保护）→ 5银 + 贡献50"); }
  if(questN >= 10){ S.money += 2000; S.con += 80; gc.push("完成 10 次委托 → 20银 + 贡献80"); }
  if(sportN >= 5){ S.money += 1500; S.con += 60; gc.push("运动 5 天 → 15银 + 贡献60"); }
  if(got.length || gc.length){
    addLog("📅 周结算（"+mk+" 当周）："+(got.concat(gc).join("｜")||"无奖励"),"gold");
    if(S.daily && S.daily.events) S.daily.events.push("📅 周结算："+(got.length+gc.length)+" 项奖励");
  }
  return {mk:mk, got:got, gc:gc, n:days.length};

  if(tQuest === 3){ S.timTitles["公会中坚"] = until; got.push("委托黄金 → 称号「公会中坚」（30 天）"); }
  // 公会月常（04_成长系统 4.7）
  if(sleepStreakProt(30)){ S.money += 10000; S.timTitles["作息守护者"] = until; got.push("连续 30 天规律作息（含保护）→ 1金币 + 称号「作息守护者」"); }
  if(questN >= 40){ S.money += 30000; S.rep += 200; got.push("完成 40 次委托 → 3金币 + 声望200"); }
  if(got.length){
    addLog("🗓️ 月结算（"+ym+"）："+got.join("｜"),"gold");
    if(S.daily && S.daily.events) S.daily.events.push("🗓️ 月结算："+got.length+" 项奖励");
  }
  return {ym:ym, got:got, n:days.length};
}
/* ── v1.38：连击保险 —— 连续早睡满 7 天后，每月 1 次断档自动保护，连击不断 ── */
function sleepStreak(){
  const shielded = S.shieldDays || [];
  let n = 0;
  for(let i = (S.history||[]).length - 1; i >= 0; i--){
    const h = S.history[i];
    if(h.sleep || shielded.indexOf(h.date) >= 0) n++; else break;
  }
  return n;
}
function tryComboShield(combo){
  if(combo < 7) return false;
  const d = S.health.date, ym = d.slice(0,7);
  if(S.shieldMonth === ym) return false;
  S.shieldMonth = ym;
  S.shieldDays = S.shieldDays || [];
  S.shieldDays.push(d);
  if(S.shieldDays.length > 60) S.shieldDays = S.shieldDays.slice(-60);
  addLog("🛡️ 连击保险：连续早睡 "+combo+" 天，昨夜断档被保险覆盖，连击保留（每月 1 次）","gold");
  return true;
}
function daySettle(){
  /* ① 豁免结算（必须在算分之前）：安神吊坠·早睡（每月1次）/ 晨曦之冠·早起（每周1次） */
  const hd = S.health.done || [];
  const dStr = S.health.date || todayStr();
  const ymStr = dStr.slice(0,7);
  if(!hd[0] && S.equipped.accessory === "安神吊坠" && S.exempt.sleep !== ymStr){
    hd[0] = 1; S.exempt.sleep = ymStr;
    addLog("💤 安神吊坠·早睡豁免生效：本日「23:30 前入睡」视为达成（每月 1 次）","gold");
  }
  if(!hd[1] && S.equipped.charmSlot === "晨曦之冠" && S.exempt.early !== weekKey(parseDate(dStr))){
    hd[1] = 1; S.exempt.early = weekKey(parseDate(dStr));
    addLog("🌅 晨曦之冠·早起豁免生效：本日「7:40 前起床」视为达成（每周 1 次）","gold");
  }
  calcHealth();
  const sc = S.health.score;
  let rep = 0, con = 0, vit = 0;
  if(sc>=90){ rep=8; con=6; vit=5; }
  else if(sc>=75){ rep=5; con=3; vit=3; }
  else if(sc>=60){ rep=2; con=1; vit=0; }
  if(vit) vit = Math.round(vit * (1 + charmVitGain()));   // 冥念护符：活力点获取加成
  if(rep||con||vit){
    S.rep += rep; S.con += con; S.vit += vit;
    if(S.daily){ S.daily.rep += rep; S.daily.con += con; S.daily.vit = (S.daily.vit||0) + vit; }
    addLog("📊 日结算：健康 "+sc+" 分 → 声望+"+rep+" 贡献+"+con+" 活力点+"+vit,"ok");
  } else {
    addLog("📊 日结算：健康 "+sc+" 分，无额外奖励","");
  }
  /* ② 安眠室：早睡达标累计（每满 7 天 → 健康加成上限 +1%，最高 +5%） */
  if(hd[0]){
    S.heatN = (S.heatN||0) + 1;
    if(S.heatN % 7 === 0)
      addLog("🛏️ 安眠室：累计早睡 "+S.heatN+" 天 → 健康加成上限 +"+Math.min(5, Math.floor(S.heatN/7))+"%","ok");
  }
  /* ③ 次日区间奖励（02_健康系统 2.2）：报酬/精力为次日持续效果，贡献/活力点次日首次打开发放 */
  const nxtDate = fmtDate(new Date(parseDate(dStr).getTime() + 86400000));
  const nb = {date:nxtDate, pay:0, energy:0, con:0, vit:0, claimed:false, score:sc};
  if(sc>=90){ nb.pay=0.15; nb.con=6; nb.vit=5; nb.energy=10; }
  else if(sc>=75){ nb.pay=0.10; nb.con=3; nb.vit=3; }
  else if(sc>=60){ nb.pay=0.05; nb.con=1; }
  else if(sc<40){ nb.energy=-10; }        // v1.32：40–59「普通」档 → 无额外奖励
  S.buffNext = nb;
  // 归档当天统计（v1.19：记录打卡明细，供周月打卡 / 厨房 / 成就使用）
  S.history.push({
    date: S.health.date, score: sc,
    sleep: !!(S.health.done||[])[0],           // 23:30 前入睡（供传奇事件条件统计）
    done: S.daily ? S.daily.done : 0,
    gold: S.daily ? S.daily.gold : 0,
    tasks: (S.health.done||[]).slice(),
    multi: (S.health.multi||[]).slice()
  });
  if(S.history.length > 400) S.history.shift();
  /* ④ 周结算（周日）/ 月结算（月末）+ 成就检查 */
  const dd = parseDate(dStr);
  if(dd.getDay() === 0) weeklySettle(dStr);
  if(new Date(dd.getTime() + 86400000).getMonth() !== dd.getMonth()) monthlySettle(dStr);
  checkAchievements();

  // 生成「昨日快照」——次日首次打开时展示
  const d = S.daily || {};
  S.yesterday = {
    date: S.health.date,
    score: sc,
    rep: rep, con: con, vit: vit,
    tasks: CFG.tasks.map(function(t,i){ return {n:t[0], p:t[1], ok: !!(S.health.done||[])[i]}; }),
    multiTasks: CFG.multiTasks.map(function(t,i){ return {n:t[0], p:t[1], cnt:(S.health.multi||[])[i]||0, max:t[2]}; }),
    byGrade: 0,
    doneCount: d.done || 0,
    quests: (d.quests||[]).slice(),
    exp: d.exp||0, gold: d.gold||0,
    rep2: d.rep||0, con2: d.con||0,
    mats: Object.assign({}, d.mats||{}),
    events: (d.events||[]).slice(),
    exploreNext: Math.floor(sc/10)
  };
  S.yesterdayShown = false;
}

/* ── 3D 物理骰子（懒加载，来自「尘封之卷」骰娘项目的引擎） ── */
let _roll3D = null;
async function getRoll3D(){
  if(_roll3D === null){
    try{
      const m = await import('./3d骰子/dice-bridge.js');
      _roll3D = m.roll3D;
    }catch(e){
      console.warn('[3D骰子] 加载失败，回退为文本掷骰：', e);
      _roll3D = false;      // false = 已尝试过且失败，不再重试
    }
  }
  return _roll3D;
}

/* 3D 掷骰串行队列：多个委托同时完成时，依次播放动画（而不是并发导致只有第一个有动画） */
let _pendingSettles = 0;                    // 正在结算中的委托数（含 3D 动画播放）
let _roll3DChain = Promise.resolve();
function queueRoll3D(roll){
  _roll3DChain = _roll3DChain.then(async function(){
    const r3d = await getRoll3D();
    if(!r3d) return;                        // 引擎不可用 → 静默跳过
    try{ await r3d('1d100', roll); }
    catch(e){ console.warn('[3D骰子] 播放异常：', e); }
  });
  return _roll3DChain;
}

/* ── 委托结算 ── */
/* 委托声望奖励：Lv1/Lv2 固定 = 等级×5；Lv3 起按「等级 × 难度」查表
   设计原则：均值与原「等级×5」基本持平（Lv3≈15 / Lv4≈20 / Lv5≈26），
   难度越高声望越多，让高难委托的额外风险有回报 */
const REP_TABLE = {
  3:{简单:10, 普通:14, 困难:19, 噩梦:25},
  4:{简单:12, 普通:16, 困难:21, 噩梦:28},
  5:{简单:14, 普通:18, 困难:24, 噩梦:32}
};
function questRep(q, lv){
  if(lv <= 2) return lv*5;
  return (REP_TABLE[lv] && REP_TABLE[lv][q[4]]) || lv*5;
}

async function settle(a, now){
  _pendingSettles++;
  try { await _settleInner(a, now); }
  finally { _pendingSettles--; flushResults(); }   // 结算完毕后再尝试弹窗
}
async function _settleInner(a, now){
  const q = a.q;
  const rate = a.rate;
  const roll = rand(100);
  const ok = roll <= Math.round(rate*100);
  const crit = roll<=5, fumble = roll>=96;

  // 弹出 3D 物理骰子小窗口播放掷骰动画（结果已确定，动画只是演出）
  // 用队列串行——多个委托同时完成时依次播放，而不是只有第一个有动画
  await queueRoll3D(roll);

  // 传奇事件：报酬为字符串（如 "1铂金币"），单独换算
  if(a.legend){
    const L = a.legend;
    const lname = a.lname || S.legendName || "传奇事件";
    const base = LEGEND_GOLD[L[4]] || 1000000;
    const roll2 = rand(100);
    await queueRoll3D(roll2);                       // 与常规委托一致，也播 3D 动画
    const ok2 = roll2 <= Math.round(a.rate*100);
    let g2 = ok2 ? Math.round(base * (1 + gearBonus() + gearAccBonus() + charmPay())) : Math.round(base*0.3);
    const e2 = ok2 ? L[5] : Math.round(L[5]*0.5);
    const r2 = ok2 ? legendRep(L) : 0;
    S.money += g2; S.exp += e2;
    if(ok2 && L[6]){ L[6].split("、").forEach(function(pair){
      const m = pair.match(/^(.+?)×(\d+)$/); if(m && M[m[1]]) S.mats[m[1]] = (S.mats[m[1]]||0) + (+m[2]);
    }); }
    if(ok2){
      S.rep += r2; S.con += 50;
      grantLegendReward(L);                      // 称号 / 宠物 / 藏品入档
      S.legendDone.push(L[0]);                   // 记录完成（供后续传奇事件条件判定）
      checkAchievements();                       // v1.19：传奇成就（屠龙者 / 创世者）
    }
    resultQueue.push({name:L[0], type:(L[1]||"精英").split("+")[0], roll:roll2, need:Math.round(a.rate*100),
      title: ok2?lname+"完成！":"失败", gold:g2, exp:e2,
      got:[ok2?(L[7]||"").replace(/；/g,"　"):""].filter(Boolean), cls: ok2?"gold":"bad"});
    addLog("🌍 "+lname+"「"+L[0]+"」掷出 "+roll2+" → "+(ok2?"成功":"失败")+"（+"+fmtMoney(g2)+" / +"+e2+"经验"+(r2?" / +"+r2+"声望":"")+"）", ok2?"gold":"bad");
    if(ok2) addLog("🏆 奖励已入档：" + (L[7]||"—") + "（见「冒险者信息」页）","gold");
    checkLevelUp();
    return;
  }
  const _eff = gearEffects();
  let gold = 0, exp = 0;
  if(ok){
    gold = q[5];
    if(crit) gold = Math.round(gold*1.2);
    const _m = a.meal;                             // 只有接取时生效的那道菜起作用
    let payMul = 1 + gearBonus() + gearAccBonus() + ((_eff.pay[q[1]])||0) + petBonus().pay;  // 饰品 + 分类报酬 + 宠物
    if(_eff.pay["晨间"] && isMorningQuest(q)) payMul += _eff.pay["晨间"];   // 晨曦之冠：晨间委托报酬加成
    if(S.buffNext && S.buffNext.date === todayStr()) payMul += (S.buffNext.pay||0);   // 次日区间奖励·报酬
    payMul += titlePayBonus();                                             // 当月称号（作息守护者 / 公会中坚）
    if(FESTIVALS[todayStr().slice(5)]) payMul += 0.20;                     // v1.38c：节日当天委托报酬 +20%
    if(q[1] === "精英" && guildIdx() >= 3 && S.libDate === todayStr()) payMul += 0.10;   // 图书馆：当日阅读 → 精英类报酬 +10%
    payMul += (S.rareNextPay||0);                                          // 稀有事件·商队搭伙（下一次委托报酬 +25%）
    if(_m && _m.bonus) payMul += _m.bonus;
    payMul += charmPay();                           // 冥念护符
    payMul += skillPay(q);                          // 技能树·社交（护送类）
    gold = Math.round(gold * payMul);
    exp = Math.round(q[6] * (1 + _eff.exp + petBonus().exp));
  } else {
    // 失败（含大失败）：仅获得报酬的 30%，无掉落（材料只在成功时结算）
    gold = Math.round(q[5]*0.3);
    exp = Math.round(q[6]*0.5*(1 + _eff.exp + petBonus().exp));
  }
  S.money += gold;
  S.exp += exp;
  // 材料（仅成功）：种类判定（按品阶）与数量判定（区间递减权重）分开计算
  const got = [], gotObj = {};
  if(ok && q[8]){
    Object.keys(q[8]).forEach(function(k, idx){
      if(rollMat(idx, k)){                     // 种类判定：主材料必得，其余按品阶概率
        const rg = matQtyRange(q[8][k]);
        let n2 = rollQty(rg[0], rg[1]);        // 数量判定：数量越多概率越低
        if(_eff.mat > 0 && idx > 0) n2 = Math.max(1, Math.round(n2 * (1 + _eff.mat)));   // 材料获取加成（仅副材料）
        S.mats[k] = (S.mats[k]||0) + n2;
        got.push(k+"×"+n2); gotObj[k] = n2;
      }
    });
  }
  // 声望 / 贡献
  let rep = ok ? questRep(q, a.qlv || S.lvIdx+1) : 0;
  if(ok && crit) rep += 5;                   // 大成功额外声望（见 03/04 文档）
  const con = ok ? Math.round(lvNum() * (1 + _eff.con)) : 0;
  S.rep += rep; S.con += con;

  // 当日统计（供次日「昨日结算」展示）
  if(!S.daily || S.daily.date !== todayStr())
    S.daily = {date:todayStr(), done:0, gold:0, exp:0, rep:0, con:0, vit:0, quests:[], mats:{}, events:[]};
  // 字段级兜底（防御残缺的 daily 对象）
  if(!S.daily.quests) S.daily.quests = [];
  if(!S.daily.mats) S.daily.mats = {};
  S.daily.done++;
  S.daily.gold += gold;
  S.daily.exp  += exp;
  S.daily.rep  += rep;
  S.daily.con  += con;
  S.daily.quests.push({name:q[0], grade:q[4], ok:ok});
  // 累积完成统计（供传奇事件条件：前置委托 / 40 次 Lv5 以下委托）
  if(ok){
    S.doneQuests[q[0]] = (S.doneQuests[q[0]]||0) + 1;
    if((a.qlv || S.lvIdx+1) <= 4) S.doneBelow5++;
    S.totalQuests = (S.totalQuests||0) + 1;    // v1.19：累计完成数（成就「百炼成钢」）
    checkAchievements();
  }
  for(const mk in gotObj) S.daily.mats[mk] = (S.daily.mats[mk]||0) + gotObj[mk];

  // 稀有事件「下一次委托」加成：本次结算即消费（无论成败）
  S.rareNextRate = 0; S.rareNextPay = 0;

  let title, cls;
  if(!ok && fumble){ title = "大失败"; cls = "bad"; }
  else if(ok && crit){ title = "大成功！"; cls = "gold"; }
  else if(ok){ title = "成功"; cls = "ok"; }
  else { title = "失败"; cls = "bad"; }

  const _petNote = petQuestGain(q, ok, (a.qlv || S.lvIdx+1) - 1);   // v1.38f：携带宠物陪同委托 → 成长
  resultQueue.push({
    name:q[0], type:q[1], roll:roll, need:Math.round(rate*100),
    title:title, gold:gold, exp:exp, got:got, cls:cls, pet:_petNote
  });
  addLog("⚔ "+q[0]+" 掷出 "+roll+" → "+title+
    (gold?"（+"+fmtMoney(gold)+"）":"")+" +"+exp+"经验"+
    (got.length?" 材料:"+got.map(m=>matIcon(m.split("×")[0])+m).join(" "):"")+
    (_petNote?" "+_petNote:""), cls);

  checkLevelUp();
  // 稀有事件判定（每次委托结算，成败都判）
  const rareEv = tryRareEvent(q[1], q[0], q[5]);
  if(rareEv) showRareEvent(rareEv);
}

/* ── 结算结果弹窗队列 ── */
let resultQueue = [];
let _qanimBusy = false;        // v1.35：委托动画播放中（防重复触发）
function flushResults(){
  // 1) 优先播出待显示的委托结算结果
  if(resultQueue.length){
    if(document.getElementById("modal").classList.contains("on")) return;  // 已有弹窗在显示
    if(_qanimBusy) return;                                                  // v1.35：动画播放中
    const r = resultQueue.shift();
    _qanimBusy = true;
    playQuestAnim(r.name, r.type, r.cls, function(){                        // v1.35：emoji 迷你动画 → 结果
      _qanimBusy = false;
      showResult(r.name, r.roll, r.need, r.title, r.gold, r.exp, r.got, r.cls, r.pet);
    });
    return;
  }
  // 2) 结算队列清空、且没有委托仍在结算中，才弹「昨日结算」（优先级最低）
  if(_pendingSettles > 0) return;
  if(S.yesterday && !S.yesterdayShown && !document.getElementById("modal").classList.contains("on")){
    S.yesterdayShown = true;
    save();
    showYesterday();
  }
}

/* ── 跨天委托：在次日打卡时结算 ── */
function settlePending(){
  const keep = [];
  let n = 0;
  for(const a of S.active){
    if(a.pending){ settle(a); n++; }
    else keep.push(a);
  }
  S.active = keep;
  if(n) addLog("☀️ 打卡触发 "+n+" 个跨天委托的结算","gold");
  return n;
}

function sameDay(ts1, ts2){
  return todayStr(new Date(ts1)) === todayStr(new Date(ts2));
}

function checkLevelUp(){
  while(S.lvIdx < CFG.levels.length-1 && S.exp >= CFG.expNeed[S.lvIdx]){
    S.lvIdx++;
    S.energy = energyMaxNow();
    addLog("🎉 升级！现在是 "+CFG.levels[S.lvIdx]+"，精力上限 "+energyMaxNow(),"gold");
    if(S.daily) S.daily.events.push("🎉 升级至 " + CFG.levels[S.lvIdx]);
  }
}

/* ══════════════════════════════════════════════════
   4. 操作
   ══════════════════════════════════════════════════ */
function acceptQuest(idx){
  tick();
  const q = S.pool.list[idx];
  if(!q) return;
  if(S.pool.taken) return showAlert("本次刷新已接取过了");
  if(poolExpired()) return showAlert("本批委托已失效。<br><br>接取窗口为刷新后 <b>30 分钟</b>内（本批刷新点："+S.pool.point.split("@")[1]+":00）。<br>等下一个刷新点再来。");
  const limit = dailyLimitNow();
  if(S.accepted >= limit) return showAlert("今日接取已达上限（"+limit+" 个）");
  const simCap = simCapNow();
  if(S.active.length >= simCap) return showAlert("同时进行的委托已达上限 "+simCap+" 个");
  const enCost = Math.max(1, Math.round(q[7] * (1 - gearEnCutFor(q[1]))));
  if(S.energy < enCost) return showAlert("精力不足：需要 "+enCost+"，当前 "+S.energy);

  S.energy -= enCost;
  S.accepted++;
  S.pool.taken = true;
  const rate = successRate(q);
  S.active.push({
    q:q, rate:rate,
    qlv: S.lvIdx+1,              // 接取时的委托等级（供传奇事件条件统计：完成 40 次 Lv5 以下委托）
    meal: activeMeal(),          // 记录接取当下生效的料理（只影响这一次委托）
    acceptTs: Date.now(),
    finishTs: Date.now() + q[3]*60*1000,
    name:q[0]
  });
  addLog("📥 接取「"+q[0]+"」耗时 "+fmtDur(q[3])+"，成功率 "+Math.round(rate*100)+"%","");
  save(); render();
}

/* 公会额外委托接取（独立槽位 · v1.38p：随机 6 个任选 1 个）：
   任意时段可接 · 不占每日接取上限 · 不占同时进行上限 · 不可用道具刷新 */
function acceptBonus(idx){
  tick();
  const q = S.bonusQuests && S.bonusQuests[idx];
  if(!q) return;
  const enCost = Math.max(1, Math.round(q[7] * (1 - gearEnCutFor(q[1]))));
  if(S.energy < enCost) return showAlert("精力不足：需要 "+enCost+"，当前 "+S.energy, "公会额外委托");
  S.energy -= enCost;
  const rate = successRate(q);
  S.active.push({
    q:q, rate:rate,
    qlv: S.lvIdx+1,
    meal: activeMeal(),
    acceptTs: Date.now(),
    finishTs: Date.now() + q[3]*60*1000,

/* v1.38m：商店限购——lim:["日",N] / ["周",N]；记账在 S.shopDaily / S.shopWeekly（tick 跨天/跨周幂等重置）
   键带渠道前缀（c:/vit:/con:）——同商品在不同商店的限购互相独立 */
function shopLimBox(it){ return it.lim[0] === "周" ? S.shopWeekly : S.shopDaily; }
function shopLimKey(cur, it){ return cur + ":" + it.n; }
function shopLimUsed(it, cur){
  if(!it.lim) return 0;
  const b = shopLimBox(it);
  return (b && b.cnt && b.cnt[shopLimKey(cur, it)]) || 0;
}
function shopLimLeft(it, cur){ return it.lim ? Math.max(0, it.lim[1] - shopLimUsed(it, cur)) : Infinity; }
function shopLimCheck(it, n, cur){
  if(!it.lim) return null;
  const left = shopLimLeft(it, cur);
  if(left >= n) return null;
  return (it.lim[0] === "周" ? "本周" : "今日") + "限购 " + it.lim[1] + " 个" +
    (left > 0 ? "（还剩 " + left + " 个，本次买 " + n + " 个超了）" : "（已购满）") + "。";
}
function shopLimAdd(it, n, cur){
  if(!it.lim) return;
  const b = shopLimBox(it);
  if(b && b.cnt) b.cnt[shopLimKey(cur, it)] = (b.cnt[shopLimKey(cur, it)] || 0) + n;
}

/* v1.38k：购买 / 兑换支持批量（n = 拖动条选定数量，上限为当前可支付上限；薰香除外） */
function buy(i, n){
  n = Math.max(1, Math.floor(+n || 1));
  const it = SHOP[i];
  const _lim = shopLimCheck(it, n, "c");
  if(_lim) return showAlert(_lim, "商店限购");
  const total = it.c * n;
  if(S.money < total) return showAlert("铜币不足（需要 "+fmtMoney(total)+"，当前 "+fmtMoney(S.money)+"）");
  S.money -= total;
  shopLimAdd(it, n, "c");
  if(it.item){
    S.items[it.item] = (S.items[it.item]||0) + n;
    addLog("🛒 购买「"+it.n+"」"+(n>1?"×"+n:""),"");
  } else {
    const tiers = {普通:["止血草","蘑菇","山鸡羽","河鱼","松木","青石","野兔皮","蜂蜜","粗麻布","铜矿石","石英","泉水"],

    const t = it.n.includes("精良")?"精良":"普通";
    const cnt = (t==="普通"?5:3) * n;
    const pool = tiers[t], got = {};

      const m = pool[Math.floor(Math.random()*pool.length)];

  }
  save(); render();
}

/* v1.38k：商店行——拖动条选数量，上限 = 当前货币可支付上限
   cur："c" 铜币 / "vit" 活力点 / "con" 贡献；fn：购买函数名 */
function shopRow(it, i, cur, fn, btnTxt){
  const unit = it[cur];
  const have = cur === "c" ? S.money : (cur === "vit" ? S.vit : S.con);
  const _left = shopLimLeft(it, cur);
  const mx = Math.min(Math.floor(have / unit), _left);   // v1.38m：上限 = min(可支付, 限购剩余)
  const unitTxt = cur === "c" ? fmtMoney(unit) : unit + (cur === "vit" ? " 点" : " 贡献");
  const limHtml = it.lim ? `　<span style="color:${_left < 1 ? "var(--red)" : "var(--gold2)"}">📅 ${it.lim[0] === "周" ? "本周" : "今日"} ${shopLimUsed(it, cur)}/${it.lim[1]}</span>` : "";
  const btn = mx >= 1
    ? `<button class="btn sm pri" onclick="openShopBuy('${cur}', ${i})">${btnTxt}</button>`   // v1.38o：开购买弹窗（数量条在窗内）
    : `<button class="btn sm" onclick="${fn}(${i}, 1)">${btnTxt}</button>`;
  return `<div class="li"><div>${it.n}<div class="muted">${it.d}${limHtml}</div></div>
    <div class="cnt"><span>${unitTxt}</span>${btn}</div></div>`;
}
/* v1.38o：购买弹窗——宽拖动条粗调 + −/+ 精调 + 「最大」一键（解决拖动条难定位到具体数值） */
function openShopBuy(cur, i){
  const it = (cur === "c" ? SHOP : (cur === "vit" ? VIT_SHOP : CON_SHOP))[i];
  const unit = it[cur];
  const have = cur === "c" ? S.money : (cur === "vit" ? S.vit : S.con);
  const mx = Math.min(Math.floor(have / unit), shopLimLeft(it, cur));
  if(mx < 1) return;
  const id = cur + "_" + i;
  const unitTxt = cur === "c" ? fmtMoney(unit) : unit + (cur === "vit" ? " 点" : " 贡献");
  const limTxt = it.lim
    ? "　📅 " + (it.lim[0] === "周" ? "本周" : "今日") + "限购 " + shopLimUsed(it, cur) + "/" + it.lim[1] + "（本次最多再买 " + mx + " 个）"
    : "　本次最多可买 " + mx + " 个";
  const body = `<div class="dlg-msg" style="font-size:13px">单价 <b>${unitTxt}</b>${limTxt}</div>
    <input type="range" class="shopR" id="sbR_${id}" min="1" max="${mx}" value="1" style="width:100%" data-u="${unit}" data-cur="${cur}" data-mx="${mx}" oninput="sbUpd('${id}')">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0">
      <button class="btn sm" onclick="sbStep('${id}',-1)">−</button>
      <b id="sbN_${id}" style="min-width:56px;text-align:center;font-size:15px">×1</b>
      <button class="btn sm" onclick="sbStep('${id}',1)">+</button>
      <button class="btn sm" onclick="sbMax('${id}')">最大</button>
    </div>
    <div class="muted" style="text-align:center">合计：<b style="color:var(--gold2)" id="sbP_${id}">${unitTxt}</b></div>`;
  dlg("购买 · " + it.n, body, [
    {text:"取消", fn:null},
    {text:"确认购买", cls:"pri", fn:function(){
      const inp = document.getElementById("sbR_" + id);
      const v = inp ? Math.max(1, Math.floor(+inp.value || 1)) : 1;
      if(cur === "c") buy(i, v); else if(cur === "vit") buyVit(i, v); else buyCon(i, v);
    }}
  ]);
}
function sbUpd(id){
  const inp = document.getElementById("sbR_" + id);
  if(!inp) return;
  const mx = +inp.dataset.mx || 1;
  let v = Math.floor(+inp.value || 1);
  if(v < 1) v = 1;
  if(v > mx) v = mx;
  inp.value = v;
  const u = +inp.dataset.u, cur = inp.dataset.cur;
  document.getElementById("sbN_" + id).textContent = "×" + v;
  document.getElementById("sbP_" + id).textContent = cur === "c" ? fmtMoney(u * v) : (u * v) + (cur === "vit" ? " 点" : " 贡献");
}
function sbStep(id, d){
  const inp = document.getElementById("sbR_" + id);
  if(!inp) return;
  inp.value = Math.floor(+inp.value || 1) + d;
  sbUpd(id);
}
function sbMax(id){
  const inp = document.getElementById("sbR_" + id);
  if(!inp) return;
  inp.value = inp.dataset.mx;
  sbUpd(id);
}

/* v1.38：音效体系——Web Audio 合成（零外部资源），可在「冒险者信息」页开关 */
let _actx = null;
function soundOn(){ try{ return localStorage.getItem("adv_sound") !== "0"; }catch(e){ return true; } }
function toggleSound(){
  try{ localStorage.setItem("adv_sound", soundOn() ? "0" : "1"); }catch(e){}
  render();
  toast(soundOn() ? "🔊 音效已开启" : "🔇 音效已关闭");
}
function _beep(seq){                 // seq: [频率, 起始秒, 时长, 音量]
  if(!soundOn()) return;
  try{
    _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
    if(_actx.state === "suspended") _actx.resume();
    const t0 = _actx.currentTime;
    seq.forEach(function(ns){
      const o = _actx.createOscillator(), g = _actx.createGain();
      o.type = "sine"; o.frequency.value = ns[0];
      g.gain.setValueAtTime(0.0001, t0 + ns[1]);
      g.gain.exponentialRampToValueAtTime(ns[3] || 0.11, t0 + ns[1] + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + ns[1] + ns[2]);
      o.connect(g); g.connect(_actx.destination);
      o.start(t0 + ns[1]); o.stop(t0 + ns[1] + ns[2] + 0.05);
    });
  }catch(e){}
}
function sfxCheckin(){ _beep([[880, 0, .18], [1318, .07, .22, .09]]); }                                    // 打卡「叮」

/* v1.35：委托 emoji 迷你动画——目标 emoji 由委托名关键词决定（狩猎→猎物 / 采集→物产 / 护送→对象），

/* v1.36：委托名关键词 → 动作题材（自上而下先匹配；未中按委托类型兜底） */
const QANIM_ACTS = [
  [/垂钓|钓鱼/, "fish"], [/砍伐|伐木|柴|薪/, "chop"],
  [/挖掘|发掘|采矿|矿洞|矿脉|矿坑|矿道|矿石|泥炭|淘洗|采石/, "mine"],
  [/驯服|驯养/, "tame"], [/帮厨|烹饪/, "cook"],
  [/掏|药|草|蘑菇|菌|花|藤|松脂|露|采|摘|修剪|培育|园/, "gather"],
  [/净化|祈|圣坛|符文|拓印|仪式|裂隙|禁咒|咒|星穹/, "magic"],
  [/侦察|追踪/, "explore"]
];
function questAnimEmoji(name, type){
  for(let i = 0; i < QANIM_TARGETS.length; i++){ if(QANIM_TARGETS[i][0].test(name || "")) return QANIM_TARGETS[i][1]; }
  const D = {"精英":"👹","狩猎":"🐾","采集":"🌿","探索":"🗺️","护送":"🐎","短时":"📜"};
  return D[type] || "❗";
}
function questAnimPool(name, type){
  for(let i = 0; i < QANIM_ACTS.length; i++){ if(QANIM_ACTS[i][0].test(name || "")) return QANIM_POOLS[QANIM_ACTS[i][1]]; }
  const D = {"精英":"slay","狩猎":"hunt","采集":"gather","探索":"explore","护送":"escort","短时":"work"};
  return QANIM_POOLS[D[type] || "work"];
}
function questAnimPick(a){ return a[Math.floor(Math.random() * a.length)]; }
function playQuestAnim(name, type, cls, done){
  try{
    if(!document.body || !document.body.appendChild){ done(); return; }
    const t = questAnimEmoji(name, type);
    const pool = questAnimPool(name, type);
    const wpn = questAnimPick(pool.w), hitFx = questAnimPick(pool.hit), fallFx = questAnimPick(pool.fall);
    const ok = (cls === "ok" || cls === "gold");
    const el = document.createElement("div");
    el.className = "qanim " + (ok ? "win" : "lose");
    el.innerHTML = '<div class="qanim-stage">'
      + '<span class="qanim-weapon">' + wpn + '</span>'
      + '<span class="qanim-target">' + t + '</span>'
      + '<span class="qanim-hit">' + hitFx + '</span>'
      + (ok ? '<span class="qanim-fall">' + fallFx + '</span>' : '')
      + '</div><div class="qanim-text">' + (ok ? "✨ " + name + " · 完成" : "💨 " + name + " · 失败") + '</div>';
    document.body.appendChild(el);
    setTimeout(function(){ if(el.remove) el.remove(); done(); }, 2500);
  }catch(e){ done(); }
}
function questAnimWait(r){        // front 结算队列用：等待动画播完再弹结果
  return new Promise(function(resolve){ playQuestAnim(r.name, r.type || "", r.cls, resolve); });
}

function toggleTask(i){

/* ══════════════════════════════════════════════════
   通用弹窗（替代浏览器原生 alert / confirm）
   ══════════════════════════════════════════════════ */
function dlg(title, bodyHtml, buttons){
  const el = document.getElementById("dlg");
  const btns = buttons && buttons.length ? buttons : [{text:"确定", cls:"pri", fn:null}];
  let bh = "";
  btns.forEach((b,i)=>{ bh += '<button class="btn '+(b.cls||"")+'"'+(b.style?' style="'+b.style+'"':'')+' data-i="'+i+'">'+b.text+'</button>'; });
  el.innerHTML = '<div class="dlg-box"><div class="dlg-title">'+title+'</div>'
               + '<div class="dlg-body">'+bodyHtml+'</div>'
               + '<div class="dlg-btns">'+bh+'</div></div>';
  el.classList.add("on");
  el.querySelectorAll("button[data-i]").forEach(function(btn){
    btn.onclick = function(){
      const b = btns[+btn.dataset.i];
      clrDlg();
      if(b && b.fn) b.fn();
    };
  });
}
function clrDlg(){ document.getElementById("dlg").classList.remove("on"); }
function showAlert(msg, title){ dlg(title||"提示", '<div class="dlg-msg">'+msg+'</div>'); }
/* ── 轻提示：由下方桥接层统一定义（服务端消息 + 本地提醒共用） ── */
function showConfirm(msg, onOk, title){
  dlg(title||"确认", '<div class="dlg-msg">'+msg+'</div>', [
    {text:"取消", fn:null},
    {text:"确定", cls:"pri", fn:onOk}
  ]);
}

/* 按标签生成委托背景描述 */
function questDesc(q){
  const n = q[0], tag = q[1], diff = q[4], hrs = q[3]/60;
  if(QUEST_STORY[n]) return QUEST_STORY[n];   // 每个委托的专属内容描写
  const tagDesc = {
    "采集":"公会需要这批物资补给前线的冒险者。",
    "狩猎":"目标具有攻击性，务必小心行事。",
    "探索":"未知区域，情报有限，回报与风险并存。",
    "护送":"委托人的人身安全是第一要务。",
    "短时":"临时差事，做完即走，干净利落。",
    "精英":"高难度讨伐，仅推荐有把握的冒险者接取。"
  }[tag] || "公会发布的常规委托。";
  const diffDesc = {
    "简单":"难度不高，新手也能应付。",
    "普通":"需要一定的经验与技巧。",
    "困难":"风险显著，失手在所难免。",
    "噩梦":"极度危险，请确认自己的状态再决定。"
  }[diff] || "";
  return "「"+n+"」——"+tagDesc+diffDesc+"预计耗时约 "+(hrs%1===0?hrs:hrs.toFixed(1))+" 小时。";
}

/* 打开委托详情 */
/* 材料掉落行（委托详情共用：主材料「必得」，副材料「概率掉落」，不显示具体百分比） */
function matRowsHtml(q){
  return Object.keys(q[8]||{}).length
    ? Object.keys(q[8]).map(function(k, idx){
        const tier = (M[k] && M[k][1]) || "普通";
        const tag = matGuaranteed(idx)
          ? '<span style="color:var(--green);font-weight:600">必得</span>'
          : '<span class="muted">概率掉落</span>';
        const rg = matQtyRange(q[8][k]);
        const qtyTxt = rg[0] === rg[1] ? "×"+rg[0] : "×"+rg[0]+"~"+rg[1];
        return '<div class="qd-mat"><span>'+matIcon(k)+k
             + '<span class="tier t-'+tier+'">'+tier+'</span>'
             + '<span style="margin-left:6px">'+tag+'</span></span>'
             + '<b>'+qtyTxt+'</b></div>';
      }).join("")
    : '<div class="qd-mat"><span class="muted">此委托不产出材料</span></div>';
}
/* 剩余时间文本（小时/分钟） */
function leftText(a){
  const left = Math.max(0, a.finishTs - Date.now());
  const mm = Math.floor(left/60000), hh = Math.floor(mm/60);
  return hh>0 ? hh+" 小时 "+(mm%60)+" 分" : mm+" 分钟";
}
/* 主动放弃委托（01_基础框架.md：释放进行中名额；不返还次数与精力；无任何收益） */
function abandonQuest(i){
  const a = S.active[i];
  if(!a) return;
  const isLegend = !!a.legend;
  const msg = "确定放弃「"+a.name+"」吗？<br><br>"
    + "· 立即释放进行中名额<br>"
    + "· <b style='color:var(--red)'>不返还</b>已扣除的精力<br>"
    + (isLegend ? "· <b style='color:var(--red)'>不返还</b>本周的传奇事件接取次数<br>" : "")
    + "· 无任何报酬 / 经验 / 声望";
  showConfirm(msg, function(){
    const idx = S.active.indexOf(a);
    if(idx < 0) return;                        // 确认期间已被结算
    S.active.splice(idx, 1);
    addLog("🗑 放弃了" + (isLegend ? (a.lname||"传奇事件") : "委托") + "「"+a.name+"」（不返还精力）","bad");

}

/* ── 公会厨房 · 料理 ── */
function canCook(r){
  for(const k in r.ing) if((S.mats[k]||0) < r.ing[k]) return false;
  return true;
}
/* 当前生效的料理（当日有效）——决定下一次接取的加成 */
function activeMeal(){
  if(!S.lastMeal) return null;
  return S.lastMeal.date === todayStr() ? S.lastMeal : null;
}
/* 料理带来的精力上限提升（当日有效） */
function mealCapBonus(){
  return (S.mealCap && S.mealCap.date === todayStr()) ? (S.mealCap.cap||0) : 0;
}
function cook(i){
  const r = CFG.recipes[i];
  if(!canCook(r)) return showAlert("材料不足，无法烹饪「"+r.n+"」。<br><br>需要："+
    Object.keys(r.ing).map(function(k){ return k+" ×"+r.ing[k]; }).join("、"), "公会厨房");
  const t = todayStr();
  for(const k in r.ing){
    S.mats[k] -= r.ing[k];
    if(S.mats[k] <= 0) delete S.mats[k];
  }
  const parts = [];
  if(r.cap){   // v1.32：先扩展上限，再回精力（否则精力已满时回精被吞）
    if(!S.mealCap || S.mealCap.date !== t) S.mealCap = {date:t, cap:0};
    S.mealCap.cap += r.cap;
    parts.push("当日精力上限 +"+r.cap);
  }
  if(r.en){
    const before = S.energy;
    S.energy = Math.min(energyMaxNow(), S.energy + r.en);   // 巨龙盛宴 en=999 → 补满
    parts.push("精力 "+before+" → "+S.energy);
  }
  if(!S.cooked) S.cooked = [];                       // v1.35：图鉴·料理记录
  if(S.cooked.indexOf(r.n) < 0) S.cooked.push(r.n);
  if(r.sp){ S.explore += r.sp; parts.push("探索点 +"+r.sp); }
  if(r.bonus || r.rate){
    S.lastMeal = {date:t, name:r.n, bonus:r.bonus||0, rate:r.rate||0};
    parts.push("✅ 「"+r.n+"」生效，下次接取的委托享受加成");
  }
  addLog("🍲 烹饪「"+r.n+"」→ "+parts.join("、"), "ok");
  save(); render();
}

/* ══════════════════════════════════════════════════
   传奇事件 / 世界级事件
   ══════════════════════════════════════════════════ */
/* 最近 n 天平均健康评分（不足则按已有记录算） */
function avgHealthLast(n){
  const h = S.history.slice(-n);
  if(!h.length) return 0;
  return h.reduce(function(a,x){ return a + (x.score||0); }, 0) / h.length;
}
/* 最近 n 天中 23:30 前入睡的天数 */
function sleepDaysLast(n){
  return S.history.slice(-n).filter(function(x){ return x.sleep === true; }).length;
}
/* 是否连续 n 天 23:30 前入睡（从最新一天往前数） */
function sleepStreak(n){
  let c = 0;
  for(let i = S.history.length-1; i >= 0 && c < n; i--){
    if(S.history[i].sleep === true) c++; else return false;
  }
  return c >= n;
}
/* 全局门槛（03_委托系统.md 3.9 · 触发条件 1/2/4/5） */
function legendUnlocked(){
  return S.lvIdx >= 4                        // Lv5
      && S.exp >= 30000                      // 传奇资格（累计经验）
      && guildIdx() >= 5                     // 公会 A 级（2,200 声望）
      && avgHealthLast(7) >= 60              // 最近 7 天平均健康 ≥ 60
      && sleepDaysLast(30) >= 25;            // 最近 30 天 23:30 前入睡 ≥ 25 天
}
/* 单事件专属条件（触发条件 3：完成对应前置委托 / 称号物品等） */
function legendEligible(L){
  const c = L[8] || {};
  if(c.q && !(S.doneQuests[c.q] > 0)) return false;
  if(c.q40 && S.doneBelow5 < 40) return false;
  if(c.sleep30 && !sleepStreakProt(30)) return false;   // v1.19：含断连保护（最近 30 天 ≥27 天）
  if(c.legend && S.legendDone.indexOf(c.legend) < 0) return false;
  if(c.allLegend){
    // 其余传奇事件全部完成（同为 allLegend 的条目除外）
    if(!LEGEND.every(function(x){
      return x === L || (x[8] && x[8].allLegend) || S.legendDone.indexOf(x[0]) >= 0;
    })) return false;
  }
  return true;
}
/* 类别名：每次出现时在「传奇事件 / 世界级事件」中随机 2 选 1，同一事件全程一致 */
function legendTitle(){ return Math.random() < 0.5 ? "传奇事件" : "世界级事件"; }
/* 专属条件的人类可读描述（展示在事件卡上） */
function legendCondText(L){
  const c = L[8] || {};
  if(c.q) return "条件：完成前置委托「"+c.q+"」✅";
  if(c.q40) return "条件：累计完成 40 次 Lv5 以下委托（"+Math.min(S.doneBelow5,40)+"/40）";
  if(c.sleep30) return "条件：最近 30 天 ≥27 天 23:30 前入睡（含断连保护）";
  if(c.legend) return "条件：完成传奇事件「"+c.legend+"」✅";
  if(c.allLegend) return "条件：完成其余全部传奇事件（"+S.legendDone.filter(function(n){ return n !== L[0]; }).length+"/11）";
  return "";
}
/* 周标识（周一为一周开始，返回该周周一日期串） */
function weekKey(d){
  d = d || parseDate(todayStr());   // 默认取当前「游戏日」（早 6 点日界线）；传入值须已是「游戏日」的日期
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay()+6)%7));
  return fmtDate(t);
}
/* 授予传奇奖励：解析奖励文本里的称号/宠物，其余记为藏品 */
function grantLegendReward(L){
  const parts = (L[7]||"").split("；").filter(Boolean);
  parts.forEach(function(p){
    let m;
    if((m = p.match(/称号「(.+?)」/))){
      if(S.titles.indexOf(m[1]) < 0) S.titles.push(m[1]);
    } else if((m = p.match(/宠物「(.+?)」/))){
      if(S.pets.indexOf(m[1]) < 0) S.pets.push(m[1]);
    } else {
      if(S.trophies.indexOf(p) < 0) S.trophies.push(p);
    }
  });
}
/* 独立成功率公式：B=5%，健康系数 0.5%，E 上限 +10%，Cap 65%，Floor 5% */
function legendRate(sides){
  const H = prevHealthScore();   // v1.34：按昨日日结算评分
  const D = (sides === "噩梦") ? -0.20 : (sides === "困难" ? -0.10 : 0);
  let E = Math.min(0.10, gearRate() + (S.skills["专注"]||0)*0.01 + (S.skills["生存"]||0)*0.01);
  let r = 0.05 + D + H*0.005 + E + charmRate() + gearEffects().legend;
  return Math.max(0.05, Math.min(0.65, r + wolfRateBonus() + petBonus().rate));   // 宠物加成：独立叠加
}
/* 传奇报酬面额 → 铜币 */
const LEGEND_GOLD = {"1铂金币":1000000,"1.5铂金币":1500000,"2铂金币":2000000,"3铂金币":3000000,
  "5铂金币":5000000,"6铂金币":6000000,"7铂金币":7000000,"8铂金币":8000000,
  "10铂金币":10000000,"50金币":500000};
/* 传奇声望奖励（最低 400）：400 起步 + 每铂金币报酬 +100 + 噩梦难度 +200
   例：屠龙传说 1铂金噩梦 700 / 公会大师试炼 50金困难 450 / 创世碎片 10铂金噩梦 1600 */
function legendRep(L){
  const copper = LEGEND_GOLD[L[4]] || 1000000;
  return 400 + Math.round(copper/1000000*100) + (L[3] === "噩梦" ? 200 : 0);
}
function rollLegend(){
  const t = todayStr();
  if(S.legendDay === t) return;              // 今天已判定过
  // 新的一天：清除昨日遗留的「预览」事件（正式事件保留至接取）
  if(S.legendPreview){ S.legendActive = null; S.legendPreview = false; }
  S.legendDay = t;
  if(!legendUnlocked()){
    // 未达参与条件：每日 2% 极低概率「窥见」传奇事件——仅可看，不能接取/参与（v1.24）
    if(Math.random() < 0.02){
      S.legendActive = LEGEND[Math.floor(Math.random()*LEGEND.length)];
      S.legendPreview = true;
      S.legendName = legendTitle();
      addLog("🔮 "+S.legendName+"的低语：「"+S.legendActive[0]+"」——尚未达到参与条件，只能远远望见（预览）","gold");
      if(S.daily) S.daily.events.push("🔮 "+S.legendName+"低语（预览）：" + S.legendActive[0]);
      showAlert("⚡ 触发特殊事件！<br><br>你隐约听见【"+S.legendName+"】「"+S.legendActive[0]+"」的低语——尚未达到参与条件，只能远远望见（仅预览）。<br><br>到「冒险者委托」页 · 特殊事件窗口查看详情。", "特殊事件");
    }
    return;
  }
  const p = 0.15 + (S.charm >= 5 ? 0.05 : 0);   // 冥念护符满级 +5%
  if(Math.random() < p){
    // 只从满足专属条件的事件中抽取（03_委托系统.md：必须满足全部触发条件）
    const pool = LEGEND.filter(legendEligible);
    if(!pool.length) return;
    S.legendActive = pool[Math.floor(Math.random()*pool.length)];
    S.legendPreview = false;
    S.legendName = legendTitle();            // 出现时随机 2 选 1，全程一致
    addLog("🌍 "+S.legendName+"出现：「"+S.legendActive[0]+"」","gold");
    if(S.daily) S.daily.events.push("🌍 "+S.legendName+"出现：" + S.legendActive[0]);
    showAlert("⚡ 触发特殊事件！<br><br>【"+S.legendName+"】「"+S.legendActive[0]+"」已出现。<br><br>到「冒险者委托」页 · 特殊事件窗口查看详情并接取。", "特殊事件");
  }
}
function takeLegend(){
  const L = S.legendActive;
  if(!L) return;
  if(S.legendPreview) return showAlert("🔮 这只是低语中的幻影——尚未达到参与条件，传奇事件无法接取，也无法参与。<br><br>继续成长吧，它会在未来等你。", S.legendName);
  if(S.legendWeek === weekKey()) return showAlert("本周已经接取过"+S.legendName+"了。<br><br>每周最多接取 1 次，下周再来。", S.legendName);
  if(S.active.length >= simCapNow()) return showAlert("同时进行的委托已满。", S.legendName);
  const rate = legendRate(L[3]);
  const days = L[2];
  S.legendActive = null;
  S.legendWeek = weekKey();                  // 记录本周已接取
  S.active.push({
    q:[L[0], L[1], "传奇", 0, L[3], 0, L[4], 0, {}],
    rate:rate, meal:activeMeal(), legend:L, days:days, lname:S.legendName,
    acceptTs: Date.now(),
    finishTs: Date.now() + days*86400000,
    name: L[0]
  });
  addLog("🌍 接取"+S.legendName+"「"+L[0]+"」耗时 "+days+" 天，成功率 "+Math.round(rate*100)+"%","gold");
  if(S.daily) S.daily.events.push("🌍 接取"+S.legendName+"「" + L[0] + "」");
  save(); render();
}

/* ══════════════════════════════════════════════════
   稀有事件
   ══════════════════════════════════════════════════ */
/* 触发概率：基线 5% + 幸运技能每级 +1%（满级 10%）+ 装备加成 + 裂痕回响层数 */
function rareChance(){
  const p = 0.05 + (S.skills && S.skills["幸运"] || 0) * 0.01 + gearEffects().rare + (S.echo||0)*0.01;
  return Math.min(0.25, p);
}
/* 掷一次判定；触发则结算并返回事件名 */
function tryRareEvent(questTag, questName){
  if(Math.random() >= rareChance()) return null;
  // 按权重抽取
  const total = RARE.reduce(function(a,r){ return a + r[1]; }, 0);
  let roll = Math.random() * total, picked = RARE[0];
  for(const r of RARE){ roll -= r[1]; if(roll <= 0){ picked = r; break; } }
  const [name, , type, val, desc] = picked;

  let msg = "", cls = "gold";
  if(type === "gold"){ S.money += val * 10000; msg = "+" + val + " 金币"; }
  else if(type === "silver"){ S.money += val * 100; msg = "+" + val + " 银币"; }
  else if(type === "exp"){ S.exp += val; msg = "+" + val + " 经验"; }
  else if(type === "con"){ S.con += val; msg = "+" + val + " 贡献"; }
  else if(type === "sp"){ S.explore += val; msg = "+" + val + " 探索点"; }
  else if(type === "vit"){ S.vit += val; msg = "+" + val + " 活力点"; }
  else if(type === "pay"){
    if(questName){ msg = "「" + questName + "」报酬 +50%（稍后结算时体现）"; }
    else { S.money += 5000; msg = "探索触发 → 改为获得 50 银币"; }
  }
  else if(type === "pay25"){ msg = "下一次委托报酬 +25%"; S.rareNextPay = (S.rareNextPay||0) + val; }
  else if(type === "rate"){ msg = "下一次委托成功率 +5%"; S.rareNextRate = (S.rareNextRate||0) + val; }
  else if(type === "mat3"){
    const got = {};
    for(let i=0;i<val;i++){ const m = randomMat(Math.random()<0.7?"普通":"精良"); S.mats[m]=(S.mats[m]||0)+1; got[m]=(got[m]||0)+1; }
    msg = Object.entries(got).map(function(e){return e[0]+"×"+e[1];}).join(" ");
  }
  else if(type === "gear"){
    const pool = GEAR.filter(function(g){ return g[1]==="普通"||g[1]==="精良"; });
    const g = pool[Math.floor(Math.random()*pool.length)];
    if(!S.gear.includes(g[0])) S.gear.push(g[0]);
    msg = "获得装备「" + g[0] + "」";
  }
  else if(type === "item"){
    const items = ["清醒符咒","安眠护符","活力药水","疾风符咒","时之怀表","幸运币"];
    const it = items[Math.floor(Math.random()*items.length)];
    S.items[it] = (S.items[it]||0) + 1;
    msg = "获得「" + it + "」";
  }

  addLog("✨ 稀有事件「" + name + "」→ " + msg, cls);
  if(S.daily && S.daily.events) S.daily.events.push("✨ 稀有事件：" + name + "（" + msg + "）");
  checkLevelUp();
  return {name, msg, desc};
}
function showRareEvent(ev){
  if(!ev) return;
  showAlert("<div style='text-align:center;font-size:15px;color:var(--gold);margin-bottom:8px'>✨ " + ev.name + "</div>" + ev.msg, "稀有事件");
}

/* ══════════════════════════════════════════════════
   公会技能树
   ══════════════════════════════════════════════════ */
const SKILLS = [
  {n:"体能", d:"精力上限 +10 / 级", tag:null},
  {n:"专注", d:"精英类委托成功率 +1% / 级", tag:"精英"},
  {n:"社交", d:"护送类委托报酬 +2% / 级", tag:"护送"},
  {n:"生存", d:"采集/狩猎类委托成功率 +1% / 级", tag:["采集","狩猎"]},
  {n:"幸运", d:"稀有事件概率 +1% / 级", tag:null}
];
const SKILL_COST = [10,20,40,70,110];        // 第 1~5 级各需贡献
function skillTotal(){ return SKILLS.reduce(function(a,s){ return a + (S.skills[s.n]||0); }, 0); }
function skillCap(){ return [0,0,5,10,15,20,25,25,25,25][guildIdx()] || 0; }   // 按公会等级开放上限（F~S 逐级 +5，W/H/P 保持满 25）
/* 技能提供的成功率加成（计专精/生存，覆盖对应标签） */
function skillRate(q){
  const tag = q[1];
  let r = 0;
  if(tag === "精英") r += (S.skills["专注"]||0) * 0.01;
  if(tag === "采集" || tag === "狩猎") r += (S.skills["生存"]||0) * 0.01;
  return r;
}
/* 技能提供的报酬加成（社交，仅护送类） */
function skillPay(q){
  return (q && q[1] === "护送") ? (S.skills["社交"]||0) * 0.02 : 0;
}
function upSkill(name){
  const idx = SKILLS.findIndex(function(s){ return s.n === name; });
  const cur = S.skills[name] || 0;

/* 晨间委托：可接取时间窗与 06:00–09:00 有交集即算（「全天」视为有交集，见 05_装备与制造.md） */
function isMorningQuest(q){
  const tw = q[2] || "";
  if(tw === "全天") return true;
  const m = tw.match(/(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})/);
  if(!m) return false;
  const s = (+m[1])*60 + (+m[2]), e = (+m[3])*60 + (+m[4]);
  const ms = 6*60, me = 9*60;
  return s < me && e > ms;
}
/* ── 副属性解析：把装备副属性文本转成可计算的效果对象 ── */
function gearEffects(){
  const e = {
    rate:{},        // 分类成功率加成 {"精英":0.02, "全":0.02}
    pay:{},         // 分类报酬加成
    enCut:{},       // 分类精力消耗减免
    enCutAll:0,     // 全委托精力减免
    nightCut:0,     // 熬夜惩罚减免
    exp:0,          // 委托经验加成
    con:0,          // 贡献加成
    rare:0,         // 稀有事件概率
    mat:0,          // 材料获取加成
    legend:0,       // 传奇事件成功率
    healthUp:0,     // 健康加成上限
    sp:0,           // 每日探索点
    simCap:0,       // ★ 同时进行上限
    dailyLimit:0,   // ★ 每日接取上限
    nightmare:0     // v1.32：噩梦难度成功率（修复死词条）
  };
  ["weapon","armor","accessory","charmSlot"].forEach(function(slot){
    const n = S.equipped && S.equipped[slot]; if(!n) return;
    const g = gearDef(n); if(!g) return;
    const sub = g[4]; if(!sub || sub === "—") return;
    let m;
    // 分类成功率
    const reRate = /(\S+?)类(?:委托)?成功率\+(\d+)%/g;
    while((m = reRate.exec(sub))) e.rate[m[1]] = (e.rate[m[1]]||0) + (+m[2])/100;
    if((m = /全委托成功率\+(\d+)%/.exec(sub))) e.rate["全"] = (e.rate["全"]||0) + (+m[1])/100;
    // 分类报酬
    const rePay = /(\S+?)类(?:委托)?报酬\+(\d+)%/g;
    while((m = rePay.exec(sub))) e.pay[m[1]] = (e.pay[m[1]]||0) + (+m[2])/100;
    // 精力消耗减免
    const reEn = /(\S+?)类精力消耗-(\d+)%/g;
    while((m = reEn.exec(sub))) e.enCut[m[1]] = (e.enCut[m[1]]||0) + (+m[2])/100;
    if((m = /全委托精力消耗-(\d+)%/.exec(sub))) e.enCutAll += (+m[1])/100;
    // 熬夜惩罚减免
    if((m = /熬夜惩罚-(\d+)%/.exec(sub))) e.nightCut += (+m[1])/100;
    // 其它
    if((m = /委托经验\+(\d+)%/.exec(sub))) e.exp += (+m[1])/100;
    if((m = /公会贡献\+(\d+)%/.exec(sub))) e.con += (+m[1])/100;
    if((m = /稀有事件概率\+(\d+)%/.exec(sub))) e.rare += (+m[1])/100;
    if((m = /材料获取\+(\d+)%/.exec(sub))) e.mat += (+m[1])/100;
    if((m = /传奇事件成功率\+(\d+)%/.exec(sub))) e.legend += (+m[1])/100;
    if((m = /健康加成上限\+(\d+)%/.exec(sub))) e.healthUp += (+m[1])/100;
    if((m = /探索点\+(\d+)\/天/.exec(sub))) e.sp += +m[1];
    if((m = /★同时进行上限\+(\d+)/.exec(sub))) e.simCap += +m[1];
    if((m = /★每日接取上限\+(\d+)/.exec(sub))) e.dailyLimit += +m[1];
    if((m = /晨间(?:类|时段)?委托报酬\+(\d+)%/.exec(sub))) e.pay["晨间"] = (e.pay["晨间"]||0) + (+m[1])/100;
    if((m = /噩梦难度成功率\+(\d+)%/.exec(sub))) e.nightmare += (+m[1])/100;   // v1.32
  });
  return e;
}

/* ── 打造规则 ──
   主材料：图纸指定，数量按品级 + 部位（普通 2 / 精良 3 / 稀有 4 / 史诗 5 / 传说 6，饰品 −1）
   副材料：与主材料同系品类（见 SUB_CATS）中「同品阶或低一阶」的材料，数量按品级（2 / 3 / 4 / 6 / 8，护甲 +1）
   加工费：按品质 */
const QUALITY_ORDER = ["普通","精良","稀有","史诗","传说"];
const MORDER = ["木材","石材","矿石","宝石","草药","食材","织物","兽材","特殊"];   // v1.38g：材料品类顺序（图鉴 / 背包共用）
const DIFF_ORDER = ["简单","普通","困难","噩梦"];   // v1.38h：委托难度顺序（图鉴排序）
const DIFF_COLOR = {简单:"var(--green)", 普通:"var(--dim2)", 困难:"var(--orange)", 噩梦:"var(--red)"};   // v1.38h：难度文字标识配色
/* v1.38h：料理品级 = 配方材料中的最高品阶 */
function cookTier(r){
  let t = "普通";
  Object.keys(r.ing||{}).forEach(function(k){
    const q = M[k] ? M[k][1] : "普通";
    if(QUALITY_ORDER.indexOf(q) > QUALITY_ORDER.indexOf(t)) t = q;
  });
  return t;
}
/* ── v1.38c：副材料品类联动 —— 由主材料品类推导允许的副材料品类（食材不可作打造材料）── */
const SUB_CATS = {
  "木材": ["木材","兽材","织物"],   // 弓弩杖：兽筋弓弦、皮绳缠柄
  "兽材": ["兽材","织物","木材"],   // 皮革甲：布衬缝线、木扣
  "矿石": ["矿石","木材","兽材"],   // 剑斧铠：木柄、皮缠
  "石材": ["石材","矿石","木材"],   // 石锤：金属箍、木柄
  "宝石": ["宝石","矿石"],          // 饰品：宝石与金属底托
  "织物": ["织物","兽材"],          // 布甲法袍：皮革束带
  "草药": ["草药","织物","木材"],   // 植物系：藤蔓、丝带、木芯
  "特殊": ["特殊","宝石","矿石"]    // 龙鳞魔晶：秘银、魔晶镶嵌
};
const _SUB_CATS_DEFAULT = ["木材","石材","矿石","宝石","草药","织物","兽材","特殊"];
function subCatsFor(mainMat){
  const e = M[mainMat];
  return SUB_CATS[e ? e[0] : ""] || _SUB_CATS_DEFAULT;
}
function subTiers(quality){
  const i = QUALITY_ORDER.indexOf(quality);
  return [QUALITY_ORDER[i], QUALITY_ORDER[i-1]].filter(Boolean);   // 同阶 + 低一阶
}
function craftCost(quality){
  return {"普通":0.5,"精良":3,"稀有":15,"史诗":60,"传说":300}[quality] || 0;
}
/* 自动挑选副材料（v1.38c：品阶 × 品类双约束；优先消耗低品阶、低价材料） */
function pickSubMats(quality, mainMat, need){
  const tiers = subTiers(quality);
  const cats = subCatsFor(mainMat);
  const pool = Object.keys(S.mats).filter(function(k){
    return cats.indexOf(M[k][0]) >= 0 && tiers.indexOf(M[k][1]) >= 0 && k !== mainMat && (S.mats[k]||0) > 0;
  });
  // 低品阶优先；同品阶低价优先
  pool.sort(function(a,b){
    const d = tiers.indexOf(M[b][1]) - tiers.indexOf(M[a][1]);
    return d !== 0 ? d : (M[a][2] - M[b][2]);
  });
  const picked = {};
  let left = need;
  for(const k of pool){
    if(left <= 0) break;
    const take = Math.min(S.mats[k], left);
    picked[k] = take; left -= take;
  }
  return left > 0 ? null : picked;      // null = 副材料不够
}

        + '<div class="muted" style="font-size:12px;line-height:1.7">' + (TITLE_DESC[n] || "当月称号。") + "</div></div>";
    }
  });
  dlg("🏷️ 称号", rows || '<div class="muted">还没有称号。</div>', [{text: "关闭", fn: null}]);
}

function craftMainMat(name){
  const g = gearDef(name); if(!g) return null;
  const parts = g[5].split("×");
  return {mat: parts[0], cnt: +parts[1] || 3};
}
/* 打造材料需求（2026-10-02 重设，按品级 + 部位）：
   主材料：普通 2 / 精良 3 / 稀有 4 / 史诗 5 / 传说 6（饰品小件 −1，写在装备数据里）
   副材料：普通 2 / 精良 3 / 稀有 4 / 史诗 6 / 传说 8（护甲厚重 +1） */
function subMatCount(quality, slot){
  const base = {"普通":2, "精良":3, "稀有":4, "史诗":6, "传说":8}[quality] || 3;
  return base + (slot === "护甲" ? 1 : 0);
}
function craft(name){
  const g = gearDef(name); if(!g) return;
  if(g[5] === "—") return showAlert("「"+name+"」不能打造，只能通过成就或事件获得。", "打造");
  if(!S.blueprints[name]) return showAlert("没有「"+name+"图纸」。<br><br>到公会商店（或铂金商店）购买图纸后才能打造。", "打造");

  const mm = craftMainMat(name);
  const cost = craftCost(g[1]) * 10000;
  const subCnt = subMatCount(g[1], g[2]);
  if((S.mats[mm.mat]||0) < mm.cnt)
    return showAlert("主材料不足。<br><br>需要「"+mm.mat+" ×"+mm.cnt+"」，当前 "+(S.mats[mm.mat]||0)+"。", "打造");
  const subs = pickSubMats(g[1], mm.mat, subCnt);
  if(!subs)
    return showAlert("副材料不足。<br><br>需要 "+subCatsFor(mm.mat).join("/")+" 类「"+subTiers(g[1]).join(" 或 ")+"」品阶的材料 ×"+subCnt+"（主材料不计入）。", "打造");
  if(S.money < cost) return showAlert("加工费不足。<br><br>需要 "+fmtMoneyFull(cost)+"。", "打造");

  // 扣除
  S.mats[mm.mat] -= mm.cnt; if(S.mats[mm.mat] <= 0) delete S.mats[mm.mat];
  const used = [];
  for(const k in subs){ S.mats[k] -= subs[k]; used.push(k+"×"+subs[k]); if(S.mats[k] <= 0) delete S.mats[k]; }
  S.money -= cost;
  if(!S.gear.includes(name)) S.gear.push(name);
  if(!S.forged) S.forged = [];                       // v1.35：图鉴·打造记录
  if(S.forged.indexOf(name) < 0) S.forged.push(name);
  addLog("🔨 打造「"+name+"」→ "+mm.mat+"×"+mm.cnt+" + "+used.join(" ")+"（-"+fmtMoney(cost)+"）","gold");
  save(); render();
  showAlert("打造成功：「"+name+"」<br><br>消耗："+mm.mat+"×"+mm.cnt+"　"+used.join(" ")+"<br>加工费："+fmtMoney(cost)+"<br><br>已放入冒险背包。", "打造");
}

  // ── 特殊事件 ──
  const ev = y.events || [];
  if(ev.length){
    h += `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
      <div style="font-size:12px;color:var(--gold);margin-bottom:4px">⚡ 特殊事件</div>
      ${ev.map(function(e){ return '<div style="font-size:12px;padding:3px 0;color:var(--gold2)">· '+e+'</div>'; }).join("")}
    </div>`;
  }

  dlg("📜 昨日结算 · " + y.date, h, [{text:"开始新的一天", cls:"pri", fn:null}]);
}

/* ══════════════════════════════════════════════════
   自由探索

function dlg(title, bodyHtml, buttons, opts){                 // v1.56b：opts.wide = 加宽加长弹窗
  const el = document.getElementById("dlg");
  const btns = buttons && buttons.length ? buttons : [{text:"确定", cls:"pri", fn:null}];
  let bh = "";
  btns.forEach((b,i)=>{ bh += '<button class="btn '+(b.cls||"")+'"'+(b.style?' style="'+b.style+'"':'')+' data-i="'+i+'">'+b.text+'</button>'; });
  el.innerHTML = '<div class="dlg-box'+(opts && opts.wide ? ' dlg-wide' : '')+'"><div class="dlg-title">'+title+'</div>'
               + '<div class="dlg-body">'+bodyHtml+'</div>'
               + '<div class="dlg-btns">'+bh+'</div></div>';
  el.classList.add("on");
  el.querySelectorAll("button[data-i]").forEach(function(btn){
    btn.onclick = function(){
      const b = btns[+btn.dataset.i];
      clrDlg();
      if(b && b.fn) b.fn();
    };
  });

    "护送":"委托人的人身安全是第一要务。",
    "短时":"临时差事，做完即走，干净利落。",
    "精英":"高难度讨伐，仅推荐有把握的冒险者接取。"
  }[tag] || "公会发布的常规委托。";

/* ── 酒馆料理（v1.41f4：原公会厨房 · 料理）── */
/* v1.50：料理材料合并（主材 main + 辅材 sub）——校验/扣除/展示共用 */
function recipeIng(r){
  const d = {};
  for(const k in (r.main||{})) d[k] = r.main[k];
  for(const k in (r.sub||{})) d[k] = r.sub[k];
  return d;
}
function canCook(r){
  const ing = recipeIng(r);
  for(const k in ing) if((S.mats[k]||0) < ing[k]) return false;
  return true;
}
/* 当前生效的料理（当日有效）——决定下一次接取的加成 */
function activeMeal(){
  if(!S.lastMeal) return null;
  return S.lastMeal.date === todayStr() ? S.lastMeal : null;
}
/* 料理带来的精力上限提升（当日有效） */
function mealCapBonus(){
  return (S.mealCap && S.mealCap.date === todayStr()) ? (S.mealCap.cap||0) : 0;
}
function cook(i){
  const r = CFG.recipes[i];
  if(!cookTierOpen(r)) return showAlert("「"+r.n+"」尚未开放——料理按品阶随冒险者等级逐步解锁。", "酒馆料理");
  if(!canCook(r)) return showAlert("材料不足，无法烹饪「"+r.n+"」。<br><br>需要："+
    Object.keys(recipeIng(r)).map(function(k){ return k+" ×"+recipeIng(r)[k]; }).join("、"), "酒馆料理");
  const t = todayStr();
  if(r.sp){   // v1.41f5：探索点料理——每日最多 2 次 + 当日累计上限 +5
    if(!S.mealSp || S.mealSp.date !== t) S.mealSp = {date:t, cnt:0, got:0};
    if(S.mealSp.cnt >= 2) return showAlert("今日恢复探索点的料理已经用过 2 次了，明天再来。<br><br>（探索点料理每日最多 2 次——v1.41f5）", "酒馆料理");
    if(S.mealSp.got >= 5) return showAlert("今日料理恢复的探索点已达上限（+5 点）。<br><br>剩下的明天再来吧——v1.41f5", "酒馆料理");
  }
  const _ing0 = recipeIng(r);                  // v1.50：主材 + 辅材一并扣除
  confirmSpend("酒馆料理", "确定烹饪「"+r.n+"」吗？将消耗："+Object.keys(_ing0).map(function(k){ return k+" ×"+_ing0[k]; }).join("、"), function(){
  for(const k in _ing0){
    S.mats[k] -= _ing0[k];
    if(S.mats[k] <= 0) delete S.mats[k];
  }
  const parts = [];
  if(r.cap){   // v1.32：先扩展上限，再回精力（否则精力已满时回精被吞）
    if(!S.mealCap || S.mealCap.date !== t) S.mealCap = {date:t, cap:0};
    S.mealCap.cap += r.cap;
    parts.push("当日精力上限 +"+r.cap);
  }
  if(r.en || r.enPct){   // v1.42：enPct = 按精力上限的百分比恢复（巨龙盛宴 50%）
    const before = S.energy;
    const _add = r.enPct ? Math.round(energyMaxNow() * r.enPct) : r.en;
    S.energy = Math.min(energyMaxNow(), S.energy + _add);
    parts.push("精力 "+before+" → "+S.energy);
  }
  if(!S.cooked) S.cooked = [];                       // v1.35：图鉴·料理记录
  if(S.cooked.indexOf(r.n) < 0) S.cooked.push(r.n);
  if(r.sp){   // v1.41f5：当日累计 +5 封顶（前段已挡；此处兜底截断）并计入次数
    const _gain = Math.min(r.sp, Math.max(0, 5 - S.mealSp.got));
    S.explore += _gain;
    S.mealSp.cnt++;
    S.mealSp.got += _gain;
    parts.push("探索点 +"+_gain+"（今日第 "+S.mealSp.cnt+"/2 次）");
  }
  if(r.bonus || r.rate){
    S.lastMeal = {date:t, name:r.n, bonus:r.bonus||0, rate:r.rate||0};
    parts.push("✅ 「"+r.n+"」生效，下次接取的委托享受加成");
  }
  addLog("🍲 烹饪「"+r.n+"」→ "+parts.join("、"), "ok");
  save(); render();
  });
}

/* ══════════════════════════════════════════════════
   传奇事件 / 世界级事件
   ══════════════════════════════════════════════════ */
/* 最近 n 天平均健康评分（不足则按已有记录算） */
function avgHealthLast(n){
  const h = S.history.slice(-n);
  if(!h.length) return 0;
  return h.reduce(function(a,x){ return a + (x.score||0); }, 0) / h.length;
}
/* 最近 n 天中 23:30 前入睡的天数 */
function sleepDaysLast(n){
  return S.history.slice(-n).filter(function(x){ return x.sleep === true; }).length;
}
/* 全局门槛（03_委托系统.md 3.9 · 触发条件 1/2/4/5） */
function legendUnlocked(){
  return S.lvIdx >= 4                        // Lv5
      && S.exp >= 30000                      // 传奇资格（累计经验）
      && guildIdx() >= 5                     // 公会 A 级（2,200 声望）
      && avgHealthLast(7) >= 60              // 最近 7 天平均健康 ≥ 60
      && sleepDaysLast(30) >= 25;            // 最近 30 天 23:30 前入睡 ≥ 25 天
}
/* 单事件专属条件（触发条件 3：完成对应前置委托 / 称号物品等） */
function legendEligible(L){
  const c = L[8] || {};
  if(c.q && !(S.doneQuests[c.q] > 0)) return false;
  if(c.q40 && S.doneBelow5 < 250) return false;   // v1.60：40 → 250（到 Lv4 自然量已 ≈175，40 形同白送）
  if(c.sleep30 && !sleepStreakProt(30)) return false;   // v1.19：含断连保护（最近 30 天 ≥27 天）
  if(c.legend && S.legendDone.indexOf(c.legend) < 0) return false;
  if(c.gear && (S.gear || []).indexOf(c.gear) < 0) return false;   // v1.51 A3：需拥有指定传说装备
  if(c.allLegend){
    // 其余传奇事件全部完成（同为 allLegend 的条目除外）
    if(!LEGEND.every(function(x){
      return x === L || (x[8] && x[8].allLegend) || S.legendDone.indexOf(x[0]) >= 0;
    })) return false;
  }
  return true;
}
/* 类别名：每次出现时在「传奇事件 / 世界级事件」中随机 2 选 1，同一事件全程一致 */
function legendTitle(){ return Math.random() < 0.5 ? "传奇事件" : "世界级事件"; }
/* 专属条件的人类可读描述（展示在事件卡上） */
function legendCondText(L){
  const c = L[8] || {};
  if(c.q) return "条件：完成前置委托「"+c.q+"」✅";
  if(c.q40) return "条件：累计完成 250 次 Lv5 以下委托（"+Math.min(S.doneBelow5,250)+"/250）";
  if(c.sleep30) return "条件：最近 30 天 ≥27 天 23:30 前入睡（含断连保护）";
  if(c.legend) return "条件：完成传奇事件「"+c.legend+"」✅";
  if(c.gear) return "条件：需拥有传说装备「"+c.gear+"」"+((S.gear||[]).indexOf(c.gear)>=0?" ✅":"（尚未拥有）");   // v1.51 A3
  if(c.allLegend) return "条件：完成其余全部传奇事件（"+S.legendDone.filter(function(n){ return n !== L[0]; }).length+"/11）";
  return "";
}
/* 周标识（周一为一周开始，返回该周周一日期串） */
function weekKey(d){
  d = d || parseDate(todayStr());   // 默认取当前「游戏日」（早 6 点日界线）；传入值须已是「游戏日」的日期
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay()+6)%7));
  return fmtDate(t);
}
/* 授予传奇奖励：解析奖励文本里的称号/宠物，其余记为藏品 */
function grantLegendReward(L){
  const parts = (L[7]||"").split("；").filter(Boolean);
  parts.forEach(function(p){
    let m;
    if((m = p.match(/称号「(.+?)」/))){
      if(S.titles.indexOf(m[1]) < 0) S.titles.push(m[1]);
    } else if((m = p.match(/宠物「(.+?)」/))){
      if(S.pets.indexOf(m[1]) < 0) S.pets.push(m[1]);
    } else if((m = p.match(/^(.+?)图纸$/)) && gearDef(m[1])){
      S.blueprints[m[1]] = true;                       // v1.40：图纸类奖励入图纸库（原误入藏品 → 陨星武器图纸拿不到）
    } else if(gearDef(p)){
      if(S.gear.indexOf(p) < 0) S.gear.push(p);        // v1.40：装备类奖励入装备背包（原误入藏品 → 世界树护符/时间沙漏永远拿不到）
    } else {
      if(S.trophies.indexOf(p) < 0) S.trophies.push(p);
    }
  });
}
/* 独立成功率公式：B=5%，健康系数 0.5%，E 上限 +10%，Cap 65%，Floor 5% */
function legendRate(sides){
  const H = prevHealthScore();   // v1.34：按昨日日结算评分
  const D = (sides === "噩梦") ? -0.20 : (sides === "困难" ? -0.10 : 0);
  let E = Math.min(0.10, gearRate() + (S.skills["专注"]||0)*0.01 + (S.skills["生存"]||0)*0.01);
  let r = 0.05 + D + H*0.005 + E + charmRate() + gearEffects().legend;
  r += todayFestEff().legend || 0;   // v1.41f：中秋·月华（传奇事件成功率 +10%）
  return Math.max(0.05, Math.min(0.65, r + wolfRateBonus() + petBonus().rate));   // 宠物加成：独立叠加
}
/* 传奇报酬面额 → 铜币 */
const LEGEND_GOLD = {"1铂金币":1000000,"1.5铂金币":1500000,"2铂金币":2000000,"3铂金币":3000000,
  "4铂金币":4000000,"4.5铂金币":4500000,"5铂金币":5000000,"6铂金币":6000000,"7铂金币":7000000,"8铂金币":8000000,
  "9铂金币":9000000,"10铂金币":10000000,"50金币":500000};   // v1.59：补 "9铂金币"（万龙之宴 8→9，此前缺键会静默回落 1 铂金）
/* 传奇声望奖励（最低 400）：400 起步 + 每铂金币报酬 +100 + 噩梦难度 +200
   例：屠龙传说 2铂金噩梦 800（v1.59）/ 公会大师试炼 2铂金困难 600（v1.59）/ 创世碎片 10铂金噩梦 1600 */
function legendRep(L){
  const copper = LEGEND_GOLD[L[4]] || 1000000;
  return 400 + Math.round(copper/1000000*100) + (L[3] === "噩梦" ? 200 : 0);
}
function rollLegend(){
  const t = todayStr();
  if(S.legendDay === t) return;              // 今天已判定过
  // 新的一天：清除昨日遗留的「预览」事件（正式事件保留至接取）
  if(S.legendPreview){ S.legendActive = null; S.legendPreview = false; }
  S.legendDay = t;
  if(!legendUnlocked()){
    // 未达参与条件：每日 2% 极低概率「窥见」传奇事件——仅可看，不能接取/参与（v1.24；v1.41 用户指定保留：给玩家盼头与兴趣）
    if(Math.random() < 0.02){
      S.legendActive = LEGEND[Math.floor(Math.random()*LEGEND.length)];
      S.legendPreview = true;
      S.legendName = legendTitle();
      addLog("🔮 "+S.legendName+"的低语：「"+S.legendActive[0]+"」——尚未达到参与条件，只能远远望见（预览）","gold");
      if(S.daily) S.daily.events.push("🔮 "+S.legendName+"低语（预览）：" + S.legendActive[0]);
      showAlert("⚡ 触发特殊事件！<br><br>你隐约听见【"+S.legendName+"】「"+S.legendActive[0]+"」的低语——尚未达到参与条件，只能远远望见（仅预览）。<br><br>到「冒险者委托」页 · 特殊事件窗口查看详情。", "特殊事件");
    }
    return;
  }
  const p = 0.15 + (S.charm >= 5 ? 0.05 : 0);   // 冥念护符满级 +5%
  if(Math.random() < p){
    // 只从满足专属条件的事件中抽取（03_委托系统.md：必须满足全部触发条件）
    const pool = LEGEND.filter(legendEligible);
    if(!pool.length) return;
    S.legendActive = pool[Math.floor(Math.random()*pool.length)];
    S.legendPreview = false;
    S.legendName = legendTitle();            // 出现时随机 2 选 1，全程一致
    addLog("🌍 "+S.legendName+"出现：「"+S.legendActive[0]+"」","gold");
    if(S.daily) S.daily.events.push("🌍 "+S.legendName+"出现：" + S.legendActive[0]);
    showAlert("⚡ 触发特殊事件！<br><br>【"+S.legendName+"】「"+S.legendActive[0]+"」已出现。<br><br>到「冒险者委托」页 · 特殊事件窗口查看详情并接取。", "特殊事件");
  }
}
function takeLegend(){
  const L = S.legendActive;
  if(!L) return;
  if(S.legendPreview) return showAlert("🔮 这只是低语中的幻影——尚未达到参与条件，传奇事件无法接取，也无法参与。<br><br>继续成长吧，它会在未来等你。", S.legendName);
  if((S.active||[]).some(function(a){ return a.legend; }))      // v1.51 A3：传奇事件同时最多 1 个（对齐 01 文档口径）
    return showAlert("已有传奇事件进行中——传奇事件同时最多 1 个，先完成它再来。", S.legendName);
  const _wk = weekKey();
  const _lwN = (S.legendWeek === _wk) ? (S.legendWeekN||0) : 0;
  const _lwCap = guildIdx() >= 9 ? 2 : 1;    // v1.40：P 级「至尊」特权——传奇事件每周可接 2 次（原未实现）
  if(_lwN >= _lwCap) return showAlert("本周已经接取过 "+_lwN+" 次"+S.legendName+"了。<br><br>"+(_lwCap>1?"至尊每周最多 2 次":"每周最多接取 1 次")+"，下周再来。", S.legendName);
  // v1.41：传奇事件独立槽位——不再占用普通「同时进行」上限
  const rate = legendRate(L[3]);
  const days = L[2];
  S.legendActive = null;
  S.legendWeek = _wk; S.legendWeekN = _lwN + 1;   // 记录本周已接取次数
  S.active.push({
    q:[L[0], L[1], "传奇", 0, L[3], 0, L[4], 0, {}],
    rate:rate, meal:activeMeal(), legend:L, days:days, lname:S.legendName,
    acceptTs: Date.now(),
    finishTs: Date.now() + days*86400000,
    name: L[0]
  });
  addLog("🌍 接取"+S.legendName+"「"+L[0]+"」耗时 "+days+" 天，成功率 "+Math.round(rate*100)+"%","gold");
  if(S.daily) S.daily.events.push("🌍 接取"+S.legendName+"「" + L[0] + "」");
  save(); render();
}

/* ══════════════════════════════════════════════════
   稀有事件
   ══════════════════════════════════════════════════ */
/* 触发概率：基线 5% + 幸运技能每级 +1%（满级 10%）+ 装备加成 + 裂痕回响层数 */
function rareChance(){
  const p = 0.05 + (S.skills && S.skills["幸运"] || 0) * 0.01 + gearEffects().rare + (S.echo||0)*0.01;
  return Math.min(0.25, p);
}
/* 掷一次判定；触发则结算并返回事件名 */
function tryRareEvent(questTag, questName){
  if(Math.random() >= rareChance()) return null;
  // 按权重抽取
  const total = RARE.reduce(function(a,r){ return a + r[1]; }, 0);
  let roll = Math.random() * total, picked = RARE[0];
  for(const r of RARE){ roll -= r[1]; if(roll <= 0){ picked = r; break; } }
  const [name, , type, val, desc] = picked;

  let msg = "", cls = "gold";
  if(type === "gold"){ S.money += val * 10000; msg = "+" + val + " 金币"; }
  else if(type === "silver"){ S.money += val * 100; msg = "+" + val + " 银币"; }
  else if(type === "exp"){ S.exp += val; msg = "+" + val + " 经验"; }
  else if(type === "con"){ S.con += val; msg = "+" + val + " 贡献"; }
  else if(type === "sp"){ S.explore += val; msg = "+" + val + " 探索点"; }
  else if(type === "vit"){ S.vit += val; msg = "+" + val + " 活力点"; }
  else if(type === "pay"){
    if(questName){ msg = "「" + questName + "」报酬 +50%（稍后结算时体现）"; }
    else { S.money += 5000; msg = "探索触发 → 改为获得 50 银币"; }
  }
  else if(type === "pay25"){ msg = "下一次委托报酬 +25%"; S.rareNextPay = (S.rareNextPay||0) + val; }
  else if(type === "rate"){ msg = "下一次委托成功率 +5%"; S.rareNextRate = (S.rareNextRate||0) + val; }
  else if(type === "mat3"){
    const got = {};
    for(let i=0;i<val;i++){ const m = randomMat(Math.random()<0.7?"普通":"精良"); S.mats[m]=(S.mats[m]||0)+1; got[m]=(got[m]||0)+1; }
    msg = Object.entries(got).map(function(e){return e[0]+"×"+e[1];}).join(" ");
  }
  else if(type === "gear"){
    const pool = GEAR.filter(function(g){ return g[1]==="普通"||g[1]==="精良"; });
    const g = pool[Math.floor(Math.random()*pool.length)];
    if(!S.gear.includes(g[0])) S.gear.push(g[0]);
    msg = "获得装备「" + g[0] + "」";
  }
  else if(type === "item"){
    const items = ["清醒符咒","安眠护符","活力药水","疾风符咒","时之怀表","幸运币"];
    const it = items[Math.floor(Math.random()*items.length)];
    S.items[it] = (S.items[it]||0) + 1;
    msg = "获得「" + it + "」";
  }

  addLog("✨ 稀有事件「" + name + "」→ " + msg, cls);
  if(S.daily && S.daily.events) S.daily.events.push("✨ 稀有事件：" + name + "（" + msg + "）");
  checkLevelUp();
  return {name, msg, desc};
}
function showRareEvent(ev){
  if(!ev) return;
  showAlert("<div style='text-align:center;font-size:15px;color:var(--gold);margin-bottom:8px'>✨ " + ev.name + "</div>" + ev.msg, "稀有事件");
}

const SKILLS = [
  {n:"体能", d:"精力上限 +10 / 级", tag:null},
  {n:"专注", d:"精英类委托成功率 +1% / 级", tag:"精英"},
  {n:"社交", d:"护送类委托报酬 +2% / 级", tag:"护送"},
  {n:"生存", d:"采集/狩猎类委托成功率 +1% / 级", tag:["采集","狩猎"]},
  {n:"幸运", d:"稀有事件概率 +1% / 级", tag:null}
];
const SKILL_COST = [10,20,40,70,110];        // 第 1~5 级各需贡献
function skillTotal(){ return SKILLS.reduce(function(a,s){ return a + (S.skills[s.n]||0); }, 0); }
function skillCap(){ return [0,0,5,10,15,20,25,25,25,25][guildIdx()] || 0; }   // 按公会等级开放上限（F~S 逐级 +5，W/H/P 保持满 25）
/* 技能提供的成功率加成（计专精/生存，覆盖对应标签） */
function skillRate(q){
  const tag = q[1];
  let r = 0;
  if(tag === "精英") r += (S.skills["专注"]||0) * 0.01;
  if(tag === "采集" || tag === "狩猎") r += (S.skills["生存"]||0) * 0.01;
  return r;
}
/* 技能提供的报酬加成（社交，仅护送类） */
function skillPay(q){
  return (q && q[1] === "护送") ? (S.skills["社交"]||0) * 0.02 : 0;
}
function upSkill(name){
  const idx = SKILLS.findIndex(function(s){ return s.n === name; });
  const cur = S.skills[name] || 0;
  if(cur >= 5) return showAlert("「"+name+"」已经满级了。", "技能树");
  if(skillTotal() >= skillCap()) return showAlert("技能树总级数已达当前公会等级的上限（"+skillCap()+" 级）。<br><br>提升公会等级可解锁更多级数。", "技能树");
  const cost = SKILL_COST[cur];
  if(S.con < cost) return showAlert("贡献不足（需要 "+cost+"，当前 "+S.con+"）", "技能树");
  confirmSpend("技能树", "确定花费 <b>"+cost+" 贡献</b> 将「"+name+"」升至 "+ (cur+1) +" 级吗？", function(){
  S.con -= cost;
  S.skills[name] = cur + 1;
  addLog("🌳 技能「"+name+"」升至 "+S.skills[name]+" 级（-"+cost+" 贡献）","ok");
  save(); render();
  });
}

];
function charmPay(){  return S.charm > 0 ? CHARM[S.charm-1].pay  : 0; }
function charmRate(){ return S.charm > 0 ? CHARM[S.charm-1].rate : 0; }
function charmVit(){  return S.charm > 0 ? CHARM[S.charm-1].vit  : 0; }
function charmUnlocked(i){
  const c = CHARM[i];
  if(i > 0 && S.charm < i) return false;      // 必须逐级解锁
  if(i === 4) return (S.legendDone||[]).length >= 1;   // v1.40：第 5 级条件=完成 ≥1 次传奇事件（对齐 04 设计；原 need:99 占位致永远不可解锁）
  return guildIdx() >= c.need;
}
function buyCharm(){

  save(); render();

  });
}

/* ══════════════════════════════════════════════════
   装备系统
   ══════════════════════════════════════════════════ */
function gearDef(name){
  for(const g of GEAR) if(g[0] === name) return g;
  return null;
}
/* 武器成功率加成（计入 E，受等级上限约束） */
function gearRate(){
  const n = S.equipped.weapon; if(!n) return 0;
  const g = gearDef(n); return g ? g[3] : 0;
}
/* 护甲精力上限（不受 E 限制） */
function gearEn(){
  const n = S.equipped.armor; if(!n) return 0;
  const g = gearDef(n); return g ? g[3] : 0;
}
/* 饰品报酬加成（不受 E 限制） */
function gearBonus(){
  const n = S.equipped.accessory; if(!n) return 0;
  const g = gearDef(n); return g ? g[3] : 0;
}
/* 晨间委托：可接取时间窗与 06:00–09:00 有交集即算（「全天」视为有交集，见 05_装备与制造.md） */
function isMorningQuest(q){
  const tw = q[2] || "";
  if(tw === "全天") return true;
  const m = tw.match(/(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})/);
  if(!m) return false;
  const s = (+m[1])*60 + (+m[2]), e = (+m[3])*60 + (+m[4]);
  const ms = 6*60, me = 9*60;
  return s < me && e > ms;
}
/* ── 副属性解析：把装备副属性文本转成可计算的效果对象 ── */
function gearEffects(){
  const e = {
    rate:{},        // 分类成功率加成 {"精英":0.02, "全":0.02}
    pay:{},         // 分类报酬加成
    enCut:{},       // 分类精力消耗减免
    enCutAll:0,     // 全委托精力减免
    nightCut:0,     // 熬夜惩罚减免
    exp:0,          // 委托经验加成
    con:0,          // 贡献加成
    rare:0,         // 稀有事件概率
    mat:0,          // 材料获取加成
    legend:0,       // 传奇事件成功率
    healthUp:0,     // 健康加成上限
    simCap:0,       // ★ 同时进行上限
    dailyLimit:0,   // ★ 每日接取上限
    nightmare:0,    // v1.32：噩梦难度成功率（修复死词条）
    vit:0,          // v1.41 I6：活力点获取加成（大师徽章）
    genesis:0       // v1.41 H6：创世之印「全委托成功率」豁免 E 上限（单独通道）
  };
  ["weapon","armor","accessory","charmSlot"].forEach(function(slot){
    const n = S.equipped && S.equipped[slot]; if(!n) return;
    const g = gearDef(n); if(!g) return;
    const sub = g[4]; if(!sub || sub === "—") return;
    let m;
    // 分类成功率（v1.49：键不跨词条分隔符「；」——修复组合词条"全委托精力消耗-10%；精英类成功率+3%"被整段吞键的 bug）
    const reRate = /([^；;]+?)类(?:委托)?成功率\+(\d+)%/g;
    while((m = reRate.exec(sub))) e.rate[m[1]] = (e.rate[m[1]]||0) + (+m[2])/100;
    if((m = /全委托成功率\+(\d+)%/.exec(sub))){
      if(n === "创世之印") e.genesis += (+m[1])/100;   // v1.41 H6：仅创世之印豁免 E 上限
      else e.rate["全"] = (e.rate["全"]||0) + (+m[1])/100;
    }
    // 分类报酬（v1.49：同上，键不跨「；」）
    const rePay = /([^；;]+?)类(?:委托)?报酬\+(\d+)%/g;
    while((m = rePay.exec(sub))) e.pay[m[1]] = (e.pay[m[1]]||0) + (+m[2])/100;
    // 精力消耗减免（v1.49：同上）
    const reEn = /([^；;]+?)类精力消耗-(\d+)%/g;
    while((m = reEn.exec(sub))) e.enCut[m[1]] = (e.enCut[m[1]]||0) + (+m[2])/100;
    if((m = /全委托精力消耗-(\d+)%/.exec(sub))) e.enCutAll += (+m[1])/100;
    // 熬夜惩罚减免
    if((m = /熬夜惩罚-(\d+)%/.exec(sub))) e.nightCut += (+m[1])/100;
    // 其它
    if((m = /委托经验\+(\d+)%/.exec(sub))) e.exp += (+m[1])/100;
    if((m = /公会贡献\+(\d+)%/.exec(sub))) e.con += (+m[1])/100;
    if((m = /稀有事件概率\+(\d+)%/.exec(sub))) e.rare += (+m[1])/100;
    if((m = /材料获取\+(\d+)%/.exec(sub))) e.mat += (+m[1])/100;
    if((m = /传奇事件成功率\+(\d+)%/.exec(sub))) e.legend += (+m[1])/100;
    if((m = /活力点获取\+(\d+)%/.exec(sub))) e.vit += (+m[1])/100;   // v1.41 I6：大师徽章
    if((m = /健康加成上限\+(\d+)%/.exec(sub))) e.healthUp += (+m[1])/100;
    if((m = /★同时进行上限\+(\d+)/.exec(sub))) e.simCap += +m[1];
    if((m = /★每日接取上限\+(\d+)/.exec(sub))) e.dailyLimit += +m[1];
    if((m = /晨间(?:类|时段)?委托报酬\+(\d+)%/.exec(sub))) e.pay["晨间"] = (e.pay["晨间"]||0) + (+m[1])/100;
    if((m = /噩梦难度成功率\+(\d+)%/.exec(sub))) e.nightmare += (+m[1])/100;   // v1.32
  });
  return e;
}
/* 取某标签的成功率加成（分类 + 全委托） */
function gearRateFor(tag){
  const e = gearEffects();
  return (e.rate[tag]||0) + (e.rate["全"]||0);
}

/* ── 打造规则 ──
   主材料：图纸指定，数量按品级 + 部位（普通 2 / 精良 3 / 稀有 4 / 史诗 5 / 传说 6，饰品 −1）
   副材料：与主材料同系品类（见 SUB_CATS）中「同品阶或低一阶」的材料，数量按品级（2 / 3 / 4 / 6 / 8，护甲 +1）
   加工费：按品质 */
const QUALITY_ORDER = ["普通","精良","稀有","史诗","传说"];
/* v1.54：列表排序统一为「高品阶 → 低品阶，从上到下」（背包 / 图鉴 / 商店 / 委托掉落一致） */
function byQualityDesc(aQ, bQ){ return QUALITY_ORDER.indexOf(bQ) - QUALITY_ORDER.indexOf(aQ); }
/* 规则道具无品阶——按价值从高到低固定展示顺序（未知道具排最后） */
const ITEM_ORDER = ["安眠护符","清醒符咒","活力药水","疾风符咒","命运骰子","时之怀表","幸运币","神秘地图","专注药剂","圣水","旅行干粮","安魂熏香","解毒剂","水息药剂","谈判卷轴"];
function byItemOrder(a, b){
  const ia = ITEM_ORDER.indexOf(a), ib = ITEM_ORDER.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
}
const MORDER = ["木材","石材","矿石","宝石","草药","食材","织物","兽材","特殊"];   // v1.38g：材料品类顺序（图鉴 / 背包共用）
/* v1.48：材料多品类定位——M 表第 4 位为附加品类数组（主品类仍在 [0]）；用于筛选 / 副材匹配 / 展示 */
function matCats(k){ const m = M[k]; if(!m) return []; return m[3] ? [m[0]].concat(m[3]) : [m[0]]; }
function matHasCat(k, c){ return matCats(k).indexOf(c) >= 0; }
const DIFF_ORDER = ["简单","普通","困难","噩梦"];   // v1.38h：委托难度顺序（图鉴排序）
const DIFF_COLOR = {简单:"var(--green)", 普通:"var(--dim2)", 困难:"var(--orange)", 噩梦:"var(--red)"};   // v1.38h：难度文字标识配色
/* v1.38h：料理品级 = 配方材料中的最高品阶；v1.50：以主材（main）为准 */
function cookTier(r){
  let t = "普通";
  Object.keys(r.main||{}).forEach(function(k){
    const q = M[k] ? M[k][1] : "普通";
    if(QUALITY_ORDER.indexOf(q) > QUALITY_ORDER.indexOf(t)) t = q;
  });

}

/* ── v1.38c：副材料品类联动 —— 由主材料品类推导允许的副材料品类（食材不可作打造材料）── */
const SUB_CATS = {
  "木材": ["木材","兽材","织物"],   // 弓弩杖：兽筋弓弦、皮绳缠柄
  "兽材": ["兽材","织物","木材"],   // 皮革甲：布衬缝线、木扣
  "矿石": ["矿石","木材","兽材"],   // 剑斧铠：木柄、皮缠
  "石材": ["石材","矿石","木材"],   // 石锤：金属箍、木柄
  "宝石": ["宝石","矿石"],          // 饰品：宝石与金属底托
  "织物": ["织物","兽材"],          // 布甲法袍：皮革束带
  "草药": ["草药","织物","木材"],   // 植物系：藤蔓、丝带、木芯
  "特殊": ["特殊","宝石","矿石"]    // 龙鳞魔晶：秘银、魔晶镶嵌
};
const _SUB_CATS_DEFAULT = ["木材","石材","矿石","宝石","草药","织物","兽材","特殊"];
function subCatsFor(mainMat){
  const out = [];                       // v1.48c：多品类主材——副材品类系取并集（与服务端 sub_cats_for 对齐）
  matCats(mainMat).forEach(function(c){ (SUB_CATS[c] || _SUB_CATS_DEFAULT).forEach(function(x){ if(out.indexOf(x) < 0) out.push(x); }); });
  return out.length ? out : _SUB_CATS_DEFAULT;
}
function subTiers(quality){
  const i = QUALITY_ORDER.indexOf(quality);
  return [QUALITY_ORDER[i], QUALITY_ORDER[i-1]].filter(Boolean);   // 同阶 + 低一阶
}
function craftCost(quality){
  return {"普通":0.5,"精良":3,"稀有":15,"史诗":60,"传说":300}[quality] || 0;
}
/* 自动挑选副材料（v1.38c：品阶 × 品类双约束；优先消耗低品阶、低价材料） */
function pickSubMats(quality, mainMat, need){
  const tiers = subTiers(quality);
  const cats = subCatsFor(mainMat);
  const pool = Object.keys(S.mats).filter(function(k){
    const _mc = matCats(k);   // v1.48：多品类——副材料任一品类命中即可入选
    return _mc.some(function(c){ return cats.indexOf(c) >= 0; }) && tiers.indexOf(M[k][1]) >= 0 && k !== mainMat && (S.mats[k]||0) > 0;
  });
  // 低品阶优先；同品阶低价优先
  pool.sort(function(a,b){
    const d = tiers.indexOf(M[b][1]) - tiers.indexOf(M[a][1]);
    return d !== 0 ? d : (M[a][2] - M[b][2]);
  });
  const picked = {};
  let left = need;
  for(const k of pool){
    if(left <= 0) break;
    const take = Math.min(S.mats[k], left);
    picked[k] = take; left -= take;
  }
  return left > 0 ? null : picked;      // null = 副材料不够
}

  "黑檀木":"乌沉似墨，沉重得与体积不相称。打磨后泛着幽暗的光，触手生凉，被视作高贵与沉稳的象征。",
  "铁木":"木质坚硬逾铁，普通斧凿只留下一道白痕。传闻古老树精的战棍，皆以铁木削成。",
  "凤凰木":"温热的木材，细看有暗红纹路如余烬闪烁。相传它由凤凰栖过的枝干长成，从不朽坏。",
  "世界树枝条":"一段泛着微光的枝桠，断口处缓缓流淌着青翠的光点。握住它时，仿佛听见森林在低声吟唱。",
  /* ── 石材 ── */
  "青石":"随处可见的灰青色石头，敲之声音清脆。扎实可靠——匠人们的第一块磨刀石，多半就是它。",
  "花岗岩":"布满细密斑点的坚硬岩石，风吹雨打百年不改其形。城堡的地基与巨锤的配重都靠它。",
  "大理石":"纹理如流云般的洁白石材，光可鉴人。贵族以铺设它的厅堂炫耀财富，法师则看中它稳定魔力的一面。",
  "黑曜石":"火山之泪——玻璃般漆黑光滑的岩石，断口边缘比刀子更利。暗处望去，像一只沉默的眼睛。",
  "符文岩":"石面上天然生着古老的符号，无人能够解读。把耳朵贴上时，隐约有极低沉的颤动声。",
  "星陨岩":"从天穹坠落的岩石，表面残留着烧灼的轨迹与星尘。靠近它，呼吸会不自觉地放轻。",
  /* ── 矿石 ── */
  "铜矿石":"铜绿的斑纹像锈蚀的鳞片，敲开则露出温润的红黄断面。新手铁匠握起手锤前的第一课。",
  "铅矿石":"沉甸甸的灰黑矿石，触手冰凉。据说能挡开某些占卜的目光——探险者喜欢把它缝进行李袋里。",
  "铁矿石":"敲开赭红色的岩壳，断面藏着细碎的银灰金星。锻造王国的骨架，皆由它撑起。",
  "秘银矿":"泛着淡银蓝辉光的稀有矿石，轻得不像金属。矮人锻炉里的奢侈品，精灵弓匠的心头好。",
  "白银矿":"色泽如月光的软金属矿石。吟游诗人说，银对邪恶之物天生敏感——银刃的影子照进暗处，黑暗会自己退开。",
  "提神石":"温热的浅色石头，握久了掌心会泛起微微的刺麻感。旅人把它揣在怀里，用来驱散长途跋涉的困倦。",
  "净化石":"乳白色的矿石，浸入水中能让浊水澄清。神庙圣水池的池底，铺的便是这种石头。",
  "星尘":"收集自流星轨迹的银色微粒，静置时会缓缓沉降。洒在暗处，像一小片被囚禁的夜空。",
  "黑铁矿":"比普通铁矿更沉更暗，断口泛着暗红的晶光。老矿工说，它的矿脉深处总盘旋着说不清的热气。",
  "陨铁":"钢铁般冷硬的陨石碎块，纹路如凝固的波浪。它在锻炉中格外倔强，但成器之后，永不生锈。",
  "秘银合金":"秘银与精钢的完美融合，泛着淡淡的银蓝色。锻造大师一生能碰上的好料，也就那么几块。",
  "星核":"一颗拳头大的金属核心，触感介于冰与火之间。据说它曾是一颗流星的灵魂，内里永远有星光在旋舞。",
  /* ── 宝石 ── */
  "石英":"通体透明的水晶，对着光看能分出虹彩。平民女巫的第一颗占卜石，也是孩子兜里的第一枚宝贝。",
  "紫水晶":"透着葡萄酒般深邃紫色的晶体，月下会泛出柔光。人们相信它能镇住混乱的思绪。",
  "黄玉":"蜜色的澄澈宝石，日光下会亮起一小片暖黄的星芒。商队首领爱把它镶在契约印章上。",
  "星辉石":"内里仿佛悬浮着无数针尖大小光点的宝石，转动手腕时光点缓缓流动——像握住一小片星空。",
  "血玛瑙":"深红如凝固之血的宝石，纹路在光下像血管般蔓延。古老的战士把它的碎片嵌在剑柄里，以求庇护。",
  "虚空结晶":"一枚黑得看不见底的晶体，光线落在表面就像被吞掉。注视它太久，会听到若有若无的低语。",
  "月长石":"月光似的乳蓝宝石，随角度变化流转着幽光。精灵族视之为月光女神的眼泪。",
  "巨龙竖瞳":"传说中的龙之眼核，金赤双色在玛瑙般的表面旋绕，像一只永不闭上的竖瞳正望着你。",
  "龙瞳结晶":"巨龙濒死时，最后一道目光凝在瞳孔里，经年累月的魔力把它烧成了晶。对着光看，晶心深处仍有一线竖直的金红，像是还在望着什么。",
  "世界树心":"世界树最古老的年轮里析出的宝石，青金色的光芒如万叶摇曳。捧它入怀，会感到安稳与疲倦同时涌上来。",
  /* ── 草药 ── */
  "止血草":"长着锯齿叶片的常见草药，嚼碎敷在伤口上，血很快便止住。炊事班与冒险者背包的常备品。",
  "薄荷叶":"清凉的草本叶片，揉碎后气味直冲鼻腔。旅途困顿、头脑昏沉时，含一片下去便精神一振。",
  "晨露花":"花瓣上永远凝着一层露水似的透明花。清晨采摘的药效最好——药农说，它认得太阳的时辰。",
  "金盏花":"金色花瓣舒展得像一枚小太阳。据说熬汤时放上两瓣，喝下去的人一整天都心情明朗。",
  "紫藤花":"垂落成串的淡紫花穗，香气温柔绵长。药铺主人常把它晾在檐下，整条街都能闻到甜香。",
  "月光草":"只肯在月下舒展的银叶小草，叶脉里流动着淡银的光。采药人需趁月圆之夜，轻手轻脚地接近。",
  "龙息草":"无风也会轻轻摇曳的赤色草药，据传根系曾饮过巨龙的吐息。凑近时能感到一丝异样的热意。",
  "暗影草":"生在常年不见光的深渊裂谷里，叶片黑得发亮。采摘时务必要用布裹手——它自己会朝阴影里缩。",
  "凤凰草":"叶缘泛着金红微光的奇异草药，入药之前需要三分敬意。灰烬中重生的传说，让它在药圃里也带着三分神圣。",
  "星辉花":"花瓣会在黑暗中自行亮起的花，把夜色分成朵朵微光。传说它盛放之夜，整片山谷如坠星河。",
  "世界树汁液":"从世界树伤口缓缓滴落的神木之泪，碧金交融，沿着瓶壁缓缓游动。传说饮下它的人，会在梦中对上那双古老的眼睛。",
  /* ── 食材 ── */
  "蘑菇":"肥厚多汁的伞菌，是窑火与汤锅最古老的朋友。清汤与炖品里，总能找到它。",
  "河鱼":"河湾里银光一闪的小鱼，肉质清甜。烤得恰到好处时，是旅人一天辛苦过后的安慰奖。",
  "蜂蜜":"野蜂采集山花酿成的金色蜜汁，黏稠透亮。甜味里藏着整片花田，也是酒馆公认的硬通货。",
  "泉水":"从山岩裂隙里滤出的清泉，凉得恰到好处。猎人们称之为「山神的恩惠」。",
  "兽肉":"后腿肉紧实，油脂分布均匀。无论炙烤还是风干，都是补充体力的实在选择。",
  "浆果":"酸甜多汁的野浆果，摘一颗放进嘴里，唇齿留香。据说，是孩子们最爱的奖赏。",
  "南瓜":"沉甸甸的橙皮圆瓜，切开后带着清甜的草木气。炖成浓汤，是秋日里最朴实的幸福。",
  "香草":"叶片细长、香气含蓄的调味草。好厨师说，一道菜的灵魂往往藏在这些小小的叶片里。",
  "雪盐":"高山盐湖里结晶出的粗盐，颗粒晶莹。传说产地在雪线之上，只有最肯吃苦的商队才去采。",
  "山珍":"山民口中「山神的礼物」——菌菇、嫩笋与珍蔬的统称。一个「山」字打底，鲜味压得住一桌菜。",
  "蜂王浆":"蜂王专属的乳白浆液，滋味醇厚微酸。蜂蜜中的黄金，据说能撑起蜜群一整个冬天的精气。",
  "龙涎果":"果皮泛着琥珀光纹的稀有果实，切开时飘出的香气带着一丝龙焰的暖意。宴席上的压轴珍馐。",
  "星尘蜜":"传说中蜂群追逐流星酿出的蜜，内里浮着细密的银色光点。一勺入喉，仿佛有星光顺着喉咙一路滑下去。",
  /* ── 织物 ── */
  "粗麻布":"粗糙结实的黄褐色麻布，扎手但耐用。农人与学徒的第一件行装，都从它开始。",
  "棉线":"柔软洁白的线团，绕在手指上暖融融的。补衣服、缝皮囊——猎人篝火边的日常工具。",
  "风蚕丝":"风蚕吐出的银白丝线，轻得能被气流托起来。织成的衣裳据说冬暖夏凉，走路时会轻轻发响。",
  "天鹅绒":"触感如踩在春草上的深色绒布，光泽随光角变化。贵族客厅里的常客，也是好裁缝的骄傲。",
  "月影纱":"泛着淡淡月白的轻纱，对着光看几乎半透明。礼服的最外层覆上一层，衣影便如月光浮动。",
  "蛛丝":"巨型洞穴蛛织出的坚韧丝线，比同等粗细的钢丝更结实。极难采集——采集者往往要向蛛网「借」一小段。",
  "星辉绸":"织进了星辉石粉末的缎绸，光下会泛起细密的星光。婚礼与加冕礼上最受追捧的料子。",
  "世界树皮":"从世界树外层剥落的韧皮纤维，泛着青金光泽，浸水不腐。传说用它裹住伤口，伤口会自己想起痊愈的样子。内层剥下的青纹树膜被药师奉为圣物——文火煎汁入药，据说能吊住濒死之人的一口气。",
  "云纹锦":"纹样如流云舒卷的神锦，越看越像云在缓慢飘动。匠人们说，织出它的那天，织机上空曾真的聚起一朵云。",
  /* ── 兽材 ── */
  "山鸡羽":"色彩斑斓的长尾羽，阳光下变换着金属般的色泽。可插在帽檐上装饰，也可用作初级箭羽。",
  "野兔皮":"柔软蓬松的灰褐色毛皮，抚之如暖云。冬夜里裹住脚踝，寒意便退避三舍。",
  "鹿皮":"韧性极佳，鞣制后柔软得像一块布。老猎人说，好鹿皮摸起来有森林早晨的温度。",
  "野猪獠牙":"泛黄的弯獠牙，尖端仍带着磨利的光泽，根部刻着野猪常年啃树留下的糙纹。",
  "鹿骨":"结实匀称的鹿骨，敲之清脆。可做柄材、可入汤锅——猎户家里最物尽其用的东西。",
  "枭羽":"夜枭的翼羽，边缘柔软如绒，飞行时悄无声息。据说用它做箭羽，箭也会带走夜的沉默。",
  "狼牙":"成年大狼的獠牙，弧度优美，刃口天然锋利。部落猎手把它串成项链，作为勇气与野性的见证。",
  "蛇怪之眼":"从蛇怪眼眶中取下的浑黄眼球，泡在药液里仍会缓慢转动。据说它生前的视线，能穿透迷雾。",
  "狮鹫羽":"金棕交错的巨型羽毛，硬如箭翎，风过时发出鹰啸般的轻响。只有最高傲的箭匠才配使用。",
  "巨人骨":"沉得惊人的一段巨骨，表面刻着岁月风化出的纹路。传说远古巨人的力量，还沉睡在骨孔深处。",
  "龙鳞":"这块巨大的龙鳞反射着光，边缘的棘刺锋利而坚固，敲上去有金石之声——顶好的防具材料，也是顶好的奖赏。",
  "龙骨":"一段黝黑沉重、内部中空的龙之骨节。把它凑近耳边，据说能听见悠远的龙吟自岁月深处传来。",
  "龙牙":"比手臂还长的獠牙，表面覆着釉质般的幽光。传说它被拔出时，周围十里的火把都黯淡了一瞬。",
  /* ── v1.42 龙种材料 ── */
  "大块龙肉":"从火龙身上割下的厚实肉块，油脂里都带着火气。传说吃一口，连梦里都在喷火。",
  "剧毒龙牙":"绿龙的毒牙，毒液沿着牙槽往下渗成一线青烟。沾上它，连岩石都会烂出洞来。",
  "绿龙胆囊":"绿龙囤积毒液的地方，鼓胀得一触即破。沼泽猎人见了都绕道走。",
  "金龙鳞":"从金龙身上脱落的鳞片，铸着细密的金纹。收集者说，一片就够换一间铺子。",
  "魔力结晶":"在白龙的魔法吐息中凝结的符文颗粒，握在手里嗡嗡作响。学者们愿为一颗倾家荡产。",
  "雷霆龙牙":"从蓝龙颌上取下的牙齿，齿缝里仍跳着细小的电弧。握它太紧，会被「咬」一口。",
  "暗影龙鳞":"黑龙的鳞片，黑得能吸住光。放在灯下看久了，会觉得它也在看你。",
  "龙炎结晶":"火龙胸腔里凝出的一枚赤色晶体，内里的火苗千年不熄。铁匠说，把它丢进炉里，整座山都会听见炉火的欢呼。",
  /* ── v1.42 九头蛇材料 ── */
  "九头蛇心脏":"九个头颅共享的一颗心脏，离体后仍在缓慢搏动。据说它的节拍里，藏着九条命的重量。",
  "剧毒蛇齿":"九头蛇换下的旧齿，毒腺的余毒百年不散。工匠用它淬火，猎人用它做箭。",
  "九头蛇胆囊":"九头蛇化毒的所在，胆壁泛着幽绿的光。药师说，是毒，也是解药。",
  "九头蛇鳞片":"从九头蛇身上剥下的青灰色硬鳞，比想象中轻得多。鳞缘残留的毒液会让皮革匠戴上两层手套。",
  "再生蛇髓":"九头蛇颈部断口渗出的银白色髓液，离体后仍微微搏动。传闻喝下去的人，伤口愈合快得像被时间追赶。",
  /* ── v1.45 恶魔 / 魔鬼 / 中立种族 ── */
  "恶魔之角":"从恶魔颅侧折下的扭曲弯角，断口还在渗着黑雾。铁匠说，这东西打出的刃，夜里会自己发烫。",
  "混沌碎片":"深渊恶魔消散的地方凝出的棱晶，折射出的光没有规律。看久了，会觉得它在笑。",
  "硫磺结晶":"地狱边境开采出的黄色晶簇，凑近能闻到燃烧的誓约味。牧师说，点着它念祷词，效果翻倍。",
  "魔鬼徽记":"刻着魔鬼真名的黄铜符牌。持有它，就等于持有一份还没签字的契约——放进口袋前，请三思。",
  "灵魂币":"地狱的通货：一枚硬币，一次灵魂的交换。铸面上的脸会随着持有者而变化。别在灯下细看它。",
  "仙灵之尘":"妖精振翅时洒落的微光粉末，落在伤口上甜甜的。老猎人把它撒在箭上——猎物会一路好梦。",
  "幽魂灯":"亡灵谷里飘荡的冷焰提灯。灯芯是什么，没人细问——只要它还能照路，亡魂就还算安分。",
  "魔狼鬃毛":"泛着暗紫色光泽的粗硬鬃毛，触感却柔韧蓬松。月圆之夜，毛尖上会沁出冷冷的微光。",
  "圣兽之蜕":"传说圣兽更迭形貌时留下的旧蜕，轻若无物，却刀割不破。触到它的人说，有一种被注视的温柔。",
  "龙心":"传说中巨龙的心脏残片，至今仍温热而缓慢地搏动着。靠近时，血液似乎也会跟着沉重地打拍子。",
  "龙角":"巨龙额顶的苍黑弯角，纹路如螺纹盘旋，末端收成一点寒芒。王国将它镶在王座旁，象征那曾经真实存在过的苍穹之怒。",
  /* ── v1.58 六域遗珍 ── */
  "冥河灯油":"渡魂人从长明灯里分出的灯油，幽蓝而黏稠，倾出一线便自己往灯芯上爬。据说它烧的不是火，是还没走完的路。",

  "幽魂灯杖":"幽魂灯悬在杖头，前路越暗它越亮。总能在最不起眼的角落，照出点意外收获。",

  "符文岩巨锤":"符文岩凿成的重锤，抡起来山风作响。护送队的口号：砸得动山，才护得住人。",

  "世界树长弓":"世界树枝条弯成的长弓，弓弦震颤时像树叶在低声唱歌。林木间的事，它都懂。",
  /* ── 成就饰品 ── */

  "百炼徽记":"一百次委托磨出的铁色徽章，边角圆润发亮。它见证的每一单，都是实实在在的汗水。",
  "龙血指环":"一滴龙血封在铁环里，久戴指尖发烫。面对精英委托，它让血液里的勇气更早地沸腾。",
  "深渊之瞳":"深渊领主的残眼嵌成的黑戒，凝视它时，深处有微光一颗颗亮起。奇遇与稀有的概率，仿佛变高了一点。",
  "创世之印":"创世碎片凝成的印戒，正面刻着初生的星辰图。戴上它，仿佛万事万物都愿意向你倾斜一点。",
  /* v1.41 I6：大师层专属 */

  "百战护符":"三百场委托打磨出的护符，纹路里全是故事。它不张扬，只是让好运来得比别处勤快一点。",

  "狮鹫羽弓":"以狮鹫翎羽为饰的长弓，箭去如隼。射落的猎物，连材料都格外齐整。",

  "世界树心护符":"青金色的树心悬在胸前，像把一整片叶影贴身收着。佩戴它的人，休憩总比别人更沉、更深。",

   副材料：普通 2 / 精良 3 / 稀有 4 / 史诗 6 / 传说 8（护甲厚重 +1） */
function subMatCount(quality, slot){
  const base = {"普通":2, "精良":3, "稀有":4, "史诗":6, "传说":8}[quality] || 3;
  return base + (slot === "护甲" ? 1 : 0);
}
function craft(name){
  const g = gearDef(name); if(!g) return;
  if(g[5] === "—") return showAlert("「"+name+"」不能打造，只能通过成就或事件获得。", "打造");
  if(!S.blueprints[name]) return showAlert("没有「"+name+"图纸」。<br><br>到公会「图纸商店」购买图纸后才能打造。", "打造");

  const mm = craftMainMat(name);
  const cost = craftCost(g[1]) * 10000;
  const subCnt = subMatCount(g[1], g[2]);
  if((S.mats[mm.mat]||0) < mm.cnt)
    return showAlert("主材料不足。<br><br>需要「"+mm.mat+" ×"+mm.cnt+"」，当前 "+(S.mats[mm.mat]||0)+"。", "打造");
  const subs = pickSubMats(g[1], mm.mat, subCnt);
  if(!subs)
    return showAlert("副材料不足。<br><br>需要 "+subCatsFor(mm.mat).join("/")+" 类「"+subTiers(g[1]).join(" 或 ")+"」品阶的材料 ×"+subCnt+"（主材料不计入）。", "打造");
  if(S.money < cost) return showAlert("加工费不足。<br><br>需要 "+fmtMoneyFull(cost)+"。", "打造");

  confirmSpend("打造装备", "确定打造「"+name+"」吗？将消耗：<b>"+mm.mat+"×"+mm.cnt+"</b>　"+Object.keys(subs).map(function(k){return k+"×"+subs[k];}).join(" ")+"　加工费 <b>"+fmtMoneyFull(cost)+"</b>", function(){
  // 扣除
  S.mats[mm.mat] -= mm.cnt; if(S.mats[mm.mat] <= 0) delete S.mats[mm.mat];
  const used = [];
  for(const k in subs){ S.mats[k] -= subs[k]; used.push(k+"×"+subs[k]); if(S.mats[k] <= 0) delete S.mats[k]; }
  S.money -= cost;
  if(!S.gear.includes(name)) S.gear.push(name);
  if(!S.forged) S.forged = [];                       // v1.35：图鉴·打造记录
  if(S.forged.indexOf(name) < 0) S.forged.push(name);
  addLog("🔨 打造「"+name+"」→ "+mm.mat+"×"+mm.cnt+" + "+used.join(" ")+"（-"+fmtMoney(cost)+"）","gold");
  save(); render();
  showAlert("打造成功：「"+name+"」<br><br>消耗："+mm.mat+"×"+mm.cnt+"　"+used.join(" ")+"<br>加工费："+fmtMoney(cost)+"<br><br>已放入冒险背包。", "打造");
  });
}

/* ══════════════════════════════════════════════════
   自由探索
   ══════════════════════════════════════════════════ */
function inRegionTime(t){
  const now = new Date();
  const cur = now.getHours()*60 + now.getMinutes();
  const [a,b] = t.split("-");
  const ah = +a.split(":")[0]*60 + +a.split(":")[1];
  const bh = +b.split(":")[0]*60 + +b.split(":")[1];
  return cur >= ah && cur <= bh;
}
function prevHealthScore(){
  return S.history.length ? (S.history[S.history.length-1].score || 0) : 0;
}
/* v1.38l：昨日评分 → 今日委托成功率加成（successRate / rateBreakdown 与首页展示共用，含健康加成上限修正）
   v1.40：安眠室/称号改为「加法百分点」——原乘法 ×(1+5%+5%) 满配仅多 +2pp，长期健康目标无感 */
function healthRateBonus(){
  const H = prevHealthScore();
  const roomBonus = heatBonus();                            // 安眠室：每 7 天累计 +1pp，上限 +5pp
  const titleBonus = titleActive("安眠守护者") ? 0.02 : 0;   // 当月称号「安眠守护者」：+2pp
  return H * 0.002 * (1 + gearEffects().healthUp) + roomBonus + titleBonus;
}
/* v1.60：自由探索解锁条件 = Lv2 + 累计完成 12 次 Lv2 委托（按委托名统计，旧档可追溯） */
function lv2DoneCount(){ return (C["Lv2"] || []).reduce(function(a,q){ return a + ((S.doneQuests && S.doneQuests[q[0]]) || 0); }, 0); }
const EXPLORE_LV2_NEED = 12;
function doExplore(i){
  const r = REGIONS[i];
  if(S.lvIdx < 1) return showAlert("自由探索需要达到 Lv2 后解锁。", "探索");
  if(lv2DoneCount() < EXPLORE_LV2_NEED) return showAlert("自由探索需要完成 "+EXPLORE_LV2_NEED+" 次 Lv2 委托后解锁（当前 "+lv2DoneCount()+"/"+EXPLORE_LV2_NEED+"）。", "探索");
  if(S.exploreActive) return showAlert("已经有一次探索正在进行中。<br><br>等待它完成，或中途返回（不会有任何收获）。", "探索");
  const _gate = regionGate(r);   // v1.41 I1/I2：委托解锁 / 公会等级 / 等级门槛
  if(_gate) return showAlert("「" + r.n + "」尚未开放。<br><br>" + _gate + "。", "探索");
  if(prevHealthScore() < 60) return showAlert("前一日健康评分低于 60，今天不能探索。<br><br>先把作息调整好。", "探索");
  if(S.exploreUsed >= 2) return showAlert("今天已经探索 2 次了，明天再来。", "探索");
  if(S.explore < r.c) return showAlert("探索点不足。<br><br>「"+r.n+"」需要 " + r.c + " 点，当前只有 " + S.explore + " 点。", "探索");
  if(!inRegionTime(r.t)) return showAlert("「"+r.n+"」不在开放时间内。<br><br>开放时间：" + r.t, "探索");

  // 出发：占探索点与次数，进入现实时间探索（2~12 小时，到点后结算）
  S.explore -= r.c;
  S.exploreUsed++;
  S.exploreActive = {idx:i, n:r.n, c:r.c, h:r.h, startTs:Date.now(), finishTs:Date.now() + r.h*3600000};
  addLog("🧭 开始探索「"+r.n+"」（-"+r.c+"点，需 "+r.h+" 小时）","");
  save(); render();
  showAlert("🧭 出发！<br><br>你进入了「"+r.n+"」——这次探索大约需要 <b>"+r.h+" 小时</b>。<br><br>探索结束后结算掉落；<b>中途返回将没有任何收获</b>。", "自由探索");
}
/* 中途返回：放弃探索，不获得任何材料掉落（探索点与次数不退还） */
function exploreReturn(){
  const ea = S.exploreActive;
  if(!ea) return;
  showConfirm("确定中途返回吗？<br><br>放弃「"+ea.n+"」的探索——<b>不会获得任何材料掉落</b>（探索点与次数也不退还）。", function(){
    S.exploreActive = null;
    addLog("🚶 放弃了「"+ea.n+"」的探索——没有任何收获","");
    save(); render();
  }, "中途返回");
}
/* v1.38p2：探索区域详情弹窗（点击区域查看开放信息与掉落物） */
function showRegionDetail(i){
  const r = REGIONS[i];
  const timeOk = inRegionTime(r.t);
  const _gate = regionGate(r);   // v1.41 I1/I2
  const ptsOk = S.explore >= r.c;
  const usedOk = S.exploreUsed < 2;
  const ph = prevHealthScore();
  const can = !S.exploreActive && S.lvIdx >= 1 && ptsOk && usedOk && timeOk && !_gate && ph >= 60;
  const reason = S.exploreActive ? "已有探索进行中" : S.lvIdx < 1 ? "达到 Lv2 后解锁" :
                 ph < 60 ? "前一日健康评分低于 60" : !usedOk ? "今日探索次数已用完" :
                 !ptsOk ? "探索点不足（需要 " + r.c + " 点）" : _gate ? _gate :
                 !timeOk ? "当前不在开放时间（" + r.t + "）" : "";
  const mats = [], items = [];
  (r.d || []).forEach(function(p){
    const nn = p[0];
    if(!nn) return;                               // 「空手」项不展示
    if(ITEM_DESC[nn] !== undefined) items.push(nn);
    else if(nn === "旧宝箱") items.push(nn);      // 特殊掉落：可能开出材料 / 铜币
    else if(M[nn]) mats.push(nn);
  });
  mats.sort(function(a,b){ return byQualityDesc(M[a][1], M[b][1]); });   // v1.54：高品阶→低品阶
  // v1.41：未见过的掉落完全隐藏（原 v1.38s「？？？」占位取消）；获得过一次后永久正常展示
  const _seenM = {}; (S.seenMats || []).forEach(function(k){ _seenM[k] = 1; });
  const _seenI = {}; (S.seenItems || []).forEach(function(k){ _seenI[k] = 1; });
  function _known(nn, isMat){
    return isMat ? (_seenM[nn] || (S.mats[nn] || 0) > 0)
                 : (_seenI[nn] || (S.items[nn] || 0) > 0);
  }
  const _matsK = mats.filter(function(nn){ return _known(nn, true); });
  const _itemsK = items.filter(function(nn){ return _known(nn, false); });
  let body = `<div class="li"><span>开放时间</span><b>${r.t}</b></div>
    <div class="li"><span>探索点</span><b>${r.c} 点</b></div>
    <div class="li"><span>耗时</span><b>${r.h} 小时（现实时间，到点自动结算）</b></div>
    ${r.lv ? `<div class="li"><span>等级要求</span><b>Lv${r.lv} 开放</b></div>` : ""}
    <div class="li"><span>今日次数</span><b>${S.exploreUsed} / 2 次</b></div>`;
  body += `<div class="muted" style="margin-top:10px;font-size:12px">可获得材料：</div>`;
  body += _matsK.length
    ? `<div style="line-height:2.1;margin-top:2px">` + _matsK.map(function(nn){ return `<span class="tier t-${M[nn][1]}">${nn} · ${M[nn][1]}</span>`; }).join(" ") + `</div>`
    : `<div class="muted" style="font-size:12px">—</div>`;
  if(_itemsK.length){
    body += `<div class="muted" style="margin-top:8px;font-size:12px">可能发现：</div>
      <div style="line-height:2.1;margin-top:2px">` + _itemsK.map(function(nn){ return `<span class="tier" style="background:#243044;color:#8fd8ff">${nn}</span>`; }).join(" ") + `</div>`;
  }
  body += `<div style="margin-top:12px;font-size:12px;color:${can ? "var(--green)" : "var(--orange)"}">${can ? "✅ 当前可以前往探索" : "⚠️ 暂不可前往：" + reason}</div>`;
  dlg("🧭 " + r.n, body, [{text:"关闭", fn:null}]);
}
/* 探索完成判定：到点后结算掉落与事件（幂等，可重复调用） */
function exploreFinishCheck(){
  const ea = S.exploreActive;
  if(!ea || Date.now() < ea.finishTs) return;
  S.exploreActive = null;
  monthEventAdd("explore");   // v1.41 I3：月度世界事件·探索进度
  const r = REGIONS[ea.idx];

  // 掉落：每个掉落物独立判定（单次探索可同时获得多个；「空手」项不参与判定）
  const gains = [];
  for(const pair of r.d){
    const name = pair[0];
    if(!name) continue;                          // 「空手」项不参与独立判定
    if(Math.random() * 100 >= pair[1]) continue; // 该项未命中
    if(name === "旧宝箱"){
      if(!S.seenItems) S.seenItems = [];
      if(S.seenItems.indexOf("旧宝箱") < 0) S.seenItems.push("旧宝箱");   // v1.38s：探索详情保密·开出过即展示
      const sub = Math.random();
      if(sub < 0.4){ const c = 20 + Math.floor(Math.random()*31); S.money += c; gains.push("铜币 " + c); }
      else if(sub < 0.7){ const m = randomMat("普通"); S.mats[m]=(S.mats[m]||0)+3; gains.push("旧宝箱开出 " + m + " ×3"); }
      else if(sub < 0.9){ const m = randomMat("精良"); S.mats[m]=(S.mats[m]||0)+2; gains.push("旧宝箱开出 " + m + " ×2"); }
      else {   // 10%：随机普通~精良装备 ×1（从尚未拥有的中抽取——背包与穿戴中均未拥有；全拥有则空箱）
        const _eqd = [S.equipped.weapon, S.equipped.armor, S.equipped.accessory, S.equipped.charmSlot];
        const _gp = GEAR.filter(function(g){ return (g[1] === "普通" || g[1] === "精良") && S.gear.indexOf(g[0]) < 0 && _eqd.indexOf(g[0]) < 0; });
        if(_gp.length){
          const _g = _gp[Math.floor(Math.random()*_gp.length)];
          S.gear.push(_g[0]);
          gains.push("旧宝箱开出 装备「" + _g[0] + "」");
        } else { gains.push("旧宝箱（空的）"); }
      }
    } else if(ITEM_DESC[name] !== undefined){   // 按道具清单判断（修复首次获得时误进材料分支）
      S.items[name] = (S.items[name]||0) + 1;
      gains.push("规则道具「" + name + "」×1");
    } else {
      const n = 1 + Math.floor(Math.random()*3);
      S.mats[name] = (S.mats[name]||0) + n;
      gains.push(name + " ×" + n);
    }
  }

  let msg, cls = "";
  if(!gains.length){
    msg = "空手而归……什么都没找到。";
  } else {
    msg = "获得：" + gains.join("、");
    if(gains.join("").indexOf("规则道具") >= 0) cls = "gold";
  }
  addLog("🧭 探索「"+r.n+"」完成 → " + msg, cls);
  save(); render();
  const evName = pickExploreEvent(r);          // 探索事件判定（与掉落并行，点「确定」后弹出）
  dlg("探索归来 · " + r.n, '<div class="dlg-msg">'+msg+'</div>', [
    {text:"确定", cls:"pri", fn: evName ? function(){ runExploreEvent(evName, r); } : null}
  ]);
}
function randomMat(tier){
  const pool = Object.keys(M).filter(k => M[k][1] === tier);
  return pool[Math.floor(Math.random()*pool.length)] || "止血草";
}

/* ══════════════════════════════════════════════════

const EXPLORE_EVENT_CHANCE = 0.20;
const REGION_EVENTS = {
  "晨光森林":"迷路商人", "午间溪谷":"隐藏泉眼", "黄昏山丘":"受伤小狼",
  "星夜洞窟":"古代石碑", "腐化森林":"净化成功", "虚空裂痕":"裂痕回响"
};
/* 区域事件是否仍可触发（一次性事件完成后不再出现） */
function exploreEventAvailable(name){
  if(name === "受伤小狼") return !S.wolfDone && !S.pendingPet && S.pets.indexOf("小狼") < 0;
  if(name === "古代石碑") return !S.blueprints["安神吊坠"];
  if(name === "裂痕回响") return (S.echo||0) < 3;
  return true;
}
const PET_EVENT_POOL = [            // v1.35：宠物奇遇（未拥有时进入事件池）
  {ev:"毛球来访", pet:"绒球兽"},
  {ev:"黏糊糊的果冻", pet:"史莱姆"},
  {ev:"捣蛋小鬼", pet:"捣蛋鬼"}
];
function petEventPool(){
  return PET_EVENT_POOL.filter(function(x){
    return (S.pets||[]).indexOf(x.pet) < 0 && !(S.pendingPet && S.pendingPet.name === x.pet);
  });
}
function pickExploreEvent(r){
  if(Math.random() >= EXPLORE_EVENT_CHANCE) return null;
  const pe = petEventPool();                       // v1.35：宠物奇遇（25% 事件位）
  if(pe.length && Math.random() < 0.25) return pe[Math.floor(Math.random()*pe.length)].ev;
  const bound = REGION_EVENTS[r.n];
  if(!bound || !exploreEventAvailable(bound)) return "盗贼伏击";
  return Math.random() < 0.30 ? "盗贼伏击" : bound;
}

function craftItem(name){
  const r = CRAFT[name];

    if((S.mats[k]||0) < r.ing[k])
      return showAlert("材料不足：需要 "+matIcon(k)+k+"×"+r.ing[k]+"（当前 "+(S.mats[k]||0)+"）。", "炼金台");

/* ══════════════════════════════════════════════════

function feedVal(name){ return WOLF_FEED_VALUE[(M[name] && M[name][1]) || "普通"] || 2; }
function feedWolf(name){
  if(!S.wolf) return showAlert("还没有小狼伙伴。", "宠物养成");
  if(!S.mats[name]) return;
  if(S.wolf.stage >= 4) return showAlert("远古魔狼已是最终形态，不再需要喂食。", "宠物养成");
  if(!WOLF_FOODS.has(name))
    return showAlert("「"+name+"」不能喂食，小狼不吃这个。<br><br>可喂食：食材与草药（品阶越高营养越好），以及高级特殊材料（龙血 / 龙心）。", "宠物养成");
  if(feedLeft() <= 0)
    return showAlert("今天已经喂食 "+WOLF_DAILY_FEED+" 次了，小狼吃饱啦——明天再喂吧。", "宠物养成");
  const w = S.wolf;
  const need = WOLF_STAGES[w.stage].need;
  const growthFull = w.growth >= need;             // 本阶段成长值已满
  const v = feedVal(name);
  const mv = WOLF_MUTATE_VALUE[name] || 0;         // 高级特殊材料 → 变异值
  S.mats[name]--; if(S.mats[name] <= 0) delete S.mats[name];
  w.fedDate = todayStr();
  w.fedCount = (w.fedCount || 0) + 1;
  if(!growthFull) w.growth += v;                   // 成长值满后不再增加（但仍可继续喂食）
  if(mv) w.mutate = (w.mutate || 0) + mv;
  const parts = [];
  if(!growthFull) parts.push("成长值 +"+v);
  if(mv) parts.push("变异值 +"+mv);
  if(!parts.length) parts.push("成长值已满，未获得加成");
  addLog("🐺 喂食「"+name+"」（"+parts.join("，")+"）→ "+WOLF_STAGES[w.stage].name
    + " 成长 "+w.growth+"/"+need + (w.mutate ? "　变异值 "+w.mutate+"/"+WOLF_MUTATE_NEED : ""), "ok");
  if(w.stage === 1 && w.growth >= WOLF_STAGES[1].need){
    w.stage = 2; w.growth = 0;
    addLog("🎉 小狼成长为「成年狼」：所有委托材料掉落率 +3%","gold");
    if(S.daily) S.daily.events.push("🐺 宠物成长：成年狼");
    save(); render();
    return showAlert("🎉 小狼长大了！<br><br>成为 <b>成年狼</b>——所有委托材料掉落率 <b>+3%</b>。", "宠物成长");
  }
  if(w.stage === 2 && w.growth >= WOLF_STAGES[2].need){
    w.stage = 3; w.growth = 0;
    addLog("🎉 成年狼成长为「巨狼」：材料掉落率 +5%、委托成功率 +1%","gold");
    if(S.daily) S.daily.events.push("🐺 宠物成长：巨狼");
    save(); render();
    return showAlert("🎉 它变得更加强壮——<br><br>成为 <b>巨狼</b>：材料掉落率 <b>+5%</b>、委托成功率 <b>+1%</b>。<br><br>接下来把成长值喂满，再用<b>高级特殊材料</b>（龙血 / 龙心）积累<b>变异值</b>，就能尝试变异。", "宠物成长");
  }
  save(); render();
  openWolfFeed();                       // 重开喂食窗，刷新库存与成长值
}
function evolveWolf(){
  const w = S.wolf;
  if(!w || w.stage !== 3) return showAlert("只有巨狼可以进化为远古魔狼。", "宠物养成");
  if(w.growth < WOLF_STAGES[3].need)
    return showAlert("成长值尚未积满（"+w.growth+" / "+WOLF_STAGES[3].need+"）。<br><br>先用食材把成长值喂满吧。", "宠物养成");
  if((w.mutate || 0) < WOLF_MUTATE_NEED)
    return showAlert("变异值尚未积满（"+(w.mutate||0)+" / "+WOLF_MUTATE_NEED+"）。<br><br>继续喂食<b>高级特殊材料</b>：龙血 / 暗影草 +5、龙心 / 世界树汁液 +12 变异值。", "宠物养成");
  showConfirm("巨狼气息翻涌，血脉深处仿佛有什么在苏醒——<br><br>确定让它变异为「远古魔狼」？", function(){
    S.wolf = {stage:4, growth:0, mutate:0, fedDate:"", fedCount:0};
    addLog("🌌 巨狼变异为「远古魔狼」：材料掉落率 +8%、委托成功率 +3%","gold");
    if(S.daily) S.daily.events.push("🐺 宠物变异：远古魔狼");
    save(); render();
    showAlert("🌌 变异成功！<br><br>它睁开金瞳，仰天长啸——<br><b>远古魔狼</b>：材料掉落率 <b>+8%</b>、委托成功率 <b>+3%</b>。", "远古魔狼");
  }, "远古魔狼");
}
function openWolfFeed(){
  if(!S.wolf) return;
  const w = S.wolf;
  if(w.stage >= 4) return showAlert("远古魔狼已是最终形态，不再需要喂食。", "宠物养成");
  const wst = WOLF_STAGES[w.stage];
  const growthFull = w.growth >= wst.need;
  const left = feedLeft();
  const keys = Object.keys(S.mats).filter(function(k){ return WOLF_FOODS.has(k); })
                 .sort(function(a,b){ return M[b][2] - M[a][2]; });
  let body = '<div class="dlg-msg" style="font-size:13px">今日剩余喂食次数：<b style="color:'+(left>0?"var(--gold)":"var(--red)")+'">'+left+" / "+WOLF_DAILY_FEED+'</b>　（每天最多 3 次，每次 1 个）</div>';
  if(growthFull) body += '<div class="muted" style="font-size:12px;margin-bottom:6px;color:var(--gold2)">成长值已满——普通食材 / 草药不再增加成长值；只有龙血 / 暗影草 / 龙心 / 世界树汁液（高级特殊材料）能继续积累变异值。</div>';
  if(!keys.length) body += '<div class="muted">背包里没有可喂食的物品——小狼吃：食材、草药，以及龙血 / 龙心。</div>';
  keys.forEach(function(k){
    const m = M[k], v = feedVal(k), mv = WOLF_MUTATE_VALUE[k] || 0;
    const zero = (growthFull && !mv) ? '<span style="color:var(--dim2)">（成长已满 · 无加成）</span>' : "";
    body += '<div class="li" style="gap:8px"><div style="flex:1">'+matIcon(k)+k+'<span class="tier t-'+m[1]+'">'+m[1]+'</span>'
          + '<div class="muted">'+(growthFull ? '' : '成长值 +'+v+'　')+(mv ? '<span style="color:var(--gold2)">变异值 +'+mv+'</span>　' : '')+zero+'库存 ×'+S.mats[k]+'</div></div>'
          + '<button class="btn sm pri" onclick="clrDlg();feedWolf(\''+k+'\')">喂食</button></div>';
  });
  dlg("🍖 喂食 · "+wst.name+"（成长 "+w.growth+" / "+wst.need+"　变异 "+(w.mutate||0)+" / "+WOLF_MUTATE_NEED+"）", body, [{text:"关闭", fn:null}]);
}

function exportSave(){
  const data = JSON.stringify(S, null, 2);
  const blob = new Blob([data], {type:"application/json"});

  const a = document.createElement("a");
  a.href = url;
  a.download = "健康的冒险者的一天_"+S.name+"_"+todayStr()+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  addLog("📤 已导出存档","gold");
  save(); render();
}
function importSave(){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.onchange = function(e){
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = function(ev){
      let d;
      try{ d = JSON.parse(ev.target.result); }
      catch(err){ return showAlert("导入失败：不是有效的 JSON 文件"); }
      if(!d || typeof d !== "object" || Array.isArray(d))
        return showAlert("导入失败：存档格式不正确");
      showConfirm("导入将覆盖当前进度，确定继续？", function(){
        S = migrate(Object.assign({}, d));   // 缺失字段用默认值补齐
        save();
        tick();
        hideIntro();
        addLog("📂 已导入存档（来自 "+f.name+"）","gold");
        render();
      }, "导入存档");
    };
    r.readAsText(f);
  };
  inp.click();
}

/* v1.38：尾巴提醒——昨天错过入睡打卡时，今天首次打开温和提一句（每游戏日最多一次） */
function checkLastNightHint(){
  try{
    const hs = S.history || [];
    if(!hs.length) return;
    const t0 = new Date(todayStr() + "T12:00:00");
    t0.setDate(t0.getDate() - 1);
    const y = t0.getFullYear() + "-" + String(t0.getMonth()+1).padStart(2,"0") + "-" + String(t0.getDate()).padStart(2,"0");
    const last = hs[hs.length-1];
    if(last.date !== y || last.sleep) return;                 // 只提醒「昨晚」且确实没早睡
    if(localStorage.getItem("adv_nighthint") === todayStr()) return;
    localStorage.setItem("adv_nighthint", todayStr());
    const shielded = (S.shieldDays || []).indexOf(last.date) >= 0;
    const sickCov = (S.sickDays || []).indexOf(last.date) >= 0;   // v1.61：疗养圣所病假覆盖
    setTimeout(function(){ try{
      toast(shielded
        ? "🛡 昨晚没早睡——连击保险替你挡下了（每月 1 次），今晚继续 🌙"
        : (sickCov
          ? "🕊️ 昨晚没早睡——疗养圣所病假已覆盖，连击保留，好好休息 🌙"
          : "🌙 昨晚的入睡打卡错过了（差一点点）。今晚 23:30 前记得——公会给你的房间留了灯"));
    }catch(e){} }, 2600);
  }catch(e){}
}
/* v1.38：吟游诗人的周报——每 7 天首次打开，用一封信回顾自己的健康（localStorage 记展示频率） */
function tryBardLetter(){
  try{
    if(typeof _queueBusy !== "undefined" && _queueBusy) return;   // 结算弹窗忙时让路
    const modal = document.getElementById("modal");
    if(modal && modal.classList.contains("on")) return;
    const dlgEl = document.getElementById("dlg");
    if(dlgEl && dlgEl.classList.contains("on")) return;
    const hs = S.history || [];
    if(hs.length < 3) return;
    const today = todayStr();
    const last = localStorage.getItem("adv_bard");
    if(last){
      const d0 = new Date(last + "T12:00:00"), d1 = new Date(today + "T12:00:00");
      if((d1 - d0) / 86400000 < 7) return;                        // 距上次未满 7 天
    }
    const week = hs.slice(-7);
    const prev = hs.slice(-14, -7);
    const sleepN = week.filter(function(x){ return x.sleep; }).length;
    const avg = Math.round(week.reduce(function(a,x){ return a + (x.score||0); },0) / week.length);
    const great = week.filter(function(x){ return (x.score||0) >= 90; }).length;
    const mx = week.reduce(function(a,x){ return Math.max(a, x.score||0); },0);
    let cmp = "";
    if(prev.length){
      const pAvg = Math.round(prev.reduce(function(a,x){ return a + (x.score||0); },0) / prev.length);
      const diff = avg - pAvg;
      cmp = diff >= 3 ? '　比上一程高了 <b style="color:var(--green)">' + diff + '</b> 分——风都在为你鼓掌。'
          : (diff <= -3 ? '　比上一程低了 <b style="color:var(--red)">' + (-diff) + '</b> 分——没关系，路还长。'
          : "　与上一程不相上下。");
    }
    const openers = [
      "旅人，篝火正旺，且听我唱一程——",
      "远方的冒险者，你的故事飘到了我的琴弦上——",
      "我在酒馆听说了你。来，让琴声记下这一程——"
    ];
    localStorage.setItem("adv_bard", today);
    dlg("📜 吟游诗人的信",
      '<div class="dlg-msg" style="line-height:2">'
      + openers[Math.floor(Math.random()*openers.length)] + "<br><br>"
      + '过去 <b>' + week.length + '</b> 天：早睡 <b style="color:var(--gold2)">' + sleepN + '</b> 天 · 平均 <b style="color:var(--green)">' + avg + '</b> 分 · 高光 <b>' + mx + '</b> 分'
      + (great ? '，其中优秀 ' + great + ' 天' : '') + '。<br>'
      + cmp + '<br><br><span class="muted">——琴声止处，愿你今晚好眠。</span></div>');
  }catch(e){}
}

    if(!_bg.length) h += `<div class="muted" style="font-size:12px">该分类下暂无装备。</div>`;

      h += `<div class="li">

  h += `</div>`;

  // ── 打造（只显示已拥有图纸的装备） ──
  const owned = GEAR.filter(function(g){ return S.blueprints[g[0]] === true; });

  if(!owned.length){
    h += `<div class="muted">还没有任何图纸。<br><br>到下方「📜 图纸商店」购买，或从探索事件获得。</div>`;
  } else {
    h += `<div class="muted" style="font-size:11px;margin-bottom:8px;line-height:1.7">

    const _parts = [];
    const _cntByPart = {};
    owned.forEach(function(g){
      if(g[2] && _parts.indexOf(g[2]) < 0) _parts.push(g[2]);
      if(g[2]) _cntByPart[g[2]] = (_cntByPart[g[2]] || 0) + 1;
    });
    const _partFiltered = owned.filter(function(g){ return craftPart === "全部" || g[2] === craftPart; });   // v1.38j：部位筛选（计数联动）
    _partFiltered.sort(function(a,b){ return byQualityDesc(a[1], b[1]); });   // v1.54：高品阶→低品阶
    const _canCraftG = function(g){   // v1.38j：轻量"能否打造"判定（仅统计用，无副作用）
      const _mm2 = craftMainMat(g[0]);
      return (S.mats[_mm2.mat]||0) >= _mm2.cnt
          && !!pickSubMats(g[1], _mm2.mat, subMatCount(g[1], g[2]))
          && S.money >= craftCost(g[1]) * 10000;
    };
    let _okNow = 0;
    _partFiltered.forEach(function(g){ if(_canCraftG(g)) _okNow++; });
    h += `<div style="margin-bottom:6px;line-height:2.1">`
      + `<button class="btn sm${craftPart==="全部"?" pri":""}" onclick="setBagFilter('part','全部')">全部（${owned.length}）</button> `
      + _parts.map(function(p2){ return `<button class="btn sm${craftPart===p2?" pri":""}" onclick="setBagFilter('part','${p2}')">${p2}（${_cntByPart[p2]||0}）</button>`; }).join(" ")
      + `</div>`;
    h += `<div style="margin-bottom:8px;line-height:2.1">
      <button class="btn sm${craftFilter==="可打造"?" pri":""}" onclick="setBagFilter('craft','${craftFilter==="可打造"?"全部":"可打造"}')">✅ 只看材料齐备（${_okNow}）</button></div>`;
    h += `<div class="scroll-y">`;
    let _shown = 0;
    _partFiltered.forEach(function(g){
      const n = g[0];
      const mm = craftMainMat(n);
      const sub = subTiers(g[1]).join(" 或 ");
      const subCnt = subMatCount(g[1], g[2]);
      const cost = craftCost(g[1]) * 10000;
      const hasMain = (S.mats[mm.mat]||0) >= mm.cnt;
      const subsOk = !!pickSubMats(g[1], mm.mat, subCnt);
      const moneyOk = S.money >= cost;
      const ok = hasMain && subsOk && moneyOk;
      if(craftFilter === "可打造" && !ok) return;      // v1.38g：只显示材料齐备的图纸
      _shown++;                                        // v1.38j：已显示计数（空列表提示用）
      const missing = [];
      if(!hasMain) missing.push("主材料 " + mm.mat + "×" + mm.cnt + "（有 " + (S.mats[mm.mat]||0) + "）");

      if(!moneyOk) missing.push("加工费 " + fmtMoney(cost));
      h += `<div class="li" style="flex-direction:column;align-items:stretch;gap:4px">
        <div class="row" onclick="showGearDetail('${n}')" style="cursor:pointer"><b>${gearIcon(n)}${n}</b><span><span class="tier t-${g[1]}">${g[1]}</span> <span class="muted" style="font-size:10px">${gearMainTxt(g)}</span></span></div>
        <div class="muted" style="font-size:11px">${matIcon(mm.mat)}${mm.mat}×${mm.cnt}　+　${sub} ×${subCnt}　+　${fmtMoney(cost)}</div>
        <div class="row">
          <span class="muted" style="font-size:11px;color:${ok?"var(--green)":"var(--red)"}">${ok?"✅ 材料齐备":missing.join("　")}</span>
          <button class="btn sm ${ok?"pri":""}" onclick="craft('${n}')">打造</button>
        </div>
      </div>`;
    });
    if(!_shown) h += `<div class="muted" style="font-size:12px">当前筛选下没有${craftFilter==="可打造"?"可打造":"可"}的图纸。</div>`;
    h += `</div>`;
  }
  h += `</div>`;

  // ── v1.46：炼金台 · 任务准备物（购买 + 合成） ──
  h += `<div class="card"><h3>⚗️ 炼金台 · 任务准备物</h3>
    <div class="muted" style="font-size:11px;margin-bottom:8px;line-height:1.7">部分委托要求准备物，<b>接取时按委托等级消耗 1~3 个</b>（Lv3→1 / Lv4→2 / Lv5→3）——可在「🛒 商店」购买，也可在此用材料合成（更省）。</div>`;
  Object.keys(CRAFT).sort(function(a,b){ return CRAFT[b].buy - CRAFT[a].buy; }).forEach(function(n){   // v1.54：高价（更高级）准备物在上
    const r = CRAFT[n];
    const have = S.items[n] || 0;
    const can = Object.keys(r.ing).every(function(k){ return (S.mats[k]||0) >= r.ing[k]; });
    const ingTxt = Object.keys(r.ing).map(function(k){
      const ok2 = (S.mats[k]||0) >= r.ing[k];
      return `<span style="color:${ok2?"var(--green)":"var(--red)"}">${matIcon(k)}${k}×${r.ing[k]}（有 ${S.mats[k]||0}）</span>`;
    }).join("　");
    const qs = Object.keys(QUEST_ITEM).filter(function(k2){ return QUEST_ITEM[k2] === n; });
    h += `<div class="li" style="flex-direction:column;align-items:stretch;gap:4px">
      <div class="row"><b style="cursor:pointer" onclick="showItemDetail('${n}')">${PREP_ICON[n]} ${n}</b>
        <div class="cnt"><span>×${have}</span>
        <button class="btn sm${can?" pri":""}" onclick="craftItem('${n}')">合成</button></div></div>
      <div class="muted" style="font-size:11px">${ingTxt}　·　商店价 ${fmtMoney(r.buy)}</div>
      <div class="muted" style="font-size:11px">用于：${qs.slice(0,3).join("、")}${qs.length>3?"　等 "+qs.length+" 个委托":""}</div>
    </div>`;
  });
  h += `</div>`;

  // ── 规则道具 ──
  const items = Object.keys(S.items || {}).filter(function(n){ return !CRAFT[n]; }).sort(byItemOrder);   // v1.46：准备物归炼金台；v1.54：按价值高→低
  h += `<div class="card"><h3>🪄 规则道具</h3>`;
  if(!items.length){
    h += `<div class="muted">还没有道具。探索或兑换可以获得。</div>`;
  } else {
    items.forEach(function(n){
      h += `<div class="li" style="flex-direction:column;align-items:stretch;gap:4px">
        <div class="row"><b style="cursor:pointer" onclick="showItemDetail('${n}')">${n}</b>
          <div class="cnt"><span>×${S.items[n]}</span>
          <button class="btn sm pri" onclick="useItem('${n}')">使用</button></div></div>
        <div class="muted" style="font-size:11px">${ITEM_DESC[n]||""}</div>
      </div>`;
    });
  }
  h += `</div>`;

  // ── v1.56：宠物管理移至独立「🐾 宠物」页 ──
  {
    const _pn = (S.pets || []).filter(function(n){ return n !== "小狼"; }).length + (S.wolf ? 1 : 0);   // v1.56：小狼由 S.wolf 单独计数（防重复）
    h += `<div class="card"><h3>🐾 宠物（${_pn}）</h3>
      <div class="muted" style="font-size:12px;line-height:1.8">宠物已搬到独立的「<b>🐾 宠物</b>」页——心情互动、抚摸、喂食、散步、羁绊故事都在那里。</div>
      <div style="margin-top:8px"><button class="btn sm pri" onclick="gotoPetTab()">前往宠物页</button></div></div>`;
  }
  h += `</div>`;


  const total = keys.reduce((a,k)=>a+M[k][2]*S.mats[k],0);
  const mp = moneyParts(S.money);
  h += `<div class="card"><h3>💰 资产</h3>
    <div class="li"><span>铂金币</span><b style="color:#b89fd9">${mp.plat}</b></div>

    <div class="li"><span>铜币</span><b style="color:#c08050">${mp.copper}</b></div>
    <div class="li" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px">
      <span>折算总额</span><b style="color:var(--gold2)">${fmtMoney(S.money)}</b></div>
    <div class="li"><span>材料估值</span><b>${fmtMoney(total)}</b></div>
  </div>`;

  el.innerHTML = h;
}

/* v1.57：内容区左右滑动手势切页（手机端，与底部横滑栏配套；左右滑 = 上一页 / 下一页）
   仅在单指、横向位移足够（≥70px 且明显大于纵向）时触发；起点落在横向可滚动 / 交互控件上时忽略 */
(function(){
  const order = Array.prototype.map.call(document.querySelectorAll("#tabs button"), b=>b.dataset.t);
  if(!order.length) return;
  const skip = t => !!(t && t.closest && t.closest("#tabs,input[type=range],.scroll-y,a,button.qd-row"));
  let sx = 0, sy = 0, armed = false;
  const main = document.querySelector("main");
  if(!main) return;
  main.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1){ armed = false; return; }
    armed = !skip(e.target);
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  main.addEventListener("touchend", function(e){
    if(!armed) return; armed = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;   // 纵向为主 → 视为滚动
    const onB = document.querySelector("#tabs button.on");
    const i = onB ? order.indexOf(onB.dataset.t) : -1;
    if(i < 0) return;
    const j = dx < 0 ? i + 1 : i - 1;                                    // 左滑 → 下一页；右滑 → 上一页
    if(j < 0 || j >= order.length) return;
    const nb = document.querySelector('#tabs button[data-t="'+order[j]+'"]');
    if(nb) nb.click();                                                   // 复用页签点击路径（含 Lv1 公会 / 无伙伴宠物拦截）
  }, {passive:true});
})();

function remindSeen(key){        // 每条提醒每天只触发一次（localStorage 记账）
  const day = todayStr();
  let o = {};
  try { o = JSON.parse(localStorage.getItem("adv_reminds")||"{}"); } catch(e){}
  if(o[key]) return true;
  o[key] = 1;
  for(const k in o) if(k.indexOf(day) !== 0) delete o[k];   // 只保留当天的记录
  try { localStorage.setItem("adv_reminds", JSON.stringify(o)); } catch(e){}
  return false;
}

/* ══════════════════════════════════════════════════
   ★ Flask 桥接层
   状态由服务端（SQLite + 补算引擎）权威提供。
   本段重定义原型的存档 / 补算 / 动作函数为 API 调用——同名函数声明，
   后声明生效，覆盖上方原型实现（原实现保留作参考，不再被调用）。
   ══════════════════════════════════════════════════ */

/* ── 状态适配：服务端 snake_case → 原型 S 结构 ── */
function camelKey(k){ return k.replace(/_([a-z])/g, function(_, c){ return c.toUpperCase(); }); }
function adaptState(sv){
  const out = {};
  for(const k in sv) out[camelKey(k)] = sv[k];
  // 日志：服务端 {ts,msg,cls} → 原型 {t,m,c}
  out.log = (sv.log || []).map(function(e){
    const d = new Date(e.ts);
    return { t:(d.getMonth()+1+"").padStart(2,"0")+"-"+(d.getDate()+"").padStart(2,"0")+" "+hhmm(d),
             m:e.msg, c:e.cls || "" };
  });
  out.results = sv.results || [];
  out.levelups = sv.levelups || [];             // v1.38r：升级详情队列（服务端驱动）
  out.pendingRare = sv.pending_rare || [];
  out.exploreResult = sv.explore_result || null;
  out.pendingEvent = sv.pending_event || null;
  out.eventResult = sv.event_result || null;
  out.legendPool = null;
  return out;
}

let _toastEl = null, _toastTimer = null;
function toast(msg){
  if(!_toastEl){

      + "background:rgba(28,28,38,.97);border:1px solid var(--line);border-radius:10px;padding:8px 16px;"
      + "font-size:12.5px;color:var(--gold2);max-width:86vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s";

}

/* ── API 通讯 ── */
async function apiCall(action, data){
  const r = await fetch("/api/action", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({action:action}, data || {})) });
  const j = await r.json().catch(function(){ return { error:"无法连接服务器" }; });
  if(!j.state){
    showAlert(j.error || "无法连接服务器", "提示");
    if(j.gate) setTimeout(function(){ location.reload(); }, 1200);   // 口令失效 → 回访问验证页
    return j;
  }
  applyServer(j);
  if(j.error) showAlert(j.error);
  return j;
}
async function refreshState(){
  const r = await fetch("/api/state", {cache:"no-store"});
  const j = await r.json().catch(function(){ return {}; });
  if(!j.state){
    if(j.gate) setTimeout(function(){ location.reload(); }, 600);     // 口令失效 → 自动回验证页
    return j;
  }
  applyServer(j);
  return j;
}
function applyServer(j){
  S = adaptState(j.state);
  S.account = j.account || S.account;          // v1.37：账号（接入码）
  (j.msgs || []).forEach(function(m){ toast(m); });
  render();
  if(!S.name) showIntro(); else hideIntro();   // v1.37：接入码找回后自动进入游戏
  flushResults();
  maybeShowExploreFlow();
}
/* tick 覆盖：原型本地补算 → 服务端 catch_up */

/* ── 结算结果 / 稀有事件弹窗队列（服务端驱动；播 3D 骰子后逐条展示） ── */
let _queueBusy = false, _resultResolve = null;
let _ysAckDate = null;         // v1.41 修复：已展示的昨日快照日期（防打卡 / 定时同步重复弹出）
let _festAckDate = null;       // v1.41d：已展示的节日欢迎窗日期（同款防竞态）
function flushResults(){
  if(_queueBusy) return;
  if(document.getElementById("modal").classList.contains("on")) return;
  _queueBusy = true;
  (async function(){
    let consumed = false;
    /* v1.41 修复（结算动画/掷骰重播两遍）：整批 splice 取走本地快照。
       原实现 while 每轮重读 S.results——播放/弹窗停留期间若 20 秒定时同步到达，
       applyServer 会用「服务端尚未 ack 的同一批结果」整体替换 S，
       已播过的结果回到队列 → 点确定后再播一遍（全流程两遍）。 */
    const batchR = (S.results || []).splice(0);        // UI 侧消费（消费完统一 ack）
    for(const r of batchR){
      consumed = true;
      await queueRoll3D(r.roll, r.name);
      await questAnimWait(r);                      // v1.35：emoji 迷你动画
      await showResultModal(r);
    }
    const batchL = (S.levelups || []).splice(0);       // v1.38r：升级详情（结算结果之后弹出）
    for(const _lvIdx of batchL){
      consumed = true;
      await new Promise(function(resolve){ showLevelUpDetail(_lvIdx, resolve); });
    }
    const batchRare = (S.pendingRare || []).splice(0);
    for(const ev of batchRare){
      consumed = true;
      await showRareModal(ev);
    }
    if(S.pendingLegend){
      consumed = true;
      const pl = S.pendingLegend;
      S.pendingLegend = null;                      // 本地清空防重复；服务端随 results_ack 落库
      await new Promise(function(resolve){
        dlg("特殊事件",
          "<div style='text-align:center;font-size:15px;color:var(--gold);margin-bottom:8px'>⚡ 触发特殊事件！</div>"
          + (pl.preview
              ? "你隐约听见【" + pl.title + "】「" + pl.name + "」的低语——尚未达到参与条件，只能远远望见（仅预览）。<br><br>到「冒险者委托」页 · 特殊事件窗口查看详情。"
              : "【" + pl.title + "】「" + pl.name + "」已出现。<br><br>到「冒险者委托」页 · 特殊事件窗口查看详情并接取。"),
          [{text:"确定", cls:"pri", fn:resolve}]);
      });
    }
    // v1.41 修复（重播两遍）：先 ack（服务端清队）再解锁——ack 网络往返期间若同步到达，
    // 锁已放开会让「服务端未清空的结果」再播一遍
    if(consumed){ await apiCall("results_ack"); }
    _queueBusy = false;
    if(consumed) return;
    // 昨日快照（优先级最低）—— v1.41 修复：每项打卡 / 每隔一段时间重复弹出（手机端 20 秒同步即复现）
    // 原实现只 showYesterday()：既不本地标记也不通知服务端，服务端 yesterday_shown 永远为 false，
    // 每次 applyServer（打卡响应 / 定时同步）重入 flushResults 都会再弹一遍。
    // 现改为：本地立即标记 + 会话级防竞态（ack 往返期间同步覆盖也不重弹）+ 服务端 yesterday_ack 落库。
    if(S.yesterday && !S.yesterdayShown && S.yesterday.date !== _ysAckDate && !document.getElementById("dlg").classList.contains("on")){
      S.yesterdayShown = true;                 // 本地立即标记（防同会话重入）
      _ysAckDate = S.yesterday.date;           // 会话级防竞态：ack 未落库前同步覆盖也不重弹
      showYesterday();
      apiCall("yesterday_ack");                // 服务端落库（下次同步带回 yesterday_shown=true）
      return;                                  // v1.41d：昨日结算之后还有节日欢迎窗（关闭后再弹）
    }
    // v1.41d：节日欢迎窗（队列最末——排在结算结果 / 昨日结算之后；服务端 pending_festival 驱动）
    if(S.pendingFestival && S.pendingFestival.date !== _festAckDate && !document.getElementById("dlg").classList.contains("on")){
      const pf = S.pendingFestival;
      S.pendingFestival = null;                // 本地立即清空（防同会话重入）
      _festAckDate = pf.date;                  // 会话级防竞态：ack 未落库前同步覆盖也不重弹
      showFestivalWelcome(pf);
      apiCall("festival_ack");                 // 服务端落库（下次同步带回 pending_festival=null）
    }
  })();
}

function acceptQuest(idx){
  const q = S.pool && S.pool.list ? S.pool.list[idx] : null;
  if(!q) return;
  if(S.pool.taken) return showAlert("本次刷新已接取过了");
  if(poolExpired()) return showAlert("本批委托已失效。<br><br>接取窗口为刷新后 <b>"+fmtDur(poolWindowMs()/60000)+"</b>内（本批刷新点："+S.pool.point.split("@")[1]+":00）。<br>等下一个刷新点再来。");
  const limit = dailyLimitNow();
  if(S.accepted >= limit) return showAlert("今日接取已达上限（"+limit+" 个）");

  if(activeNormalCount() >= simCap) return showAlert("同时进行的委托已达上限 "+simCap+" 个");
  const enCost = Math.max(1, Math.round(q[7] * (1 - gearEnCutFor(q[1]))));

  showConfirm("确定中途返回吗？<br><br>放弃「"+ea.n+"」的探索——<b>不会获得任何材料掉落</b>（探索点与次数也不退还）。", function(){
    apiCall("explore_return");
  }, "中途返回");
}
/* Flask 版：探索结算由服务端 catch_up 驱动 → 前端此函数置空（防本地重复结算） */
function exploreFinishCheck(){ /* 服务端驱动 */ }
function useItem(name){
  if(!S.items[name]) return;
  if(name === "疾风符咒"){
    if(!S.active.length) return showAlert("当前没有正在进行的委托。", "疾风符咒");
    const body = S.active.map(function(a,i){
      return '<div class="li" style="gap:8px"><div><b>'+a.name+'</b>'
           + '<div class="muted">成功率 <b style="color:'+rateColor(a.rate)+'">'+Math.round(a.rate*100)+'%</b></div></div>'
           + '<button class="btn sm pri" onclick="clrDlg();useGale('+i+')">直接完成</button></div>';
    }).join("");
    dlg("疾风符咒 · 选择要完成的委托",
        '<div class="dlg-msg" style="font-size:13px">立即结算以下任一委托，跳过剩余等待时间：</div>'+body,
        [{text:"取消", fn:null}]);
    return;
  }
  if(sickToday() && ["安眠护符","清醒符咒","活力药水"].indexOf(name) >= 0)
    return showAlert("今日病假已封存——评分锁定 "+SICK_LOCK_SCORE+"，打卡类道具无法使用。", "疗养圣所");   // v1.61
  apiCall("use_item", {name:name}).then(function(j){
    if(j.error) return;
    if(name === "清醒符咒") showAlert("已使用「清醒符咒」。<br><br>今日早起判定视为达成，+15 分。", "清醒符咒");
    if(name === "安眠护符") showAlert("已使用「安眠护符」。<br><br>今日早睡判定视为达成，+20 分。", "安眠护符");
    if(name === "活力药水") showAlert("已使用「活力药水」。<br><br>今日健康评分锁定为 <b>100 分</b>。", "活力药水");
    if(name === "命运骰子") showAlert("命运骰子掷出——<br><br>当前委托栏已<b>重新刷新</b>。", "命运骰子");
    if(name === "时之怀表") showAlert("怀表的指针缓缓倒转——<br><br>本批委托的接取窗口<b>已重置</b>（按本批窗口时长重新计时）。", "时之怀表");
    if(name === "幸运币") showAlert("幸运币在掌心化作一线金光——<br><br>下一次委托<b>成功率 +5%</b>。", "幸运币");
    if(name === "专注药剂") showAlert("药剂入喉，世界清晰了几分——<br><br>下一次委托<b>成功率 +3%</b>。", "专注药剂");
    if(name === "谈判卷轴") showAlert("卷轴上写满商会的暗语——<br><br>下一次委托<b>报酬 +15%</b>。", "谈判卷轴");
    if(name === "旅行干粮") showAlert("风干的肉脯与硬面包，嚼完浑身是劲——<br><br>精力 <b>+30</b>（不超过上限）。", "旅行干粮");
    if(name === "神秘地图") showAlert("一卷泛黄的旧地图，标着几处未名的角落——<br><br>探索点 <b>+2</b>。", "神秘地图");
  });
}
function useGale(i){
  const a = S.active[i];
  if(!a) return;
  apiCall("gale", {idx:i});
}
/* 宠物养成（服务端权威：喂食/变异由服务端结算） */
function feedWolf(name){
  const before = S.wolf ? S.wolf.stage : 0;
  apiCall("feed_wolf", {name:name}).then(function(j){
    if(j.error) return;
    const now = j.state.wolf ? j.state.wolf.stage : 0;
    if(now > before && now < 4){
      const st = WOLF_STAGES[now];
      showAlert("🎉 它长大了！<br><br>现在是 <b>"+st.name+"</b>——材料掉落率 <b>+"+Math.round(st.mat*100)+"%</b>"
        + (st.rate ? "、委托成功率 <b>+"+Math.round(st.rate*100)+"%</b>" : "") + "。", "宠物成长");
    } else {
      openWolfFeed();          // 重开喂食窗，刷新库存与成长值
    }
  });
}
/* v1.35：宠物养成扩充（可养成线）——服务端权威 */
function feedPet(n, foodName){
  const pd0 = (S.petData||{})[n];
  const before = pd0 ? pd0.stage : 0;
  apiCall("feed_pet", {name:n, food:foodName}).then(function(j){
    if(j.error) return;
    const pd = (j.state.pet_data || {})[n];
    const now = pd ? pd.stage : 0;
    if(now > before && now < 4){
      showAlert("🎉 它长大了！<br><br>「"+n+"」成长进阶——加成已提升（见「🐾 宠物」页）。", "宠物成长");
    } else {
      openPetFeed(n);
    }
  });
}
/* v1.56：宠物互动（服务端权威） */
function petPat(n){
  apiCall("pet_pat", {name:n}).then(function(j){ if(j.error) return; showPetDetail(n); });
}
function petWalkStart(n){
  apiCall("pet_walk", {name:n}).then(function(j){ if(j.error) return; render(); });
}
function setPetNick(n, nick){
  apiCall("pet_nick", {name:n, nick:nick}).then(function(j){ if(j.error) return; render(); });
}
async function setCarryPet(n){                        // v1.38f：携带宠物（服务端权威）
  await apiCall("set_carry_pet", {name:n});
}
function evolvePet(n){
  showConfirm("它气息翻涌，血脉深处仿佛有什么在苏醒——<br><br>确定让它变异？", function(){
    apiCall("evolve_pet", {name:n}).then(function(j){
      if(!j.error) showAlert("🌌 变异成功！<br><br>加成已提升（见「🐾 宠物」页）。", "宠物变异");
    });
  }, "宠物变异");
}
function evolveWolf(){
  const w = S.wolf;
  if(!w || w.stage !== 3) return showAlert("只有巨狼可以进化为远古魔狼。", "宠物养成");
  if(w.growth < WOLF_STAGES[3].need)
    return showAlert("成长值尚未积满（"+w.growth+" / "+WOLF_STAGES[3].need+"）。<br><br>先用食材把成长值喂满吧。", "宠物养成");
  if((w.mutate || 0) < WOLF_MUTATE_NEED)
    return showAlert("变异值尚未积满（"+(w.mutate||0)+" / "+WOLF_MUTATE_NEED+"）。<br><br>继续喂食<b>高级特殊材料</b>：龙血 / 暗影草 +5、龙心 / 世界树汁液 +12 变异值。", "宠物养成");
  showConfirm("巨狼气息翻涌，血脉深处仿佛有什么在苏醒——<br><br>确定让它变异为「远古魔狼」？", function(){
    apiCall("evolve_wolf").then(function(j){
      if(!j.error) showAlert("🌌 变异成功！<br><br>它睁开金瞳，仰天长啸——<br><b>远古魔狼</b>：材料掉落率 <b>+8%</b>、委托成功率 <b>+3%</b>。", "远古魔狼");
    });
  }, "远古魔狼");
}

/* ── 存档（SQLite 后端） ── */
async function exportSave(){
  // v1.39（C3）：改为向服务端要「全量存档」——状态下发的 history 有截断（近 150 条），本地 S 不再完整
  let snap = null;
  try{
    const r = await fetch("/api/action", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({action:"export_save"})});
    const j = await r.json();
    if(j && j.save) snap = adaptState(j.save);   // snake → camel（与原型创造版互通）
  }catch(e){}
  if(!snap){ try{ await refreshState(); }catch(e){} snap = Object.assign({}, S); }  // 兜底：服务端不可达用本地状态
  delete snap.account;
  delete snap.legendPool;
  const data = JSON.stringify(snap, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a2 = document.createElement("a");
  a2.href = url;
  a2.download = "健康的冒险者的一天_"+(S.name||"冒险者")+"_"+todayStr()+".json";
  document.body.appendChild(a2);
  a2.click();
  document.body.removeChild(a2);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showAlert("已导出存档快照（JSON）。<br><br>该文件可导入原型创造版；正式备份请复制电脑上的 <b>Flask版/data/adventurer.db</b>。", "导出快照");
}
function importSaveFile(){                          // v1.38d：导入原型 / 快照 JSON（存档互通）
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.onchange = function(e){
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = function(ev){
      let d;
      try{ d = JSON.parse(ev.target.result); }
      catch(err){ return showAlert("导入失败：不是有效的 JSON 文件"); }
      if(!d || typeof d !== "object" || Array.isArray(d))
        return showAlert("导入失败：存档格式不正确");
      showConfirm("导入将<b>覆盖当前账号的进度</b>（建议先「导出快照」备份），确定继续？", function(){
        apiCall("import_save", {data: d}).then(function(j){
          if(!j.error) showAlert("已导入存档：「" + ((j.state && j.state.name) || "未命名") + "」", "导入存档");
        });
      }, "导入存档");
    };
    r.readAsText(f);
  };
  inp.click();
}
function importSave(){
  showAlert("存档保存在电脑的 SQLite 数据库：<b>Flask版/data/adventurer.db</b><br><br>"
    + "· 备份 / 恢复：复制或替换该文件即可<br>"
    + "· 电脑与手机访问的是同一份存档<br>"
    + "· 「导出快照」下载的 JSON 仅用于查阅", "数据说明");
}
function resetAll(){
  showConfirm("确定清空所有进度重新开始？<br>此操作不可撤销。<br><br>建议先备份电脑上的 data/adventurer.db 文件。", function(){
    apiCall("reset").then(function(){
      document.getElementById("nameInput").value = "";
      showIntro();
    });
  }, "重置存档");
}

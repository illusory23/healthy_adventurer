<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1a1c30; --panel:#242844; --panel2:#2e3254; --line:#40456e;
  --gold:#e8b54a; --gold2:#ffd97a; --green:#5fd49a; --red:#f07a72;
  --blue:#6cb4f5; --purple:#b48cf0; --orange:#f5a04e;
  --txt:#eef0fb; --dim:#9aa0c8; --dim2:#6c7198;
}
body{
  /* v1.35：晨昏背景——光晕颜色由 data-tod 切换（JS 按现实时间设置） */
  --amb1:rgba(124,104,255,.16); --amb2:rgba(232,181,74,.08); --amb3:rgba(96,160,255,.07); --bgc:var(--bg);
  background:
    radial-gradient(1100px 520px at 50% -8%, var(--amb1) 0%, transparent 58%),
    radial-gradient(900px 460px at 88% 4%, var(--amb2) 0%, transparent 52%),
    radial-gradient(760px 520px at 6% 100%, var(--amb3) 0%, transparent 55%),
    var(--bgc);
  background-attachment:fixed;
  color:var(--txt); font-size:15px; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
body[data-tod="dawn"]{   --amb1:rgba(255,170,90,.15); --amb2:rgba(255,220,140,.13); --amb3:rgba(255,140,120,.08); --bgc:#2b2030 }
body[data-tod="day"]{    --amb1:rgba(110,170,255,.18); --amb2:rgba(255,230,160,.10); --amb3:rgba(120,220,255,.08); --bgc:#1c2238 }
body[data-tod="dusk"]{   --amb1:rgba(255,120,90,.15); --amb2:rgba(255,170,80,.12); --amb3:rgba(170,90,200,.10); --bgc:#291c33 }
body[data-tod="evening"]{--amb1:rgba(140,110,255,.18); --amb2:rgba(200,130,255,.08); --amb3:rgba(90,110,255,.08); --bgc:#1c1a2e }
/* ── 顶部固定区（资源栏 + 标签栏 一起吸顶）── */
#topbar{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(180deg,#2a2e52 0%,#222540 100%);
  box-shadow:0 4px 18px rgba(0,0,0,.5), inset 0 -1px 0 rgba(232,181,74,.22);
}
#hud{
  background:transparent;
  border-bottom:1px solid rgba(232,181,74,.14); padding:8px 12px calc(8px + env(safe-area-inset-top,0));
  padding-top:calc(8px + env(safe-area-inset-top,0));
}
.hud-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hud-lv{font-weight:700;color:var(--gold2);font-size:16px}
.hud-guild{font-size:12px;color:var(--dim)}
.hud-date{font-size:12px;color:var(--dim)}
.hud-bars{display:flex;gap:8px;margin-bottom:6px}
.bar{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.bar-exp i{background:linear-gradient(90deg,#4a86e8,#6cb4f5)} .bar-en i{background:linear-gradient(90deg,#3fae75,#5fd49a)}
.bar-en i.warn{background:linear-gradient(90deg,#c9a227,#e8c84a)}   /* v1.34：精力 ≤66% 黄 */
.bar-en i.low{background:linear-gradient(90deg,#b0332a,#e05a4a)}    /* v1.34：精力 ≤33% 红 */
.bar-lab{font-size:10px;color:var(--dim2);margin-top:2px;display:flex;justify-content:space-between}
.hud-res{display:flex;gap:10px;font-size:12px;flex-wrap:wrap}
.hud-res span{color:var(--dim)}
.hud-res b{color:var(--txt);font-weight:600}
/* ── 标签页 ── */
#tabs{
  display:flex; background:linear-gradient(180deg,#20233e,#1d2036);
  border-bottom:1px solid var(--line);
  overflow-x:auto; scrollbar-width:none;      /* v1.41f4：页签增多——窄屏横向滚动兜底 */
}
#tabs::-webkit-scrollbar{display:none}      /* v1.41f4：隐藏滚动条（保持原视觉） */
#tabs button{
  flex:1 0 auto; padding:10px 2px; background:none; border:none; color:var(--dim);
  font-size:12px; font-family:inherit; cursor:pointer; border-bottom:2px solid transparent;
  white-space:nowrap; display:flex; align-items:center; justify-content:center; gap:5px;
}
#tabs .tb-i{font-size:14px;line-height:1}   /* v1.57：页签图标（手机端独立成行） */
#tabs button.on{color:var(--gold2);border-bottom-color:var(--gold);text-shadow:0 0 14px rgba(255,217,122,.5)}
main{padding:14px;max-width:980px;margin:0 auto}
/* ── 通用 ── */
.card{background:linear-gradient(165deg,#2b2f52 0%,#232744 62%);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.035);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.42),0 0 0 1px rgba(232,181,74,.16),inset 0 1px 0 rgba(255,255,255,.04)}   /* v1.35 微交互 */
.card h3{font-size:15.5px;color:var(--gold2);margin-bottom:10px;font-weight:600;padding-left:9px;border-left:3px solid var(--gold);line-height:1.25;text-shadow:0 0 16px rgba(232,181,74,.3)}
.muted{color:var(--dim);font-size:12.5px}
.btn{
  display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid #4a5080;
  background:linear-gradient(180deg,#343a62,#282c4c);color:var(--txt);font-size:13px;font-family:inherit;white-space:nowrap;flex-shrink:0;min-width:max-content;
  cursor:pointer;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.btn:active{transform:scale(.97)} .btn:hover{filter:brightness(1.1)}   /* v1.35 微交互 */
.btn.pri{background:linear-gradient(180deg,#f2c65e,#d9a03c);border-color:#f7d47a;color:#241d08;font-weight:600;box-shadow:0 2px 12px rgba(232,181,74,.4)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.meal-btn{padding:8px 13px;font-size:13px;white-space:nowrap;min-width:72px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center}   /* v1.32：三餐按钮加大 + 文本居中 */
.cnt{flex-wrap:wrap;justify-content:flex-end}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:8px}
.grid2{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
/* ── 委托页双栏布局 ── */
.qsplit{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:900px){
  main:has(#tab-quest.on){max-width:1400px}
  .qsplit{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:10px;align-items:start}
}
/* ── 委托卡 ── */
.quest{background:linear-gradient(160deg,#30345a,#282c4c);border:1px solid #454b7a;border-radius:10px;padding:13px;cursor:pointer;transition:.15s;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.quest:hover{box-shadow:0 0 0 1px rgba(232,181,74,.5),0 7px 20px rgba(0,0,0,.4)}   /* v1.35 微交互 */
/* v1.35：图鉴收集册 */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.gal-cell{background:linear-gradient(160deg,#30345a,#282c4c);border:1px solid #454b7a;border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;line-height:1.35;font-size:12px}
.gal-cell.dim{opacity:.3;filter:grayscale(.85)}
.gal-cell.bp{opacity:.62;filter:grayscale(.3)}
.gal-cell .gname{font-size:11.5px}
.quest:active{transform:scale(.98)}
@media(hover:hover){.quest:hover{border-color:#6068a8;transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.35)}}
.quest.dis{opacity:.4;cursor:not-allowed}
.quest b{display:block;font-size:15.5px;margin-bottom:5px}
.quest .meta{font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:7px}
.diff{font-size:10.5px;padding:2px 6px;border-radius:3px;font-weight:600}
.d-简单{background:linear-gradient(180deg,#2f6046,#264c38);color:#8fe9b2;border:1px solid #3d7a58}
.d-普通{background:linear-gradient(180deg,#2e4a66,#264058);color:#8cc6f2;border:1px solid #3d648c}
.d-困难{background:linear-gradient(180deg,#5c452a,#4a3a24);color:#f0c084;border:1px solid #7c5f3a}
.d-噩梦{background:linear-gradient(180deg,#5e3030,#4a2828);color:#f59a92;border:1px solid #8a4444}
.rate{color:var(--gold2);font-weight:600}
/* ── 健康打卡 ── */
.hitem{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:none}
.hitem .nm{font-size:15px}
.hitem .pt{font-size:12px;color:var(--gold);margin-left:6px}
.cnt{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cnt button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:16px;cursor:pointer;font-family:inherit}
.cnt span{min-width:20px;text-align:center;font-size:13px}
.total{font-size:36px;font-weight:700;color:var(--gold2);text-align:center;text-shadow:0 0 24px rgba(232,181,74,.4)}
.total small{font-size:14px;color:var(--dim);font-weight:400}
/* ── 列表 ── */
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:none}
.li>div:first-child{flex:1;min-width:0}   /* v1.38f：名字区可收缩，防止按钮被挤压导致文字溢出 */
.scroll-y{max-height:300px;overflow-y:auto;overflow-x:hidden;padding-right:2px}   /* v1.38g：长列表滚动（仅纵向，避免横向滚动条遮挡右侧按钮） */
.shopR{width:76px;accent-color:var(--gold);cursor:pointer;touch-action:none}     /* v1.38k：商店数量拖动条（v1.38o：防移动端滚动抢占致"一拖到底"） */
.scroll-y::-webkit-scrollbar{width:6px}
.scroll-y::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.tier{font-size:10px;padding:1px 5px;border-radius:3px;margin-left:6px}
.t-普通{background:#3c4266;color:#aab0d8} .t-精良{background:#2f6046;color:#8fe9b2}
.t-稀有{background:#2e4a66;color:#8cc6f2} .t-史诗{background:#4a3a70;color:#c8aef5}
.t-传说{background:#6b4520;color:#f5bc74}
/* ── 日志 ── */
.log{font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.log:last-child{border-bottom:none}
.log .t{color:var(--dim2);margin-right:8px}
.log.ok{color:var(--green)} .log.bad{color:var(--red)} .log.gold{color:var(--gold)}
/* ── 弹层 ── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.on{display:flex}
#modal .box{background:linear-gradient(165deg,#2b2f52,#232744);border:1px solid #4a5080;border-radius:12px;padding:20px;max-width:340px;width:100%;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.55);animation:popIn .2s cubic-bezier(.2,.8,.3,1.1)}
#modal .d100{font-size:52px;font-weight:700;margin:12px 0}
.tabpage{display:none} .tabpage.on{display:block;animation:tabIn .22s ease-out}
/* v1.47：长页面双列卡片流（宽屏两列、减少滚动；窄屏 / 手机自动回退单列） */
.twocol{column-count:2;column-gap:12px}
.twocol>.card{break-inside:avoid;-webkit-column-break-inside:avoid}
.twocol>.card.span2{column-span:all;-webkit-column-span:all}   /* v1.48b：通栏卡（今日健康评分） */
@media(max-width:860px){.twocol{column-count:1}}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}   /* v1.35 微交互 */
.float-txt{position:fixed;left:50%;top:36%;transform:translateX(-50%);font-size:26px;font-weight:700;pointer-events:none;z-index:500;text-shadow:0 2px 14px rgba(0,0,0,.7);animation:floatUp 1s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,14px) scale(.8)}18%{opacity:1;transform:translate(-50%,0) scale(1.06)}100%{opacity:0;transform:translate(-50%,-48px) scale(1)}}
@keyframes numPop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
.total.pop{animation:numPop .32s ease}   /* v1.35 打卡反馈 */
.celebrate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:600;animation:celeFade 2.3s ease forwards}
.celebrate-inner{text-align:center;animation:celeZoom .75s cubic-bezier(.2,.8,.3,1.2)}
.celebrate-ico{font-size:64px;filter:drop-shadow(0 0 30px rgba(232,181,74,.9))}
.celebrate-t{font-size:28px;font-weight:800;color:var(--gold2);text-shadow:0 0 30px rgba(232,181,74,.8);letter-spacing:5px;margin-top:6px}
.celebrate-s{font-size:15px;color:var(--gold);margin-top:4px}
@keyframes celeZoom{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes celeFade{0%,72%{opacity:1}100%{opacity:0}}
#modal .box.gold-glow{animation:popIn .2s cubic-bezier(.2,.8,.3,1.1),goldPulse 1.5s ease}
@keyframes goldPulse{0%,100%{box-shadow:0 14px 44px rgba(0,0,0,.55)}50%{box-shadow:0 0 60px rgba(232,181,74,.6),0 14px 44px rgba(0,0,0,.55)}}   /* v1.35 时刻演出 */
/* v1.35：委托 emoji 迷你动画（目标移动 → 武器突进 → 命中 → 结算文本） */
.qanim{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:550;background:rgba(10,12,26,.6);animation:qanimBg 2.5s ease forwards}
.qanim-stage{position:relative;width:min(340px,82vw);height:130px;overflow:hidden}
.qanim-target,.qanim-weapon,.qanim-hit,.qanim-fall{position:absolute;top:42px;font-size:46px}
.qanim-target{left:50%;transform:translateX(-50%)}
.qanim-weapon{left:0;top:48px;font-size:36px;opacity:0}
.qanim-hit{left:50%;transform:translateX(-50%) scale(.3);opacity:0;font-size:42px;top:38px}
.qanim-fall{left:50%;transform:translateX(-50%);opacity:0;top:48px;font-size:40px}
.qanim-text{font-size:18px;font-weight:700;letter-spacing:1px;opacity:0;animation:qText 2.5s ease forwards;text-align:center;padding:0 16px}
.qanim.win .qanim-text{color:var(--gold2)}
.qanim.lose .qanim-text{color:var(--red)}
.qanim.win .qanim-target{animation:qTarget 2.5s ease forwards}
.qanim.lose .qanim-target{animation:qTargetFlee 2.5s ease forwards}
.qanim .qanim-weapon{animation:qWeapon 2.5s ease forwards}
.qanim.win .qanim-hit{animation:qHit 2.5s ease forwards}
.qanim.win .qanim-fall{animation:qFall 2.5s ease forwards}
@keyframes qanimBg{0%{opacity:0}10%{opacity:1}84%{opacity:1}100%{opacity:0}}
@keyframes qTarget{0%{left:34%;opacity:0}12%{opacity:1}24%{left:66%}36%{left:42%}48%{left:58%}56%{left:50%;opacity:1}60%{opacity:0}100%{left:50%;opacity:0}}
@keyframes qTargetFlee{0%{left:34%;opacity:0}12%{opacity:1}24%{left:66%}40%{left:44%}52%{left:60%}66%{left:50%;opacity:1}100%{left:130%;opacity:0}}
@keyframes qWeapon{0%,26%{left:4%;opacity:0;transform:rotate(0)}32%{opacity:1}52%{left:44%;opacity:1;transform:rotate(10deg)}58%{left:46%;opacity:1}64%{opacity:0}100%{left:46%;opacity:0}}
@keyframes qHit{0%,53%{opacity:0;transform:translateX(-50%) scale(.3)}58%{opacity:1;transform:translateX(-50%) scale(1.5)}78%{opacity:0;transform:translateX(-50%) scale(2)}100%{opacity:0}}
@keyframes qFall{0%,58%{opacity:0}64%{opacity:1}100%{opacity:1}}
@keyframes qText{0%,70%{opacity:0}82%{opacity:1}100%{opacity:1}}
/* ── 开场 ── */
#intro{position:fixed;inset:0;background:radial-gradient(900px 520px at 50% 0%,#2c3054 0%,#1a1c30 72%);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px}
#intro.hide{display:none}
.intro-box{text-align:center;max-width:330px;width:100%}
.intro-box h1{font-size:21px;color:var(--gold2);margin-bottom:22px;letter-spacing:2px;font-weight:700;text-shadow:0 0 26px rgba(232,181,74,.45)}
.intro-box .sub{font-size:13px;color:var(--dim);line-height:1.9;margin-bottom:4px}
#nameInput{width:100%;padding:13px;margin:20px 0 14px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;color:var(--txt);font-size:16px;text-align:center;font-family:inherit;letter-spacing:1px}
#nameInput:focus{outline:none;border-color:var(--gold)}
#nameInput::placeholder{color:var(--dim2);letter-spacing:0}
.intro-box .btn{width:100%;padding:12px;font-size:15px}
.intro-box .tip{font-size:11px;color:var(--dim2);margin-top:14px;line-height:1.7}
.hud-name{font-weight:700;color:var(--gold2);font-size:16px;letter-spacing:.5px}
/* ── 通用弹窗 ── */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
#dlg.on{display:flex}
.dlg-box{background:linear-gradient(165deg,#2b2f52,#232744);border:1px solid #4a5080;border-radius:12px;padding:18px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 14px 44px rgba(0,0,0,.55);animation:popIn .2s cubic-bezier(.2,.8,.3,1.1)}
.dlg-box.dlg-wide{max-width:600px;max-height:92vh}   /* v1.56b：宠物详情等长内容弹窗——加宽加长 */
.dlg-title{font-size:16px;color:var(--gold);margin-bottom:12px;font-weight:600;text-align:center}
.dlg-msg{font-size:14px;line-height:1.8;color:var(--txt)}
.dlg-btns{display:flex;gap:8px;margin-top:16px;justify-content:center}
.dlg-btns .btn{flex:1;text-align:center}
/* ── 委托详情 ── */
.qd-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.qd-row:last-child{border-bottom:none}
.qd-row span{color:var(--dim)}
.qd-row b{color:var(--txt)}
.qd-desc{font-size:13px;line-height:1.8;color:var(--dim);background:linear-gradient(160deg,#2e3254,#272b4a);border:1px solid #3a3f68;border-radius:8px;padding:10px;margin:10px 0}
.qd-mat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.qd-rate{text-align:center;font-size:34px;font-weight:700;color:var(--gold2);margin:8px 0;text-shadow:0 0 24px rgba(232,181,74,.4)}
.qd-rate small{font-size:13px;color:var(--dim);display:block;font-weight:400}
@media(min-width:700px){ #tabs button{flex:none;padding:10px 22px;font-size:13px} }
@media(max-width:700px){   /* v1.38：手机底部导航（拇指可达）；v1.57：改为横向滑动栏——一屏约 5 个、图标+文字、当前页自动滚入视野 */

function monthEventExpired(){
  return false;    // v1.48e：整月有效——截止当月最后一天 23:30（跨月由 key 轮换自然作废，此函数保留供 UI 语义）
}
function monthEventNow(){                  // v1.48f：Lv1（新号）即解锁——不再有 Lv2 门槛
  const mk = todayStr().slice(0,7);
  const me = S.monthEvent;
  if(!me || me.key !== mk) return null;    // 未生成（tick 会生成）
  const ev = MONTH_EVENTS[+mk.slice(5,7) - 1];
  return {ev:ev, cnt:me.cnt, done:me.done, expired: me.done ? false : monthEventExpired()};
}
function monthEventTick(){                 // v1.48f：Lv1 起全员解锁；每月 1 号生成（换月自动轮换；上月未完成自然作废）
  const mk = todayStr().slice(0,7);
  if(S.monthEvent && S.monthEvent.key === mk) return;
  S.monthEvent = {key:mk, cnt:0, done:false};
  const ev = MONTH_EVENTS[+mk.slice(5,7) - 1];
  addLog("🌍 本月世界事件：「"+ev.n+"」——"+ev.desc+"　截止当月最后一天 23:30（奖励：金币 + 材料 + 当月称号）","gold");
}
function monthEventAdd(type, n){           // 进度累加 + 达成发奖
  const cur = monthEventNow();
  if(!cur || cur.done || cur.expired) return;
  if(cur.ev.t !== type) return;
  S.monthEvent.cnt += (n || 1);
  if(S.monthEvent.cnt >= cur.ev.need){
    S.monthEvent.done = true;
    const ev = cur.ev;
    const g = Math.round(ev.gold * lvGoldMul());
    S.money += g;
    for(const mk in ev.mats){
      const r = ev.mats[mk];
      S.mats[mk] = (S.mats[mk] || 0) + r[0] + Math.floor(Math.random() * (r[1] - r[0] + 1));
    }
    if(!S.timTitles) S.timTitles = {};
    const until = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 1).getTime();   // 下月 1 日 00:00（当月轮换）
    S.timTitles[ev.title] = Math.max(until, S.timTitles[ev.title] || 0);
    addLog("🌍 世界事件「"+ev.n+"」达成！+"+fmtMoney(g)+"　称号「"+ev.title+"」（本月有效）","gold");
    floatText("🌍 世界事件达成！", "var(--gold2)");
  }
  save();
}

  "讨伐石魔像":"废弃神殿的守卫苏醒了。魔像刀枪不入，得找它的核心。",
  "黑市追缉":"一张伪造通行证的画影图形。混进黑市，把他揪出来。",
  "猎杀双头狮鹫":"双头狮鹫叼走了牧场的种马。两颗脑袋，得同时对付。",
  "古龙遗骸采集":"荒谷里搁着一具巨龙骨架。龙鳞龙骨都是宝物——但野兽也盯着。",
  "深渊裂隙调查":"地面裂开一道深不见底的口子。垂下绳索探一探，别多看下面。",
  "潜入敌国要塞":"要塞守备森严。乔装、翻墙、取得布防图——不能惊动一个人。",
  "天空塔试炼":"浮空塔的试炼只对强者开放。塔灵出的题，从来没有简单的。",
  /* ── Lv5 ── */
  "王城保卫战":"王城告急，所有冒险者被征召守城。这一战，退无可退。",
  "采集星陨残片":"一颗流星坠进了禁地。趁残片还热乎，抢在别人前面取回来。",
  "元素领主讨伐":"元素领主在火山口筑起了领域。踏进它的地盘，就是与整个自然为敌。",
  "护送圣者远行":"一位圣者要横穿大陆去朝圣。一路上，觊觎他的人可不少。",
  "弑龙者":"悬赏榜上最显眼的一行字。屠龙，或者被龙屠——公会不负责第二种。",
  "圣兽驯服":"传闻中的圣兽现身雪原。想要它低头，先证明你值得。",
  "猎杀远古巨狼":"狼王的个头比马还大。它记得每一个伤过它族群的猎人。",
  "禁咒书夺回":"一册禁咒书被人从塔里偷走。咒法一旦念出来，就来不及了。",
  "讨伐九头蛇":"九头蛇盘踞在湖底。砍掉一个头长出两个——先想清楚再动手。",
  /* ── v1.42 龙种委托 ── */
  "狩猎火龙":"火龙把整条山脊烧成了焦土。公会的赏格贴满全城——但没人敢先揭。",
  "驱赶绿龙":"绿龙在边境放牧毒雾，牧村的牲畜一头接一头倒下。它不需要猎杀，只需要呼吸。",
  "与白龙探讨魔法":"白龙答应在冰湖上见一面。它不是来打架的——它想知道，人类的魔法学到了哪一步。",
  "金龙宝藏的谈判":"金龙盘在山的金库上。它不谈刀剑，只谈生意——但要谈拢，先得让它看得起你。",
  "平息蓝龙之怒":"雷暴在海上盘了七天。船长们说，那是蓝龙的怒吼——总得有人去把话说完。",
  "追踪黑龙的阴翳":"夜里开始有影子脱离身体，自己走动。追踪猎人说，那是黑龙路过的地方。",
  /* ── v1.45 恶魔 / 魔鬼 / 中立种族 ── */
  "镇压恶魔裂隙":"地面裂开一道新的小口子，黑雾里有东西在往外爬。趁它还是小口子，把它按住。",
  "猎杀深渊恶魔":"深渊领主封印之后，仍有一头恶魔漏了出来。它在山里烧了三座村庄——再晚，就是第四座。",
  "魔鬼的谈判":"一位魔鬼驻使递来谈判邀请，落款处墨迹未干。公会研究了一夜：可以谈，但遗嘱先写好。",
  "血战遗迹考察":"魔鬼与恶魔的古战场在荒野裂开。两界的兵器散落一地——公会说：只许看，不许碰。",
  "迷路的仙灵":"一只仙灵在城郊迷了路，翅膀上的光一天比一天暗。把它送回林间，它会记得你的善意。",
  "净化亡灵谷":"亡灵谷的雾气越来越浓，村里的灯一盏盏熄了。去把源头清了——让大家重新睡得着觉。",
  /* ── v1.45b：委托链·血战与地狱 / 仙灵与亡者 ── */
  "地狱钟声":"钟声从地底传来，一遍，又一遍。魔鬼如约而至，契约摊开在桌上——最后一步，由你决定它兑现的是报酬还是账单。",
  "仙灵的谢礼":"仙灵在林地深处回头，掌心的光尘照亮一条从没有人走到过的小径。它说：跟我来。",
  "魂灯引渡":"亡灵谷静下来了，可谷口的灯还亮着。守谷人说：夜里提上灯，把它们一个个送过河——它们就能真正睡下。",
  /* ── v1.57：六条种族委托链 ── */
  "独眼巨人的石碑":"独眼巨人死后，族人在崖边立了块石碑——刻痕歪斜，却用力极深。公会说：把它拓下来，我们想知道它到底在记恨什么。",
  "毒沼腹地·踏勘":"沼泽的毒雾到了这片就再不肯散。探路的人回来说，雾里有条足印，比鳄鱼还大上三圈——先画张图，别惊动它。",
  "亡者回廊·踏勘":"墓道往下再走一层，两侧石壁上刻的全是同一张脸。老人说这叫回廊——死者认路的地方。去看看它通向哪儿。",
  "亡者回廊·镇魂":"回廊尽头传来敲击声，一下，又一下，像有人在里面数日子。把安魂的灯点进去——让数日子的那位，停下来。",
  "幽都渡口":"渡口没有船，只有一盏灯和一杆秤。摆渡人要一枚灵魂币才肯划桨——过河之后，请把身后的门带上。",
  "硫磺深渊·探井":"地狱钟声之后，井底裂开了第二道口子。硫磺味顺着风往上飘——先探清深浅，再决定要不要加盖子。",
  "地狱熔炉":"熔炉还在烧，炉边坐着一位记账的魔鬼。它说这炉子从没熄过——除非有人肯替它把炉膛里的名字念完。",
  "泰坦之心":"泰坦遗骸的胸腔里，那颗心还在跳——很慢，慢到不像活着，却也不像死了。公会想知道：唤醒它，是福还是祸。",
  "沼心巨蟒":"踏勘画回的那张图上，足印绕了七圈，终点是一处塌陷的沼心。巨蟒盘在那里，鳞片下压着半座沉村。",
  "深海船骸":"海图上的沉船点，今年又往下沉了三十尺。打捞队说船舱里有光——海底的光，从来不是好兆头。",
  "海渊之主":"船骸的裂缝里伸出一条触须，把探照灯卷走了。船长说那只是它的手指——它的头，还没浮上来过。",
  "雪原巡礼":"圣兽留下的旧蜕在雪地里发光。长老说，沿着它蜕皮的路线走完一圈，才配说自己见过雪原。",
  "深渊领主封印":"深渊领主即将苏醒。凑齐封印的材料，这一次要把它钉死。",
  "潜入深渊神殿":"神殿里没有活人，只有忠诚的守卫。悄悄进去，悄悄地走。",
  "时空裂隙修复":"一道裂隙撕开了时空。补它，赌上你的一切。",
  /* ── v1.41 I1：委托链节点 ── */
  "迷雾灯塔·引航":"海岸边的灯塔熄了十几年，夜航的船撞沉了好几艘。守灯人老了，求你上去点亮它——就当为夜里回家的人引个路。",
  "迷雾灯塔·残焰":"灯是点着了，可焰芯发绿，撑不过三天。守灯人说雾里有老灯油——但他自己再没进去过。",
  "迷雾灯塔·重燃":"灯塔底下压着一道旧封印，灯一旦重燃，那东西就会醒。守灯人把钥匙交给你：点灯，还是放它出来？",
  "皇家图书馆·寻书":"王都大图书馆丢了一册书，馆长讳莫如深，只说「它会自己走回去」。先找找书架之间。",
  "皇家图书馆·密档":"书架会走路，书也会。密档室的钥匙藏在会走路的书里——追它，别把书弄坏了。",
  "皇家图书馆·真相":"密档道出一个事实：图书馆本身是座封印。读完真相的人，要么闭嘴，要么接替守书人的位子。",
  "星界信使·初见":"天空塔之上来了一位「信使」，说要找人送信。信上的字会动——塔灵劝你慎重。",
  "星界信使·传讯":"信要送往星界另一头。你要做的只是别在半路把信读出来——信使的嘱咐，字字当真。",
  "星界信使·回响":"回信到了。信使说，听过回响的人，这一生都会记得星空的声音——记得就好，别回答。",
  "深渊回响·远征":"领主封印之下传来了回响——深渊深处还有更古老的东西在翻身。远征队需要一个人带头。",
  /* ── v1.41 I4：追踪类 / 资源指定类 ── */
  "深林鹿王追踪":"一头罕见的白鹿现身深林，行踪不定。跟住它三天——传说它带路的地方，长着最安静的草药。",
  "海怪追踪":"近海有东西掀翻了渔船。公会要三天的观测记录：跟住它、记下它，别被它跟上。",
  "风暴之眼的守望":"风暴眼上空的异象将持续三天。站在远处的灯塔守望它——记录，别靠近。",
  "药商的特需":"药商想要新鲜的止血草配药。正好——顺路采一趟带回来，他加价收。",
  "星图师的需求":"星图师校准星盘需要一点星尘。你若手里有现货，他愿意出双倍工钱。",
  "龙血商人的订单":"龙血黑市紧俏。商人明说了：带现货来，报酬翻倍；没货，就按普通价走。",
  /* ── 传奇事件 / 世界级事件 ── */
  "屠龙传说":"古龙盘踞在雪峰之巅，整个北境都在它的阴影下。传说屠龙者将获得龙的认可，或者成为它的晚餐——这一次，轮到你上山了。",
  "星界远征":"星图上出现了一条通往界外的航线。世界之外有什么？没人知道——但船已经备好了。",
  "公会大师试炼":"公会的最高认可只授予最强的冒险者。试炼的考官是历代大师的幻影，他们从不留情。",
  "世界树种子":"世界树的种子埋在腐土里千百年。找到它、唤醒它，让那棵传说之树重新撑起天空。",
  "魔神封印":"古老的魔神在封印下翻了个身。补强封印需要深渊的钥匙——拿回它，趁一切还来得及。",
  "时间回廊":"时间在废墟里打了一个结。走进去的人，会遇到过去的自己。",
  "陨星核心":"天上掉下来的东西总有些门道。那颗陨星的内核，锻得出世间最锋利的武器。",
  "龙神契约":"龙神在等一个配得上契约的人。签下它，你与龙族的命运就绑在了一起，生死与共。",
  "虚空王座":"虚空的尽头有一张空着的王座。坐上去，或者被它吞噬——这是唯一的规则。",
  "创世碎片":"世界诞生时碎掉的那一片，终于浮出了水面。得到它的人，能改写这个世界的一条规则。",
  "万龙之宴":"龙族千年一次的邀约，只发出十张请柬。赴宴者要与群龙同席竞逐。",
  "深渊回响":"深渊最深处传来了呼唤，用的是你自己家乡的方言。答应它，还是下去看看？",
  /* ── v1.57：三条种族链尾的传奇事件 ── */
  "亡者君王":"回廊尽头的敲击声停了。片刻后，一个戴着旧王冠的身影从阴影里站起来——它守着这片亡者的国土，已经等了太久一个能对话的活人。",
  "硫磺王座":"熔炉里的名字念完了，炉火忽然安静下来。记账的魔鬼合上账簿，躬身让开通路——王座上的那位，想亲自和你谈谈价码。",
  "泰坦苏醒":"心跳声越来越快，直到整座墓场都跟着震动。泰坦撑起身躯，从上往下看你——它开口说的第一个词，是上个时代的语言。",
"溪畔垂钓":"银鳞河的水声里藏着整条河的馈赠。老渔夫说，心静的人才能钓上肥美的河鱼。",
"掏取岩蜂巢":"野蜂在崖壁的岩缝里筑了巢。蜂蜜是酒馆的硬通货——只要你能躲过那些刺。",
"驱赶乌鸦群":"黑羽的鸦群赖在谷仓顶上不肯走。清晨的雾气未散，正是它们昏昏欲睡的时候。",
"猎捕肥田鼠":"秋收后的田里，肥硕的田鼠正在囤粮。农人们悬赏：一只田鼠，一杯麦酒。",
"夜巡麦田":"稻草人之间总有窸窣的声响。入夜后的麦田属于野狗与阴影——带上一把火把。",
"夜猎林枭":"老林深处传来林枭的咕声。它的羽毛是制弓的好料，但夜里的它，眼睛比你亮。",
"矿脉勘察":"矮人勘探队留下的旧图上，标记着一条被遗忘的矿脉。带上锤子，去敲开那些沉默的岩石。",
"淘洗河沙":"河湾的沙里混着细碎的石英。淘金者说：耐心些，河水从不辜负肯弯腰的人。",
"讨伐鸦人斥候":"鸦人的斥候游荡在商道旁，用粗麻袋洗劫落单的旅人。公会悬赏它们的羽饰。",
"秘银矿脉开采":"矮人使节带来了消息：老矿道深处发现了秘银的痕迹。这份工作的报酬里，包含他们罕见的敬意。",
"沼泽蛇怪狩猎":"莱姆沼泽的蛇怪把商路变成了一条石化雕像长廊。公会的告示写得很简单：带一面镜子，或者别眨眼。",
"石门符文拓印":"苔藓之下，古老的符文仍在低语。法师塔想知道：是谁在沉睡之前，留下了这扇门。",
"暮色狼群清剿":"入秋之后，狼群开始在黄昏时逼近村落。猎人们说，它们今年比往年更饿。",
"晨露药圃修剪":"药圃里的晨露花长得太野了。老药师拄着拐杖守在田边，看着每一个学徒的手。",
"风车磨坊加固":"磨坊主的风车在昨夜的大风里呻吟了一整晚。趁下一场风来之前，把它修好。",
"古代渡槽疏通":"帝国的渡槽早已干涸，青石缝里塞满了三百年的落叶与传说。疏通它，让水声重新响起。",
"枭熊巢穴讨伐":"北坡的枭熊袭击了三个牧羊人。它的巢在悬崖的背风处——趁它夜猎离巢时动手。",
"星陨坑探查":"一颗星坠进了东边的荒地，烧焦的土里混着细碎的星尘。法师说：去看看，但别碰发光的东西。",
"游侠哨站补给护送":"边地的游侠哨站三个月没收到补给了。这一车干粮和箭矢，要走四十里野路。",
"鸦巢悬崖索降":"鸦人在悬崖上筑了巢，偷来的货物堆得像个集市。你需要一根足够长的绳子，和足够的胆量。",
"半兽人营地侦察":"半兽人在北谷扎了营，篝火彻夜不熄。公会要一张营地布防图——摸进去，再活着出来。",
"狩获沼泽巨蟒":"放贷人的骡队在沼泽边丢了两匹牲口。巨蟒的鳞皮值钱，前提是你能完整地把它带回来。",
"月下狼嚎追踪":"月圆之夜，狼嚎从未名森林传来。猎人们说那不是狼——是比狼更古老的东西在唤月。",
"采集沼泽泥炭":"沼泽的泥炭是取暖的好料，也是止血草最喜欢的温床。蹚过去——小心别陷进去。",
"矿工失踪搜救":"三个矿工在东岭矿道里失了踪。家属的哭声比矿灯更让人喘不过气。快一点。",
"破晓巡林":"天光初亮时，护林人沿着林线走一圈，查看夜里的足迹。这是份安静的差事——通常来说。",
"失踪商队搜寻":"商队连同货物消失在了迷雾谷。定金已经收了——剩下的事，就是把人和货找回来。",
"虚空裂谷取样":"北境的虚空裂谷仍在缓慢生长。法师塔要一份「活的」样本——报酬丰厚，活着回来更重要。",
"石化蜥蜴巢穴":"传说荒原之下的巢穴里睡着石化蜥蜴。它的眼睛能换一栋房子，可惜前提是——你还得能眨眼睛。",
"被遗忘的圣坛":"旧神被遗忘之后，圣坛无人打理。考古学会想知道：祭坛上那枚符文石为什么还在发烫。",
"猎杀双足飞龙":"双足飞龙在峡谷筑巢后，商队不得不绕行三天。王的悬赏贴了整整一年——今天终于列入了你的任务栏。",
"秘银矿脉深掘":"浅层的秘银已经采尽。矿工会付双倍工钱，请你护送他们深入那条发着蓝光的矿道。",
"星穹巡礼":"星界之门每十九年开启一次。王庭委托最勇敢的冒险者：去星之彼端走一遭，带回一粒星的尘埃。",

/* v1.41 I1/I2：区域进入门槛（委托解锁 / 公会等级 / 等级）——返回 null 可进，否则为原因文案
   v1.60：7 处「深处」双门槛按两条线的实际到达时点重排为 C/A/S 共绑——
     晨光/午间/黄昏·深处 = Lv3 + C（两条线均约第 22~30 天）
     星夜/废弃矿道·深处 = Lv4 + A（均约第 47~57 天）
     腐化/虚空裂痕·深处 = Lv5 + S（终段，S 第 ~100 天为实际门槛）
   原 Lv3+D / Lv4+C / Lv4+B 中公会线（D12/C22/B30）全部早于等级线，等效单门槛；虚空裂痕地表 Lv3 → Lv4 */
function regionGate(r){
  if(r.unlock && !(S.doneQuests && S.doneQuests[r.unlock.quest])) return "需完成委托「"+r.unlock.quest+"」";
  if(r.g !== undefined && guildIdx() < r.g) return "需公会 "+CFG.guildName[r.g]+" 级";
  if(r.lv && S.lvIdx < r.lv - 1) return "等级不足（Lv"+r.lv+" 开放）";
  return null;
}

/* 当前「游戏日」（YYYY-MM-DD）。日界线为每天早上 6 点：
   00:00~05:59 视为前一天（熬夜时段不提前跨天），06:00 起进入新的一天 */
function fmtDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayStr(d){
  d = d || new Date();
  if(d.getHours() < CFG.dayCutoffHour) d = new Date(d.getTime() - 86400000);   // 6 点前 → 算前一天
  return fmtDate(d);
}
function hhmm(d){ return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
/* ── v1.28：局外时钟 / 打卡时间窗工具 ── */
const MEAL_NAMES = ["早餐","午餐","晚餐"];
function minOfDay(d){ d = d || new Date(); return d.getHours()*60 + d.getMinutes(); }
function winRange(win){
  if(typeof win[0] === "number") return [win[0], win[1]];   // v1.41c：已算好的分钟区间（节日扩展窗口）
  const a = win[0].split(":"), b = win[1].split(":");
  return [+a[0]*60 + +a[1], +b[0]*60 + +b[1]];
}
/* v1.41c：支持跨日窗口（b > 1440 时次日 00:00~b-1440 仍在窗内——节日入睡卡延至次日 00:30） */
function inWindowNow(win, d){
  const r = winRange(win); const c = minOfDay(d);
  if(r[0] <= c && c <= r[1]) return true;
  return r[1] > 1440 && c <= r[1] - 1440;
}
/* v1.41c：节日窗口扩展——入睡/起床打卡尾部 +1 小时、三餐前后各 +30 分钟（假期区间见 FESTIVAL_RANGES） */
function winStr(r){        // 分钟区间 → "21:00–00:30"（跨日显示次日时刻）
  function f(m){ m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
  return f(r[0]) + "–" + f(r[1]);
}
function taskWinNow(i){
  const w = CFG.taskWindows && CFG.taskWindows[i];
  if(!w) return null;
  const r = winRange(w);
  return (isFestival() && (i === 0 || i === 1)) ? [r[0], r[1] + 60] : r;
}
/* v1.50：00:00 后补打卡锁定（仅无窗口项；有窗口项由各自窗口把关——节日入睡跨日窗口照常可用）。
   与服务端 _midnight_lock 完全对齐。 */
function midnightLocked(i){
  if(new Date().getHours() >= CFG.dayCutoffHour) return false;
  return !(CFG.taskWindows && CFG.taskWindows[i]);
}
const MIDNIGHT_LOCK_MSG = "已经过了 00:00——昨日的打卡已锁定，不再接受补打。<br><br>早点休息，明天再来。";
function mealWinNow(idx){
  const r = winRange(CFG.mealWindows[idx]);
  return isFestival() ? [Math.max(0, r[0] - 30), r[1] + 30] : r;
}
function todPhase(d){        // v1.35：晨昏背景时段（night / dawn / day / dusk / evening）
  const m = minOfDay(d || new Date());
  if(m < 5*60 || m >= 22*60) return "night";
  if(m < 9*60)  return "dawn";
  if(m < 17*60) return "day";
  if(m < 19*60) return "dusk";
  return "evening";
}
function timePhase(d){       // 局外时段词（如「午后」）
  d = d || new Date();
  const m = minOfDay(d);
  if(m < 5*60) return "凌晨";
  if(m < 7*60) return "清晨";
  if(m < 9*60) return "早晨";
  if(m < 11*60) return "上午";
  if(m < 13*60) return "中午";
  if(m < 17*60) return "午后";
  if(m < 19*60) return "傍晚";
  if(m < 22*60) return "晚上";
  return "深夜";
}

function calcHealth(){

  CFG.multiTasks.forEach((t,i)=>{ s += Math.min(S.health.multi[i], t[2]) * t[1]; });

  if(sickToday()) S.health.score = SICK_LOCK_SCORE;   // v1.61：疗养圣所·病假 → 本日评分锁定 59

/* ── v1.19 辅助：健康加成上限 / 当月称号 / 公会设施 ── */
function heatBonus(){   // 安眠室：每累计 7 天早睡 → 健康加成 +1pp（加法，最高 +5pp；v1.40 由乘法改加法——原 ×1.05 满级仅 +1pp 无感）
  return Math.min(5, Math.floor((S.heatN||0)/7)) * 0.01;
}
function titleActive(name){   // 当月称号是否有效
  const until = S.timTitles && S.timTitles[name];
  return !!(until && Date.now() < until);
}
function titlePayBonus(){     // 当月称号报酬加成（作息守护者 / 公会中坚 各 +5%）
  let b = 0;
  if(titleActive("作息守护者")) b += 0.05;
  if(titleActive("公会中坚")) b += 0.05;
  return b;
}
function titleOwnBonus(){     // v1.41：永久称号收集加成——每 1 个 +1%，上限 +10%
  return Math.min(0.10, (S.titles || []).length * 0.01);
}
function dinnerBonus(){       // 酒馆料理（v1.41f4：原公会厨房）：前一日「完整吃三餐」→ 今日成功率 +2%（计入 E）
  const h = S.history.length ? S.history[S.history.length-1] : null;
  return !!(h && h.tasks && h.tasks[5]);
}

function successRate(q){
  const qi = (QUEST_LV[q[0]] !== undefined ? QUEST_LV[q[0]] : S.lvIdx);   // v1.30：基础率/上限按委托等级
  const name = q[0], diff = q[4];
  let B = CFG.sucBase[qi];
  // 难度修正（按委托等级覆盖）
  const ov = CFG.diffModByLv[qi+1] || {};
  let D = (diff in ov) ? (ov[diff]===null ? 0 : ov[diff]) : (CFG.diffMod[diff]||0);
  // 健康加成 = H × 0.2% × (1 + 装备健康上限) + 安眠室 pp + 称号 pp（v1.40：安眠室/称号由乘法改加法）
  const health = healthRateBonus();   // v1.38l：抽为函数（首页「昨日评分」处同源展示）
  // E = 武器 + 技能树·专注/生存 + 厨房（前一日三餐 +2%）
  let E = gearRate() + skillRate(q) + gearRateFor(q[1]);
  if(dinnerBonus()) E += 0.02;
  E = Math.min(CFG.eCap[qi], E);
  // 熬夜惩罚：前一日 23:30 前入睡未达标 → −15%（装备可减免 nightCut，减免封顶于惩罚本身，未熬夜不受益）
  const _fe = todayFestEff();                 // v1.41f：节日专属效果
  const lastSleep = S.history.length ? S.history[S.history.length-1].sleep : true;
  const N = (lastSleep || _fe.noSleepPenalty) ? 0 : Math.min(0, -0.15 + gearEffects().nightCut);   // 端午·驱邪安康：当日免除熬夜惩罚
  const cap = CFG.hardCap[qi], floor = CFG.floor[qi];
  const _meal = activeMeal();
  const _mealR = _meal ? (_meal.rate || 0) * (_fe.cookMul || 1) : 0;   // v1.41f：腊八·料理效果翻倍
  const _dLv = Math.max(0, S.lvIdx - qi), _delta = Math.min(0.36, _dLv * 0.12);   // v1.32：等级差修正（+12%/级，上限 +36%）
  const _nm = (diff === "噩梦") ? gearEffects().nightmare : 0;   // v1.32：噩梦难度成功率词条
  let r = Math.min(cap, Math.max(floor, B + D + health + E + N + _mealR + charmRate() + gearEffects().genesis + _delta + (S.rareNextRate||0) + _nm));   // 稀有事件·前辈指点（下一次委托 +5%）；v1.41 H6：创世之印独立通道（不计 E 上限）
  const _fest = (_fe.rate || 0) + ((_fe.rateTypes || {})[q[1]] || 0);   // v1.41f：节日专属（全委托 / 按委托类型，如清明·采集探索）
  return Math.max(0, Math.min(1, r + wolfRateBonus() + petBonus().rate + _fest));   // 宠物/节日加成：独立叠加（不受硬上限 / E 上限约束）
}

/* ── v1.28：成功率分解（委托详情展示；熬夜惩罚可见化）── */
function rateBreakdown(q){
  const qi = (QUEST_LV[q[0]] !== undefined ? QUEST_LV[q[0]] : S.lvIdx);   // v1.30：按委托等级
  const diff = q[4];
  const B = CFG.sucBase[qi];
  const ov = CFG.diffModByLv[qi+1] || {};
  const D = (diff in ov) ? (ov[diff]===null ? 0 : ov[diff]) : (CFG.diffMod[diff]||0);
  const health = healthRateBonus();   // v1.38l：与 successRate 同源
  let E = gearRate() + skillRate(q) + gearRateFor(q[1]);
  if(dinnerBonus()) E += 0.02;
  const Ecapped = Math.min(CFG.eCap[qi], E);
  const _fe = todayFestEff();   // v1.41f：节日专属效果（与 successRate 同源）
  const lastSleep = S.history.length ? S.history[S.history.length-1].sleep : true;
  const N = (lastSleep || _fe.noSleepPenalty) ? 0 : Math.min(0, -0.15 + gearEffects().nightCut);   // v1.38o：减免封顶于惩罚本身；端午·免除熬夜惩罚
  const _meal = activeMeal();
  const _dLv = Math.max(0, S.lvIdx - qi), _delta = Math.min(0.36, _dLv * 0.12);   // v1.32：等级差修正（+12%/级，上限 +36%）
  const _nm = (diff === "噩梦") ? gearEffects().nightmare : 0;   // v1.32：噩梦难度成功率词条
  return {B:B, D:D, health:health, E:Ecapped, eCut:E > CFG.eCap[qi], N:N, night:!lastSleep,
          mealR:_meal ? (_meal.rate||0) * (_fe.cookMul||1) : 0, rare:S.rareNextRate||0, charm:charmRate(), genesis:gearEffects().genesis, wolf:wolfRateBonus() + petBonus().rate, delta:_delta, nm:_nm,
          fest: (_fe.rate||0) + ((_fe.rateTypes||{})[q[1]]||0)};   // v1.41f：节日专属（全委托 / 按委托类型；详情分解展示）
}

/* v1.41：成功率区间配色（绿 ≥80% / 蓝 ≥60% / 黄 ≥40% / 红 <40%） */
function rateColor(r){ return r >= 0.8 ? "var(--green)" : r >= 0.6 ? "var(--blue)" : r >= 0.4 ? "var(--gold2)" : "var(--red)"; }
function rateBreakdownHtml(q){
  const b = rateBreakdown(q);
  const f = function(x){ return (x>=0?"+":"−") + Math.round(Math.abs(x)*100) + "%"; };
  const parts = [Math.round(b.B*100)+"% 基础"];

  if(b.mealR) parts.push(f(b.mealR)+" 料理");
  if(b.rare) parts.push(f(b.rare)+" 稀有加成");
  if(b.charm) parts.push(f(b.charm)+" 护符");
  if(b.genesis) parts.push(f(b.genesis)+" 创世之印");
  if(b.wolf) parts.push(f(b.wolf)+" 宠物");
  if(b.fest) parts.push(f(b.fest)+" 节日");
  if(b.nm) parts.push(f(b.nm)+" 噩梦");
  let h = '<div class="muted" style="font-size:11px;text-align:center;line-height:1.8">' + parts.join(" · ") + '</div>';
  if(b.night){
    const _nc = gearEffects().nightCut;
    h += '<div style="text-align:center;font-size:12px;color:var(--red);margin-top:2px">⚠️ 熬夜惩罚 ' + Math.round(b.N*100) + '%'
      + (_nc > 0 ? (b.N < 0 ? '（装备已减免 ' + Math.round(Math.min(_nc, 0.15)*100) + '%）' : '（装备已完全抵消）') : '') + '——昨夜未在 23:30 前入睡</div>';
  }
  return h;
}

/* 第一个材料是「主材料」，必定掉落；其余按品阶判定
   （传奇事件的材料为必得，走单独结算分支） */
function matDropRate(name){
  const tier = (M[name] && M[name][1]) || "普通";
  return CFG.matDrop[tier] !== undefined ? CFG.matDrop[tier] : 1;
}
function matGuaranteed(idx){ return idx === 0; }
function rollMat(idx, key){
  // 概率 = 基础品阶概率 + 宠物加成（独立加成，不参与常规公式；上限 100%）；v1.41f：万圣夜·掉率翻倍
  return matGuaranteed(idx) || Math.random() < Math.min(1, (matDropRate(key) + wolfMatBonus() + petBonus().mat) * (todayFestEff().matDropMul || 1));
}

function readCountNow(){
  if(S.histStats) return S.histStats.read || 0;            // 服务端全量计数（history 下发有截断）
  let c = 0; (S.history||[]).forEach(function(h){ const m = h.multi || []; c += (m[1] || 0); });
  return c;
}
function petReadNeed(n, stage){        // 该阶升阶所需阅读次数（null = 无成长要求）
  const L = PET_LINES[n]; if(!L || !L.readDriven) return null;
  return L.readNeed ? (L.readNeed[stage-1] !== undefined ? L.readNeed[stage-1] : null) : null;
}
function petGrowthTxt(n){              // 成长进度文案（阅读驱动 → 阅读次数）
  const L = PET_LINES[n], pd = (S.petData||{})[n];
  if(!L || !pd) return "";
  if(L.readDriven){
    if(pd.stage >= 3) return "阅读 "+readCountNow()+" 次（已满阶——变异看变异值）";
    return "阅读 "+readCountNow()+" / "+petReadNeed(n, pd.stage)+" 次";
  }
  const st = L.stages[pd.stage-1];
  return "成长 "+pd.growth+" / "+st.need;
}
function syncReadPets(){               // 阅读次数达标 → 自动进化（幂等；返回是否有变化）
  let ch = false;
  Object.keys(PET_LINES).forEach(function(n){
    const L = PET_LINES[n];
    if(!L.readDriven || (S.pets||[]).indexOf(n) < 0) return;
    const pd = (S.petData||{})[n]; if(!pd) return;
    const rc = readCountNow();
    let guard = 0;
    while(pd.stage < 3 && rc >= petReadNeed(n, pd.stage) && guard++ < 3){
      pd.stage += 1;
      const st = L.stages[pd.stage-1];
      addLog("🎉 宠物成长：「"+st.name+"」（累计阅读 "+rc+" 次）","gold");
      if(S.daily && S.daily.events) S.daily.events.push("🐾 宠物进化："+st.name);
      ch = true;
    }
  });
  return ch;
}

function petShowName(n){ return (S.petNick||{})[n] || n; }
function petMetaOf(n){
  let m;
  if(n === "小狼") m = S.wolf;
  else m = (S.petData||{})[n];
  if(!m) return null;
  if(m.mood === undefined) m.mood = 50;
  if(!m.gotDate) m.gotDate = todayStr();          // 老档迁移：从本版本起算羁绊
  if(m.ptDate === undefined) m.ptDate = "";
  if(m.ptCount === undefined) m.ptCount = 0;
  if(m.happyStreak === undefined) m.happyStreak = 0;
  if(!m.bondDone) m.bondDone = [];
  return m;
}
function petBondDays(n){
  const m = petMetaOf(n); if(!m) return 0;
  const d0 = new Date(m.gotDate + "T00:00:00"), d1 = new Date(todayStr() + "T00:00:00");
  return Math.floor((d1 - d0) / 86400000) + 1;
}
function petMoodLabel(v){ return v >= PET_MOOD_HAPPY ? "😊" : (v < PET_MOOD_LOW ? "😴" : "😐"); }
function petMoodTxt(v){ return v >= PET_MOOD_HAPPY ? "心情很好" : (v < PET_MOOD_LOW ? "有点蔫蔫" : "心情平静"); }
function petMoodDaily(sc, slept){                  // 心情日结算（现实作息驱动；只反映，不惩罚）
  const names = (S.pets||[]).slice();
  if(S.wolf) names.push("小狼");
  const seen = {};
  names.forEach(function(n){
    if(seen[n]) return; seen[n] = 1;
    const m = petMetaOf(n); if(!m) return;
    let dm = sc >= 90 ? 10 : (sc >= 60 ? 5 : -5);
    if(slept) dm += 5;
    m.mood = Math.max(0, Math.min(100, (m.mood || 50) + dm));
    m.happyStreak = m.mood >= PET_MOOD_HAPPY ? ((m.happyStreak || 0) + 1) : 0;
    if(m.happyStreak && m.happyStreak % 7 === 0){  // 连续 7 天 → 心意事件
      const gift = PET_WALK_GIFT[Math.floor(Math.random() * PET_WALK_GIFT.length)];
      S.mats[gift] = (S.mats[gift] || 0) + 1;
      const txt = PET_HEART_TXT.replace("{N}", petShowName(n));
      addLog("💗 " + txt, "gold");
      if(S.daily) S.daily.events.push("💗 心意事件：「" + petShowName(n) + "」");
    }
  });
}
function petBondTick(){                            // 羁绊里程碑（幂等；返回是否有变化）
  let ch = false;
  const names = (S.pets||[]).slice();
  if(S.wolf) names.push("小狼");
  const seen = {};
  names.forEach(function(n){
    if(seen[n]) return; seen[n] = 1;
    const m = petMetaOf(n); if(!m) return;
    const bd = petBondDays(n);
    PET_BOND_MILES.forEach(function(mile){
      if(bd >= mile && m.bondDone.indexOf(mile) < 0){
        m.bondDone.push(mile);
        const show = petShowName(n);
        if(mile === 365){
          S.items["羁绊印记"] = (S.items["羁绊印记"] || 0) + 1;
          addLog("💞 " + show + " 与你相伴了整整一年——它把亲手刻的「羁绊印记」放进了你的手心。", "gold");
        } else {
          addLog("💞 羁绊故事解锁：" + show + "（相伴 " + mile + " 天）——去宠物页读读它的故事吧。", "gold");
        }
        ch = true;
      }
    });
  });
  return ch;
}
function petPat(n){                                // 抚摸（每日 1 次/宠，+5 心情）
  const m = petMetaOf(n); if(!m) return;
  const used = m.ptDate === todayStr() ? (m.ptCount || 0) : 0;
  if(used >= 1) return showAlert("今天已经摸过它了——它说：'明天再来。'（每只每天 1 次）", "宠物互动");
  m.ptDate = todayStr(); m.ptCount = used + 1;
  m.mood = Math.min(100, (m.mood || 50) + 5);
  const pool = PET_PAT_TXT[n] || ["它开心地蹭了蹭你。"];
  const txt = pool[Math.floor(Math.random() * pool.length)];
  addLog("🤗 你摸了摸 " + petShowName(n) + "：" + txt, "ok");
  save(); render();
  dlg("🤗 " + petShowName(n), '<div class="dlg-msg" style="line-height:1.9">' + txt + '</div>'
    + '<div class="muted" style="font-size:11px;margin-top:6px">心情 +5（今日互动已完成）</div>', [{text:"好", cls:"pri", fn:function(){ showPetDetail(n); }}]);
}
function petWalkStart(n){                          // 派宠物去散步
  if(S.carryPet === n) return showAlert("它正陪你冒险呢，没空去散步。", "宠物散步");
  if(S.petWalk) return showAlert("「" + petShowName(S.petWalk.n) + "」还在外面散步——等它回来再说吧。", "宠物散步");
  S.petWalk = {n:n, ts:Date.now()};
  addLog("🐾 " + petShowName(n) + " 出发去散步了。", "ok");
  save(); render();
}
function petWalkSettle(){                          // 散步结算（到点即回；返回是否有变化）
  if(!S.petWalk) return false;
  if(Date.now() - (S.petWalk.ts || 0) < PET_WALK_MS) return false;
  const n = S.petWalk.n;
  S.petWalk = null;
  S.walkCount = (S.walkCount || 0) + 1;
  const show = petShowName(n);
  const pool = PET_WALK_TXT;
  let txt = pool[Math.floor(Math.random() * pool.length)].replace("{N}", show);
  let extra = "";
  if(Math.random() < 0.30){
    const gift = PET_WALK_GIFT[Math.floor(Math.random() * PET_WALK_GIFT.length)];
    const cnt = 1 + Math.floor(Math.random() * 2);
    S.mats[gift] = (S.mats[gift] || 0) + cnt;
    extra = "\n它还带回来了：" + gift + " ×" + cnt + "。";
  }
  const m = petMetaOf(n);
  if(m) m.mood = Math.min(100, (m.mood || 50) + 3);
  addLog("🐾 " + txt + extra, "ok");
  if(S.daily) S.daily.events.push("🐾 " + show + " 散步归来");
  return true;
}
function petTheater(){                             // 宠物小剧场（需 ≥2 只；返回是否有变化）
  const names = (S.pets||[]).slice();
  if(S.wolf) names.push("小狼");
  const uniq = names.filter(function(v, i, arr){ return arr.indexOf(v) === i; });
  if(uniq.length < 2) return false;
  const a = uniq[Math.floor(Math.random() * uniq.length)];
  let b = uniq[Math.floor(Math.random() * uniq.length)];
  while(b === a) b = uniq[Math.floor(Math.random() * uniq.length)];
  const pool = PET_THEATER_TXT;
  const txt = pool[Math.floor(Math.random() * pool.length)].replace("{A}", petShowName(a)).replace("{B}", petShowName(b));
  addLog("🎪 " + txt, "ok");
  return true;
}
function petNightTip(){                            // 深夜提醒（22:30~06:00，每天一次；返回是否有变化）
  if(!(S.pets||[]).length && !S.wolf) return false;
  const now = new Date(), hm = now.getHours() * 60 + now.getMinutes();
  if(!(hm >= 22 * 60 + 30 || now.getHours() < 6)) return false;
  if(S.petNightDate === todayStr()) return false;
  S.petNightDate = todayStr();
  const names = (S.pets||[]).slice();
  if(S.wolf) names.push("小狼");
  const uniq = names.filter(function(v, i, arr){ return arr.indexOf(v) === i; });
  const a = uniq[Math.floor(Math.random() * uniq.length)];
  const txt = PET_NIGHT_TXT[Math.floor(Math.random() * PET_NIGHT_TXT.length)].replace("{A}", petShowName(a));
  addLog("🌙 " + txt, "ok");
  return true;
}
function petDailyChecks(crossed){                  // 宠物日常总入口（挂 tick；返回是否有变化）
  let ch = false;
  if(petWalkSettle()) ch = true;
  if(petBondTick()) ch = true;
  if(crossed && Math.random() < 0.4 && petTheater()) ch = true;
  if(petNightTip()) ch = true;
  return ch;
}
function setPetNick(n, nick){                      // 昵称（≤6 字符；空 = 恢复本名）
  nick = (nick || "").trim();
  if(!S.petNick) S.petNick = {};
  if(!nick){
    delete S.petNick[n];
    addLog("它恢复了本名。", "ok");
  } else if(nick.length > 6){
    return showAlert("昵称最多 6 个字符。", "宠物昵称");
  } else {
    S.petNick[n] = nick;
    addLog("从现在起，它叫「" + nick + "」了。", "ok");
  }
  save(); render();
}
function petEsc(v){ return String(v).replace(/[<>&"]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;"}[c]; }); }
function petFestLine(n){                           // 今日节日问候：节日场景 + 宠物专属反应（v1.56c：每只宠物各不相同；无节日返回 ""）
  const f = (typeof festivalOf === "function") ? festivalOf() : null;
  if(!f || !f.name) return "";
  const scene = PET_FEST_SCENE[f.name] || ("「" + f.name.replace(/^\S+\s*/, "") + "」的气氛传遍了营地。");
  const pool = PET_FEST_REACT[n] || PET_FEST_REACT_DEFAULT;
  const react = pool[Math.floor(Math.random() * pool.length)].replace("{A}", petShowName(n));
  return "🎏 " + scene + "<br>🐾 " + react;
}

/* v1.55：宠物品阶——展示用（普通 < 精良 < 稀有 < 史诗 < 传说）；加成高低与品阶对应，
   低品阶低加成（史莱姆）、高品阶高加成（传奇事件伙伴）；小狼作为初始伙伴伴读全程，定为史诗。 */
function petRankOf(n){
  const L = PET_LINES[n];
  if(L && L.rank) return L.rank;
  if(n === "小狼") return "史诗";
  return "";
}
function petDataOf(n){
  if(!S.petData) S.petData = {};
  if(PET_LINES[n] && !S.petData[n]) S.petData[n] = {stage:1, growth:0, mutate:0, fedDate:"", fedCount:0,
    mood:50, gotDate:todayStr(), ptDate:"", ptCount:0, happyStreak:0, bondDone:[]};   // v1.56：陪伴字段
  return S.petData[n] || null;
}
function grantPet(n){
  if(!S.pets) S.pets = [];
  if(S.pets.indexOf(n) < 0) S.pets.push(n);
  if(PET_LINES[n]) petDataOf(n);
}
function petBonus(){               // v1.56c：只计算「携带中」的宠物加成（携带出门才生效）
  const b = {mat:0, rate:0, pay:0, exp:0};   // v1.58：sp（探索点/天）通道已整体移除
  const _cp = S.carryPet;
  if(_cp){
    const L = PET_LINES[_cp];
    if(L){
      const pd = petDataOf(_cp);
      if(pd){
        const c = pd.stage >= 4 ? L.mut : L.stages[pd.stage-1];
        b.mat += c.mat||0; b.rate += c.rate||0; b.pay += c.pay||0; b.exp += c.exp||0;
      }
    }
    const F = PET_FIXED[_cp];
    if(F){ b.mat += F.mat||0; b.rate += F.rate||0; b.pay += F.pay||0; b.exp += F.exp||0; }
  }
  const _pm = todayFestEff().petMul;   // v1.41f：情人节·宠物加成翻倍
  if(_pm){ for(const k in b) b[k] = b[k] * _pm; }
  return b;
}
function petBonusNote(n){          // 展示用加成文案
  if(n === "小狼"){                // v1.38o：小狼链加成文案（按当前形态）
    if(!S.wolf) return "";
    const w = WOLF_STAGES[S.wolf.stage]; if(!w) return "";
    const ps = [];
    if(w.mat) ps.push("材料+"+Math.round(w.mat*100)+"%");
    if(w.rate) ps.push("成功率+"+Math.round(w.rate*100)+"%");
    return ps.join("、");
  }
  const L = PET_LINES[n];
  if(L){
    const pd = petDataOf(n); if(!pd) return "";
    const c = pd.stage >= 4 ? L.mut : L.stages[pd.stage-1];
    const ps = [];
    if(c.mat) ps.push("材料+"+Math.round(c.mat*100)+"%");
    if(c.rate) ps.push("成功率+"+Math.round(c.rate*100)+"%");
    if(c.pay) ps.push("报酬+"+Math.round(c.pay*100)+"%");
    if(c.exp) ps.push("经验+"+Math.round(c.exp*100)+"%");
    return ps.join("、");
  }
  return (PET_FIXED[n] && PET_FIXED[n].note) || "";
}
function petFeedLeft(n){
  const pd = petDataOf(n); if(!pd) return 0;
  const used = (pd.fedDate === todayStr()) ? (pd.fedCount || 0) : 0;
  return Math.max(0, WOLF_DAILY_FEED - used);
}
function petFeedValue(n, foodName){    // v1.35：每只宠物口味不同；v1.55c：品阶营养——未列出材料按品阶给成长
  const L = PET_LINES[n]; if(!L) return {v:0, mv:0, refuse:false};
  const fv = L.favs ? L.favs[foodName] : undefined;
  const mv = L.muts ? L.muts[foodName] : undefined;
  const isAdv = !!WOLF_MUTATE_VALUE[foodName];         // 高级特殊材料（龙血 / 暗影草 / 龙心 / 世界树汁液）
  if(fv === 0) return {v:0, mv:0, refuse:true};        // 明确不吃（如绒球兽不吃肉）
  if(fv === undefined && !WOLF_FOODS.has(foodName)) return {v:0, mv:0, refuse:true};   // v1.56e：非基础材料的「本命材料」只有本宠能吃（如星核仅星界幼龙）
  const base = WOLF_FEED_VALUE[(M[foodName] || [])[1]] || 2;   // 客观营养：品阶越高成长越多（普通1/精良2/稀有4/史诗8/传说15——同小狼）
  return {
    v: L.readDriven ? 0 : Math.max((fv !== undefined) ? fv : 0, base),   // v1.55 阅读驱动不涨成长；口味与品阶取较高者
    mv: (mv !== undefined) ? mv : (isAdv ? 2 : 0),     // 未列出：高级材料 +2 / 普通食材 +0
    refuse: false
  };
}
function feedPet(n, foodName){
  const L = PET_LINES[n]; if(!L) return;
  const pd = petDataOf(n); if(!pd) return;
  if(!S.mats[foodName]) return;
  if(pd.stage >= 4) return showAlert("「"+L.mut.name+"」已是最终形态，不再需要喂食。", "宠物养成");
  if(!WOLF_FOODS.has(foodName) && !(L.favs && L.favs.hasOwnProperty(foodName)))
    return showAlert("「"+foodName+"」不能喂食——宠物吃：食材 / 草药、龙之精粹（龙血 / 龙心），以及各自的『本命材料』（见宠物详情 · ❤️ 喜爱）。", "宠物养成");
  if(petFeedValue(n, foodName).refuse)
    return showAlert("「"+foodName+"」不合「"+n+"」的口味——它不肯吃。", "宠物养成");
  if(petFeedLeft(n) <= 0)
    return showAlert("今天已经喂食 "+WOLF_DAILY_FEED+" 次了，明天再喂吧。", "宠物养成");
  if(L.readDriven && !petFeedValue(n, foodName).mv && pd.stage < 4){    // v1.55：阅读驱动宠物——普通食材不涨成长
    const rc = readCountNow();
    if(pd.stage >= 3) return showAlert("「"+L.stages[2].name+"」的成长已经完成——只需喂食高级特殊材料（龙血 / 暗影草 / 龙心 / 世界树汁液）积累变异值。", "宠物养成");
    return showAlert("「"+n+"」的成长来自你的阅读——普通食材不再增加成长值。<br><br>当前：阅读 "+rc+" / "+petReadNeed(n, pd.stage)+" 次<br><br>高级特殊材料仍可积累变异值（二阶起）。", "宠物养成");
  }
  if(L.readDriven && petFeedValue(n, foodName).mv && pd.stage < 2)    // v1.55：一阶不积累变异值——别浪费高级材料
    return showAlert("「"+L.stages[0].name+"」的变异值自二阶起才开始积累——现在喂「"+foodName+"」会被浪费。<br><br>先陪它读书吧：阅读 "+readCountNow()+" / "+petReadNeed(n, 1)+" 次。", "宠物养成");
  const need = L.stages[pd.stage-1].need;
  const _pv = petFeedValue(n, foodName);               // v1.35：按宠物偏好计算成长值 / 变异值
  const v = _pv.v;
  const mv = _pv.mv;
  S.mats[foodName]--; if(S.mats[foodName] <= 0) delete S.mats[foodName];
  pd.fedDate = todayStr();
  pd.fedCount = (pd.fedCount || 0) + 1;
  if(pd.growth < need) pd.growth += v;
  if(mv && pd.stage >= 2) pd.mutate = (pd.mutate || 0) + mv;   // 变异值自二阶起积累（同小狼：巨狼期）
  addLog("🐾 喂食「"+foodName+"」→ "+L.stages[pd.stage-1].name+" 成长 "+pd.growth+"/"+need+(pd.stage>=2?"　变异 "+(pd.mutate||0)+"/"+L.need:""), "ok");
  if(pd.stage < 3 && pd.growth >= need){
    pd.stage++; pd.growth = 0;
    const st = L.stages[pd.stage-1];
    addLog("🎉 宠物成长：「"+st.name+"」——"+petBonusNote(n), "gold");
    if(S.daily) S.daily.events.push("🐾 宠物成长："+st.name);
    save(); render();
    return showAlert("🎉 它长大了！<br><br>成为 <b>"+st.name+"</b>：<br>"+petBonusNote(n), "宠物成长");
  }
  save(); render();
  openPetFeed(n);
}
/* ── v1.38f：携带宠物（陪同委托获得少量成长值） ── */
function carryPetLabel(){
  const n = S.carryPet;
  if(!n) return "";
  if(n === "小狼") return S.wolf ? "🐺 " + WOLF_STAGES[S.wolf.stage].name : "";
  const L = PET_LINES[n], pd = (S.petData||{})[n];
  if(!L || !pd) return "";
  return L.icon + " " + (pd.stage >= 4 ? L.mut.name : L.stages[pd.stage-1].name);
}
function setCarryPet(n){
  if(S.carryPet === n){
    S.carryPet = "";                                       // 再点一次 = 看家（v1.56d：原「卸下」改称「看家」）
    addLog("🏠 "+n+" 留在营地看家——加成暂停。");
  } else {
    if(n === "小狼"){ if(!S.wolf) return; }
    else if((S.pets||[]).indexOf(n) < 0) return;
    S.carryPet = n;
    addLog("📌 "+n+" 开始陪同冒险——加成生效中，完成委托时还会获得成长值。");
  }
  save(); render();
}
/* 委托完成的成长值：成功 = 1 + 委托 Lv3+ 再 +1 + 困难/噩梦再 +1（上限 3）；失败 = 保底 1 */
function petQuestGain(q, ok, qi){
  const n = S.carryPet;
  if(!n) return "";
  const g = ok ? (1 + (qi >= 2 ? 1 : 0) + ((q[4] === "困难" || q[4] === "噩梦") ? 1 : 0)) : 1;
  if(n === "小狼"){
    if(!S.wolf || S.wolf.stage >= 4) return "";
    S.wolf.growth = (S.wolf.growth || 0) + g;
    return "🐺 "+WOLF_STAGES[S.wolf.stage].name+" 成长 +"+g;
  }
  const L = PET_LINES[n], pd = (S.petData||{})[n];
  if(!L || !pd || pd.stage >= 4) return "";
  if(L.readDriven) return L.icon + " " + L.stages[pd.stage-1].name + " 陪你完成了委托（成长来自阅读）";   // v1.55：阅读驱动不吃委托成长
  pd.growth = (pd.growth || 0) + g;
  return L.icon + " " + (pd.stage >= 4 ? L.mut.name : L.stages[pd.stage-1].name) + " 成长 +"+g;
}
function evolvePet(n){
  const L = PET_LINES[n]; const pd = petDataOf(n);
  if(!L || !pd || pd.stage !== 3) return showAlert("只有终极前一阶可以变异。", "宠物养成");
  if(!L.readDriven && pd.growth < L.stages[2].need) return showAlert("成长值尚未积满（"+pd.growth+" / "+L.stages[2].need+"）。<br><br>先用食材把成长值喂满吧。", "宠物养成");   // v1.55：阅读驱动只看变异值
  if((pd.mutate||0) < L.need) return showAlert("变异值尚未积满（"+(pd.mutate||0)+" / "+L.need+"）。<br><br>继续喂食高级特殊材料：龙血 / 暗影草 +5、龙心 / 世界树汁液 +12 变异值。", "宠物养成");
  showConfirm("「"+L.stages[2].name+"」气息翻涌，血脉深处仿佛有什么在苏醒——<br><br>确定让它变异为「"+L.mut.name+"」？", function(){
    pd.stage = 4; pd.growth = 0; pd.mutate = 0;
    addLog("🌌 宠物变异：「"+L.mut.name+"」——"+(L.mut.note||""), "gold");
    if(S.daily) S.daily.events.push("🐾 宠物变异："+L.mut.name);
    save(); render();
    showAlert("🌌 变异成功！<br><br><b>"+L.mut.name+"</b>：<br>"+(L.mut.note||""), L.mut.name);
  }, L.mut.name);
}
function openPetFeed(n){
  const L = PET_LINES[n]; const pd = petDataOf(n);
  if(!L || !pd) return;
  if(pd.stage >= 4) return showAlert("已是最终形态。", "宠物养成");
  const st = L.stages[pd.stage-1];
  const growthFull = L.readDriven ? (pd.stage >= 3) : (pd.growth >= st.need);   // v1.55：阅读驱动——三阶即成长完成
  const left = petFeedLeft(n);
  const keys = Object.keys(S.mats).filter(function(k){ return WOLF_FOODS.has(k) || (L.favs && L.favs[k] > 0); })   // v1.56e：本命材料也列入
                 .sort(function(a,b){ return M[b][2] - M[a][2]; });
  let body = '<div class="dlg-msg" style="font-size:13px">今日剩余喂食次数：<b style="color:'+(left>0?"var(--gold)":"var(--red)")+'">'+left+" / "+WOLF_DAILY_FEED+'</b>　（每天最多 3 次，每次 1 个）</div>';
  body += '<div class="muted" style="font-size:12px;margin-bottom:6px">当前加成：'+(petBonusNote(n)||"—")+'</div>';
  if(L.readDriven){
    body += '<div class="muted" style="font-size:12px;margin-bottom:6px;color:var(--gold2)">🐾 「'+n+'」的成长来自你的<b>阅读</b>——'+petGrowthTxt(n)+'。普通食材不再增加成长值；变异值仍靠喂食高级特殊材料积累。</div>';
  } else {
    body += '<div class="muted" style="font-size:11px;margin-bottom:6px">每只宠物的口味不同：<b style="color:var(--gold2)">★喜爱</b>的食物成长值更高；未列出的材料按<b>品阶</b>给成长（品阶越高营养越丰富）；变异材料各有偏好。</div>';
    if(pd.stage >= 2 && !growthFull) body += '<div class="muted" style="font-size:12px;margin-bottom:6px;color:var(--gold2)">喂食高级特殊材料（龙血 / 暗影草 / 龙心 / 世界树汁液）可额外积累变异值。</div>';
    if(growthFull) body += '<div class="muted" style="font-size:12px;margin-bottom:6px;color:var(--gold2)">成长值已满——普通食材不再增加成长值；只有高级特殊材料能继续积累变异值。</div>';
  }
  if(!keys.length) body += '<div class="muted">背包里没有可喂食的物品。</div>';
  keys.forEach(function(k){
    const m = M[k], _pv = petFeedValue(n, k), v = _pv.v, mv = _pv.mv;
    let zero = "";                                      // v1.55：拦截说明（含一阶高级材料无效）
    if(_pv.refuse) zero = '<span style="color:var(--red)">（它不吃这个）</span>';
    else if(L.readDriven && mv && pd.stage < 2) zero = '<span style="color:var(--dim2)">（二阶起才积累变异值）</span>';
    else if(growthFull && !mv) zero = '<span style="color:var(--dim2)">（成长已满 · 无加成）</span>';
    else if(L.readDriven && !mv) zero = '<span style="color:var(--dim2)">（成长来自阅读 · 无加成）</span>';
    const favMark = (L.favs && L.favs[k] > 1 && !L.readDriven) ? ' <span style="color:var(--gold2)">★喜爱</span>' : "";

/* ── 材料数量判定（与种类判定独立，2026-10-02）──
   每项材料的数据为 [min,max] 区间；抽中后按「递减权重」抽数量：
   数量越少权重越高（例 [3,6] 权重 4/3/2/1 → 3 最多、6 最少） */
function rollQty(min, max){
  if(max <= min) return min;
  let total = 0;
  for(let i = min; i <= max; i++) total += (max - i + 1);
  let r = Math.random() * total;
  for(let i = min; i <= max; i++){
    r -= (max - i + 1);
    if(r < 0) return i;
  }
  return min;
}

function latestPoint(now){
  const h = now.getHours(), m = now.getMinutes();

function mixPool(){
  const out = [];
  for(let i=0;i<=S.lvIdx;i++){ const a = C[CFG.levels[i]] || []; for(let j=0;j<a.length;j++) out.push(a[j]); }
  // v1.41 I1：链前置过滤（未满足前置的链委托不进入抽取池；过滤后兜底防空池）
  const flt = out.filter(function(q){ return questReqOk(q[0]); });
  return flt.length ? flt : out;
}
function drawPool(point){
  const li = S.lvIdx;
  const n = CFG.drawCount[li];
  const list = mixPool();
  const now = new Date();
  const curMin = now.getHours()*60 + now.getMinutes();

  // 可接的（时间窗匹配）
  function inWindow(q){
    const w = q[2];
    if(w === "全天") return true;
    const [a,b] = w.split("-");
    const ah = +a.split(":")[0]*60 + +a.split(":")[1];
    const bh = +b.split(":")[0]*60 + +b.split(":")[1];
    return curMin >= ah && curMin <= bh;
  }
  const ok = list.filter(inWindow);
  const src = ok.length >= n ? ok : list;   // 可接不足则放宽

  // 随机抽 n 个不重复
  const picked = [], used = new Set();
  let guard = 0;
  while(picked.length < Math.min(n, src.length) && guard++ < 500){
    const i = Math.floor(Math.random()*src.length);
    if(!used.has(i)){ used.add(i); picked.push(src[i]); }
  }
  return picked;
}

  }

  checkGuildTitles();      // v1.40：W/H/P 公会称号（幂等；Flask 端由服务端 catch_up 同步授予）
  if(syncReadPets()) changed = true;   // v1.55：阅读驱动宠物（月光狐）——阅读次数达标自动进化（幂等；服务端 catch_up 同判）
  if(petDailyChecks(_crossed)) changed = true;   // v1.56：散步结算 / 羁绊里程碑 / 小剧场 / 深夜提醒（服务端 catch_up 同判）
  S.lastTick = nowTs;

/* v1.50：安眠薰香 Ⅰ~Ⅴ 递增（+4/+5/+7/+10/+14，满级累计 +40）——与服务端 INCENSE_BONUS 对齐 */
const INCENSE_BONUS = [0, 4, 9, 16, 26, 40];
function energyBase(){                 // 不含料理的基础上限
  let m = CFG.energyMax[S.lvIdx];

  if(S.buffNext && S.buffNext.date === todayStr()){
    m += (S.buffNext.energy||0);                                      // 次日区间奖励·精力加减
    if(S.buffNext.energyPct) m = Math.max(1, Math.round(m * (1 + S.buffNext.energyPct)));   // v1.40：虚弱 → 上限 −10%
  }
  return m;
}

  const _v = energyBase() + mealCapBonus();

function applyBuffClaim(){
  if(!S.buffNext || S.buffNext.claimed) return;
  if(S.buffNext.date > todayStr()) return;          // 还没到生效日
  const b = S.buffNext;
  const msg = [];
  if(b.con){ S.con += b.con; msg.push("贡献 +"+b.con); }
  if(b.vit){ const v = Math.round(b.vit*(1+charmVitGain())); S.vit += v; msg.push("活力点 +"+v); }
  b.claimed = true;

/* 断连保护（02_健康系统 2.5）：连续 n 天早睡 = 最近 n 天达标 ≥ n−3（每月 3 次容错） */
function sleepStreakProt(n){
  const sh = S.shieldDays || [], sk = S.sickDays || [];   // v1.60：病假日与连击保险同为「保护日」
  const okDay = function(h){ return h.sleep || sh.indexOf(h.date) >= 0 || sk.indexOf(h.date) >= 0; };   // v1.40：连击保险日计入（保险真正保住连击，不再只是显示）
  const last = S.history.slice(-n);
  if(last.length < n) return last.length > 0 && last.every(okDay);
  return last.filter(okDay).length >= n - 3;
}

/* 周结算（每周日 23:30 日结算后触发）：
   02 健康周打卡（5 指标档位）+ 04 公会周常（3 指标达成） */
function weeklySettle(endDateStr){
  const mk = weekKey(parseDate(endDateStr));
  if(S.weekSettled === mk) return null;
  S.weekSettled = mk;
  const days = S.history.filter(function(h){ return h.date && weekKey(parseDate(h.date)) === mk; });
  const n = Math.max(1, days.length);
  const avg = days.reduce(function(a,h){ return a + (h.score||0); }, 0) / n;
  const sleepN = days.filter(function(h){ return h.sleep; }).length;
  const sportN = days.filter(function(h){ return h.tasks && h.tasks[4]; }).length;
  const readN = days.reduce(function(a,h){ return a + (h.multi ? (h.multi[1]||0) : 0); }, 0);
  const questN = days.reduce(function(a,h){ return a + (h.done||0); }, 0);
  const tAvg = tier3(avg, 60, 75, 90), tSleep = tier3(sleepN, 5, 6, 7), tSport = tier3(sportN, 3, 5, 7), tRead = tier3(readN, 2, 4, 6), tQuest = tier3(questN, 5, 10, 15);
  const got = [];
  const _mG = lvGoldMul(), _mV = lvVitMul();   // v1.41 H4
  if(tAvg){ const c = Math.round([1000,3000,10000][tAvg-1] * _mG); S.money += c; got.push("平均健康 "+Math.round(avg)+" → "+fmtMoney(c)); }
  if(tSleep){ const v = Math.round([10,20,40][tSleep-1] * _mV * (1+charmVitGain())); S.vit += v; got.push("早睡 "+sleepN+" 天 → 活力点 +"+v); }
  if(tSport){ const c = [20,50,100][tSport-1]; S.con += c; got.push("运动 "+sportN+" 天 → 贡献 +"+c); }
  if(tRead){ const e = [5,10,20][tRead-1]; S.explore += e; got.push("阅读 "+readN+" 次 → 探索点 +"+e); }
  if(tQuest){ const c = Math.round([2000,5000,10000][tQuest-1] * _mG); S.money += c; got.push("完成委托 "+questN+" 次 → "+fmtMoney(c)); }
  // 公会周常（04_成长系统 4.7）
  const gc = [];
  if(sleepN >= 6){ const c = Math.round(500 * _mG); S.money += c; S.con += 50; gc.push("连续早睡（周保护）→ "+fmtMoney(c)+" + 贡献50"); }
  if(questN >= 10){ const c = Math.round(2000 * _mG); S.money += c; S.con += 80; gc.push("完成 10 次委托 → "+fmtMoney(c)+" + 贡献80"); }
  if(sportN >= 5){ const c = Math.round(1500 * _mG); S.money += c; S.con += 60; gc.push("运动 5 天 → "+fmtMoney(c)+" + 贡献60"); }
  if(got.length || gc.length){
    addLog("📅 周结算（"+mk+" 当周）："+(got.concat(gc).join("｜")||"无奖励"),"gold");
    if(S.daily && S.daily.events) S.daily.events.push("📅 周结算："+(got.length+gc.length)+" 项奖励");
  }
  return {mk:mk, got:got, gc:gc, n:days.length};
}
/* 月结算（每月最后一天 23:30 日结算后触发）：

function monthlySettle(endDateStr){

  const sleepN = days.filter(function(h){ return h.sleep; }).length;

  const readN = days.reduce(function(a,h){ return a + (h.multi ? (h.multi[1]||0) : 0); }, 0);
  const questN = days.reduce(function(a,h){ return a + (h.done||0); }, 0);
  const tAvg = tier3(avg, 70, 80, 90), tSleep = tier3(sleepN, 20, 23, 25), tSport = tier3(sportN, 12, 18, 24), tRead = tier3(readN, 10, 20, 30), tQuest = tier3(questN, 20, 40, 60);
  const got = [];
  const _mG = lvGoldMul(), _mV = lvVitMul();   // v1.41 H4
  if(tAvg){ const c = Math.round([10000,30000,100000][tAvg-1] * _mG); S.money += c; got.push("平均健康 "+Math.round(avg)+" → "+fmtMoney(c)); }
  if(tSleep){ const v = Math.round([50,100,200][tSleep-1] * _mV * (1+charmVitGain())); S.vit += v; got.push("早睡 "+sleepN+" 天 → 活力点 +"+v); }
  if(tSport){ const add = [5,10,20][tSport-1]; if((S.permEnergy||0) < 50){ S.permEnergy = Math.min(50, (S.permEnergy||0) + add); got.push("运动 "+sportN+" 天 → 永久精力上限 +"+add+"（累计 "+S.permEnergy+"/50）"); } }   // v1.40：原「取历史最高」首金后归零 → 改为可累积、上限 50
  if(tRead === 1){   // 青铜：随机未掌握图纸
    const pool = GEAR.filter(function(g){ return g[5] !== "—" && !S.blueprints[g[0]]; }).map(function(g){ return g[0]; });
    const bp = pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
    if(bp){ S.blueprints[bp] = true; got.push("阅读 "+readN+" 次 → 图纸「"+bp+"」"); }
  } else if(tRead === 2){   // 白银：随机稀有装备
    const pool = GEAR.filter(function(g){ return g[1] === "稀有"; });
    const g = pool[Math.floor(Math.random()*pool.length)];
    if(g && S.gear.indexOf(g[0]) < 0){ S.gear.push(g[0]); got.push("阅读 "+readN+" 次 → 装备「"+g[0]+"」"); }
  } else if(tRead === 3){   // 黄金：宠物
    if(S.pets.indexOf("月光狐") < 0){ S.pets.push("月光狐"); got.push("阅读 "+readN+" 次 → 宠物「月光狐」"); }
  }
  if(tQuest){ const c = Math.round([50000,150000,500000][tQuest-1] * _mG); const rp = [20,60,150][tQuest-1]; S.money += c; S.rep += rp; got.push("完成委托 "+questN+" 次 → "+fmtMoney(c)+" + 声望"+rp); }
  // 月黄金称号（30 天有效）
  const until = Date.now() + 30*86400000;
  if(tSleep === 3){ S.timTitles["安眠守护者"] = until; got.push("早睡黄金 → 称号「安眠守护者」（30 天）"); }
  if(tQuest === 3){ S.timTitles["公会中坚"] = until; got.push("委托黄金 → 称号「公会中坚」（30 天）"); }
  // 公会月常（04_成长系统 4.7）
  if(sleepStreakProt(30)){ const c = Math.round(10000 * _mG); S.money += c; S.timTitles["作息守护者"] = until; got.push("连续 30 天规律作息（含保护）→ "+fmtMoney(c)+" + 称号「作息守护者」"); }
  if(questN >= 40){ const c = Math.round(30000 * _mG); S.money += c; S.rep += 200; got.push("完成 40 次委托 → "+fmtMoney(c)+" + 声望200"); }
  if(got.length){
    addLog("🗓️ 月结算（"+ym+"）："+got.join("｜"),"gold");
    if(S.daily && S.daily.events) S.daily.events.push("🗓️ 月结算："+got.length+" 项奖励");
  }
  return {ym:ym, got:got, n:days.length};
}
/* ── v1.38：连击保险 —— 连续早睡满 7 天后，每月 1 次断档自动保护，连击不断 ── */
function sleepStreak(){
  const shielded = S.shieldDays || [], sick = S.sickDays || [];   // v1.60：病假日计入保护
  let n = 0;
  for(let i = (S.history||[]).length - 1; i >= 0; i--){
    const h = S.history[i];
    if(h.sleep || shielded.indexOf(h.date) >= 0 || sick.indexOf(h.date) >= 0) n++; else break;
  }
  return n;
}
function tryComboShield(combo){
  if(combo < 7) return false;
  const d = S.health.date, ym = d.slice(0,7);
  if(S.shieldMonth === ym) return false;
  S.shieldMonth = ym;
  S.shieldDays = S.shieldDays || [];
  S.shieldDays.push(d);
  if(S.shieldDays.length > 60) S.shieldDays = S.shieldDays.slice(-60);
  addLog("🛡️ 连击保险：连续早睡 "+combo+" 天，昨夜断档被保险覆盖，连击保留（每月 1 次）","gold");
  return true;
}
/* ── v1.61：疗养圣所——生病请假：每月 3 天，无门槛（v1.60 原「医务室」·公会 C·每月 2 天）──

function sickToday(){ return (S.sickDays || []).indexOf(S.health.date) >= 0; }
function sickLeftNow(){

function takeSickLeave(day){

    if(day === "yesterday" && (S.history||[]).length) S.history[S.history.length-1].score = SICK_LOCK_SCORE;   // v1.61：昨日记录评分改写为 59
    calcHealth();                                        // v1.61：今日病假 → 立即锁定 59

  });

function daySettle(){
  /* ① 豁免结算（必须在算分之前）：晨曦之冠·早起（每周1次）——安神吊坠·早睡豁免已于 v1.38p 移除（v1.40 清残留） */
  const hd = S.health.done || [];
  const dStr = S.health.date || todayStr();
  const ymStr = dStr.slice(0,7);
  /* v1.40：删除「安神吊坠·早睡豁免」残留——v1.38p 已将该词条从装备移除，此处硬编码漏删；普通装备不再提供健康豁免 */
  if(!hd[1] && S.exempt.charmNight && S.exempt.charmNight.date === dStr && S.exempt.charmNight.slot === "晨曦之冠" && S.exempt.early !== weekKey(parseDate(dStr))){   // v1.41 G6：依据睡前佩戴快照（原读实时装备，可跨天换装回溯）
    hd[1] = 1; S.exempt.early = weekKey(parseDate(dStr));
    addLog("🌅 晨曦之冠·早起豁免生效：本日「7:40 前起床」视为达成（每周 1 次）","gold");
  }
  calcHealth();
  // v1.41 I3：月度世界事件·规律打卡日（当日 7 项完成 ≥6，豁免已计）
  if(hd.filter(function(x){ return x; }).length >= 6) monthEventAdd("task");
  const sc = S.health.score;
  let rep = 0, con = 0, vit = 0;
  if(sc>=90){ rep=8; con=6; vit=5; }
  else if(sc>=75){ rep=5; con=3; vit=3; }
  else if(sc>=60){ rep=2; con=1; vit=1; }   // v1.59b：良好档（第三档）追加 活力点 +1（用户指定）
  if(vit) vit = Math.round(vit * (1 + charmVitGain()));   // 冥念护符：活力点获取加成
  if(rep||con||vit){
    S.rep += rep; S.con += con; S.vit += vit;
    if(S.daily){ S.daily.rep += rep; S.daily.con += con; S.daily.vit = (S.daily.vit||0) + vit; }
    addLog("📊 日结算：健康 "+sc+" 分 → 声望+"+rep+" 贡献+"+con+" 活力点+"+vit,"ok");
  } else {
    addLog("📊 日结算：健康 "+sc+" 分，无额外奖励","");
  }
  /* ② 安眠室：早睡达标累计（每满 7 天 → 健康加成 +1pp，最高 +5pp） */
  if(hd[0]){
    S.heatN = (S.heatN||0) + 1;
    if(S.heatN % 7 === 0)
      addLog("🛏️ 安眠室：累计早睡 "+S.heatN+" 天 → 健康加成 +"+Math.min(5, Math.floor(S.heatN/7))+"pp","ok");
  }
  /* ③ 次日区间奖励（02_健康系统 2.2）：报酬/精力为次日持续效果，贡献/活力点次日首次打开发放 */
  const nxtDate = fmtDate(new Date(parseDate(dStr).getTime() + 86400000));
  const nb = {date:nxtDate, pay:0, energy:0, con:0, vit:0, claimed:false, score:sc};
  if(sc>=90){ nb.pay=0.15; nb.con=6; nb.vit=5; nb.energy=10; }
  else if(sc>=75){ nb.pay=0.10; nb.con=3; nb.vit=3; }
  else if(sc>=60){ nb.pay=0.05; nb.con=1; nb.vit=1; }   // v1.59b：良好档（第三档）追加 活力点 +1（与结算表同步）
  else if(sc<40){ nb.energyPct=-0.10; }   // v1.40：虚弱 → 次日精力上限 −10%（原固定 −10 对高等级无感）；40–59「普通」档无额外奖励
  /* v1.40：补发未领取的旧区间奖励——玩家在生效日未上线时，贡献/活力点不再被覆盖丢失（报酬/精力有时效，过期作废） */
  if(S.buffNext && !S.buffNext.claimed && S.buffNext.date <= dStr){
    const ob = S.buffNext;
    const bm = [];
    if(ob.con){ S.con += ob.con; bm.push("贡献 +"+ob.con); }
    if(ob.vit){ const v = Math.round(ob.vit*(1+charmVitGain())); S.vit += v; bm.push("活力点 +"+v); }
    if(bm.length) addLog("🌟 补发 "+ob.date+" 的区间奖励："+bm.join("、")+"（当时未上线，报酬与精力已过期）","ok");
    ob.claimed = true;
  }
  S.buffNext = nb;
  // 归档当天统计（v1.19：记录打卡明细，供周月打卡 / 厨房 / 成就使用）
  S.history.push({
    date: S.health.date, score: sc,
    sleep: !!(S.health.done||[])[0],           // 23:30 前入睡（供传奇事件条件统计）
    done: S.daily ? S.daily.done : 0,
    gold: S.daily ? S.daily.gold : 0,
    tasks: (S.health.done||[]).slice(),
    multi: (S.health.multi||[]).slice()
  });
  if(S.history.length > 400) S.history.shift();
  /* ④ 周结算（周日）/ 月结算（月末）+ 成就检查 */
  const dd = parseDate(dStr);
  if(dd.getDay() === 0) weeklySettle(dStr);
  if(new Date(dd.getTime() + 86400000).getMonth() !== dd.getMonth()) monthlySettle(dStr);
  checkAchievements();

  // 生成「昨日快照」——次日首次打开时展示
  const d = S.daily || {};
  S.yesterday = {
    date: S.health.date,
    score: sc,
    rep: rep, con: con, vit: vit,
    tasks: CFG.tasks.map(function(t,i){ return {n:t[0], p:t[1], ok: !!(S.health.done||[])[i]}; }),
    multiTasks: CFG.multiTasks.map(function(t,i){ return {n:t[0], p:t[1], cnt:(S.health.multi||[])[i]||0, max:t[2]}; }),
    byGrade: 0,
    doneCount: d.done || 0,
    quests: (d.quests||[]).slice(),
    exp: d.exp||0, gold: d.gold||0,
    rep2: d.rep||0, con2: d.con||0,
    mats: Object.assign({}, d.mats||{}),
    events: (d.events||[]).slice(),
    exploreNext: Math.floor(sc/10)
  };
  S.yesterdayShown = false;
}

  return _roll3D;
}

/* 3D 掷骰串行队列：多个委托同时完成时，依次播放动画（而不是并发导致只有第一个有动画） */
let _pendingSettles = 0;                    // 正在结算中的委托数（含 3D 动画播放）
let _roll3DChain = Promise.resolve();
function queueRoll3D(roll, name){           // v1.48c：name = 对应委托名（3D 骰窗口标题显示）
  _roll3DChain = _roll3DChain.then(async function(){
    const r3d = await getRoll3D();
    if(!r3d) return;                        // 引擎不可用 → 静默跳过
    try{ await r3d('1d100', roll, name); }
    catch(e){ console.warn('[3D骰子] 播放异常：', e); }
  });
  return _roll3DChain;
}

/* ── 委托结算 ── */
/* 委托声望奖励：Lv1/Lv2 固定 = 等级×5；Lv3 起按「等级 × 难度」查表
   设计原则：均值与原「等级×5」基本持平（Lv3≈15 / Lv4≈20 / Lv5≈26），
   难度越高声望越多，让高难委托的额外风险有回报 */
const REP_TABLE = {
  3:{简单:10, 普通:14, 困难:19, 噩梦:25},
  4:{简单:12, 普通:16, 困难:21, 噩梦:28},
  5:{简单:14, 普通:18, 困难:24, 噩梦:32}
};
function questRep(q, lv){
  if(lv <= 2) return lv*5;
  return (REP_TABLE[lv] && REP_TABLE[lv][q[4]]) || lv*5;
}
function questQLv(q){ return (QUEST_LV[q[0]] !== undefined ? QUEST_LV[q[0]] : S.lvIdx) + 1; }   // v1.51 A4：委托等级（1-based）——声望 / 贡献均按委托等级计算
function questCon(q){ return questQLv(q); }                                                    // 贡献基础值 = 委托等级 ×1（装备「公会贡献+%」另计）
const LEGEND_CON = 150;   // v1.51：传奇事件贡献奖励（原 +50 → +150，终局内容与日常拉开梯度）；与服务端 LEGEND_CON 对齐

async function settle(a, now){
  _pendingSettles++;
  try { await _settleInner(a, now); }
  finally { _pendingSettles--; flushResults(); }   // 结算完毕后再尝试弹窗
}
async function _settleInner(a, now){
  const q = a.q;
  const rate = a.rate;
  const roll = rand(100);
  const ok = roll <= Math.round(rate*100);
  const crit = roll<=5, fumble = roll>=96;

  // 弹出 3D 物理骰子小窗口播放掷骰动画（结果已确定，动画只是演出）
  // 用队列串行——多个委托同时完成时依次播放，而不是只有第一个有动画
  await queueRoll3D(roll, q[0]);

  // 传奇事件：报酬为字符串（如 "1铂金币"），单独换算
  if(a.legend){
    const L = a.legend;
    const lname = a.lname || S.legendName || "传奇事件";
    const base = LEGEND_GOLD[L[4]] || 1000000;
    const roll2 = rand(100);
    await queueRoll3D(roll2, L[0]);                 // 与常规委托一致，也播 3D 动画（标题=事件名）
    const ok2 = roll2 <= Math.round(a.rate*100);
    let g2 = ok2 ? Math.round(base * (1 + gearBonus() + gearAccBonus() + charmPay())) : Math.max(1, Math.round(base*0.3));
    const e2 = ok2 ? L[5] : Math.max(1, Math.round(L[5]*0.3));   // v1.48d：传奇失败得 30% 经验（至少 1）
    const r2 = ok2 ? legendRep(L) : 0;
    S.money += g2; S.exp += e2;
    if(ok2 && L[6]){ L[6].split("、").forEach(function(pair){
      const m = pair.match(/^(.+?)×(\d+)$/); if(m && M[m[1]]) S.mats[m[1]] = (S.mats[m[1]]||0) + (+m[2]);
    }); }
    if(ok2){
      S.rep += r2; S.con += LEGEND_CON;          // v1.51：贡献 50 → 150（LEGEND_CON）
      grantLegendReward(L);                      // 称号 / 宠物 / 藏品入档
      if(S.legendDone.indexOf(L[0]) < 0) S.legendDone.push(L[0]);   // v1.53：记录完成（去重，对齐服务端 v1.50）
      checkAchievements();                       // v1.19：传奇成就（屠龙者 / 创世者）
    }
    resultQueue.push({name:L[0], type:(L[1]||"精英").split("+")[0], roll:roll2, need:Math.round(a.rate*100),
      title: ok2?lname+"完成！":"失败", gold:g2, exp:e2,
      got:[ok2?(L[7]||"").replace(/；/g,"　"):""].filter(Boolean), cls: ok2?"gold":"bad"});
    addLog("🌍 "+lname+"「"+L[0]+"」掷出 "+roll2+" → "+(ok2?"成功":"失败")+"（+"+fmtMoney(g2)+" / +"+e2+"经验"+(r2?" / +"+r2+"声望":"")+"）", ok2?"gold":"bad");
    if(ok2) addLog("🏆 奖励已入档：" + (L[7]||"—") + "（见「冒险者信息」页）","gold");
    checkLevelUp();
    return;
  }
  const _eff = gearEffects();
  const _fef = todayFestEff();   // v1.41f：节日专属效果
  let gold = 0, exp = 0;
  if(ok){
    gold = q[5];
    if(crit) gold = Math.round(gold*1.2);
    const _m = a.meal;                             // 只有接取时生效的那道菜起作用
    let payMul = 1 + gearBonus() + gearAccBonus() + ((_eff.pay[q[1]])||0) + petBonus().pay;  // 饰品 + 分类报酬 + 宠物
    if(_eff.pay["晨间"] && isMorningQuest(q)) payMul += _eff.pay["晨间"];   // 晨曦之冠：晨间委托报酬加成
    if(S.buffNext && S.buffNext.date === todayStr()) payMul += (S.buffNext.pay||0);   // 次日区间奖励·报酬
    payMul += titlePayBonus();                                             // 当月称号（作息守护者 / 公会中坚）
    payMul += titleOwnBonus();                                             // v1.41：称号收集（每 1 个 +1%，上限 +10%）
    payMul += (_fef.pay || 0);                           // v1.41f：节日专属报酬加成（国庆 +20% / 春节 +30%）
    if(q[1] === "精英" && guildIdx() >= 3 && S.libDate === todayStr()) payMul += 0.10;   // 图书馆：当日阅读 → 精英类报酬 +10%
    payMul += (S.rareNextPay||0);                                          // 稀有事件·商队搭伙（下一次委托报酬 +25%）
    if(_m && _m.bonus) payMul += _m.bonus * (_fef.cookMul || 1);   // v1.41f：腊八·料理效果翻倍
    payMul += charmPay();                           // 冥念护符
    payMul += skillPay(q);                          // 技能树·社交（护送类）
    gold = Math.round(gold * payMul);
    exp = Math.round(q[6] * (1 + _eff.exp + petBonus().exp + (_fef.exp || 0)));   // v1.41f：劳动节·经验 +50%
  } else {
    // 失败（含大失败）：得 30% 报酬 + 30% 经验（各至少 1），无掉落（材料只在成功时结算）——v1.48d
    gold = Math.max(1, Math.round(q[5]*0.3));
    exp = Math.max(1, Math.round(q[6]*0.3*(1 + _eff.exp + petBonus().exp + (_fef.exp || 0))));
  }
  // v1.41 I4：资源指定类——持有指定材料（≥1）→ 自动上交 1 个，本次报酬翻倍
  if(ok && QUEST_TURNIN[q[0]] && (S.mats[QUEST_TURNIN[q[0]]]||0) >= 1){
    const _tn = QUEST_TURNIN[q[0]];
    S.mats[_tn] -= 1;
    addLog("📦 上交「"+_tn+"」×1 → 「"+q[0]+"」本次报酬翻倍","gold");
    gold *= 2;
  }
  S.money += gold;
  S.exp += exp;
  // 材料（仅成功）：种类判定（按品阶）与数量判定（区间递减权重）分开计算
  const got = [], gotObj = {};
  if(ok && q[8]){
    Object.keys(q[8]).forEach(function(k, idx){
      if(rollMat(idx, k)){                     // 种类判定：主材料必得，其余按品阶概率
        const rg = matQtyRange(q[8][k]);
        let n2 = rollQty(rg[0], rg[1]);        // 数量判定：数量越多概率越低
        if(_eff.mat > 0 && idx > 0) n2 = Math.max(1, Math.round(n2 * (1 + _eff.mat)));   // 材料获取加成（仅副材料）
        if(_fef.matQtyPct) n2 = Math.max(1, Math.round(n2 * (1 + _fef.matQtyPct)));   // v1.41f：七夕·乞巧（数量 +50%）
        S.mats[k] = (S.mats[k]||0) + n2;
        got.push(k+"×"+n2); gotObj[k] = n2;
      }
    });
  }
  // 声望 / 贡献（v1.51 A4：均按委托等级，不再按玩家等级）
  let rep = ok ? questRep(q, questQLv(q)) : 0;
  if(ok && crit) rep += 5;                   // 大成功额外声望（见 03/04 文档）
  const con = ok ? Math.round(questCon(q) * (1 + _eff.con)) : 0;
  S.rep += rep; S.con += con;

  // 当日统计（供次日「昨日结算」展示）
  if(!S.daily || S.daily.date !== todayStr())
    S.daily = {date:todayStr(), done:0, gold:0, exp:0, rep:0, con:0, vit:0, quests:[], mats:{}, events:[]};
  // 字段级兜底（防御残缺的 daily 对象）
  if(!S.daily.quests) S.daily.quests = [];
  if(!S.daily.mats) S.daily.mats = {};
  S.daily.done++;
  S.daily.gold += gold;
  S.daily.exp  += exp;
  S.daily.rep  += rep;
  S.daily.con  += con;
  S.daily.quests.push({name:q[0], grade:q[4], ok:ok});
  // 累积完成统计（供传奇事件条件：前置委托 / 250 次 Lv5 以下委托）
  if(ok){
    S.doneQuests[q[0]] = (S.doneQuests[q[0]]||0) + 1;
    // v1.41 I1：链推进提示（该委托是某链节点的前置时，提示后续线索）
    const _nxt = Object.keys(QUEST_REQ).filter(function(k2){ return QUEST_REQ[k2] === q[0]; });
    if(_nxt.length) addLog("🔗 传闻：完成「"+q[0]+"」后，「"+_nxt[0]+"」的线索已出现，将可能出现在委托栏中","gold");
    monthEventAdd("quest");   // v1.41 I3：月度世界事件·委托进度
    if((a.qlv || S.lvIdx+1) <= 4) S.doneBelow5++;
    S.totalQuests = (S.totalQuests||0) + 1;    // v1.19：累计完成数（成就「百炼成钢」）
    checkAchievements();
  }
  for(const mk in gotObj) S.daily.mats[mk] = (S.daily.mats[mk]||0) + gotObj[mk];

  // 稀有事件「下一次委托」加成：本次结算即消费（无论成败）
  S.rareNextRate = 0; S.rareNextPay = 0;

  let title, cls;
  if(!ok && fumble){ title = "大失败"; cls = "bad"; }
  else if(ok && crit){ title = "大成功！"; cls = "gold"; }
  else if(ok){ title = "成功"; cls = "ok"; }
  else { title = "失败"; cls = "bad"; }

  const _petNote = petQuestGain(q, ok, (a.qlv || S.lvIdx+1) - 1);   // v1.38f：携带宠物陪同委托 → 成长
  resultQueue.push({
    name:q[0], type:q[1], roll:roll, need:Math.round(rate*100),
    title:title, gold:gold, exp:exp, got:got, cls:cls, pet:_petNote
  });
  addLog("⚔ "+q[0]+" 掷出 "+roll+" → "+title+
    (gold?"（+"+fmtMoney(gold)+"）":"")+" +"+exp+"经验"+
    (got.length?" 材料:"+got.map(m=>matIcon(m.split("×")[0])+m).join(" "):"")+
    (_petNote?" "+_petNote:""), cls);

  checkLevelUp();
  // 稀有事件判定（每次委托结算，成败都判）
  const rareEv = tryRareEvent(q[1], q[0]);   // v1.53：去掉多余第 3 参（函数仅接收 tag/name，对齐服务端签名）
  if(rareEv) showRareEvent(rareEv);
}

/* ── 结算结果弹窗队列 ── */
let resultQueue = [];
let levelupQueue = [];         // v1.38r：升级详情队列（结算结果之后依次弹出）
let _qanimBusy = false;        // v1.35：委托动画播放中（防重复触发）
/* v1.38s：升级详情入队（同级去重）。Flask 环境由服务端 levelups 队列驱动 → 跳过，避免双弹 */
function queueLevelUpDetail(idx){
  if(Array.isArray(S.levelups)) return;
  if(levelupQueue.indexOf(idx) < 0) levelupQueue.push(idx);
}
function flushResults(){
  // 1) 优先播出待显示的委托结算结果
  if(resultQueue.length){
    if(document.getElementById("modal").classList.contains("on")) return;  // 已有弹窗在显示
    if(_qanimBusy) return;                                                  // v1.35：动画播放中
    const r = resultQueue.shift();
    _qanimBusy = true;
    playQuestAnim(r.name, r.type, r.cls, function(){                        // v1.35：emoji 迷你动画 → 结果
      _qanimBusy = false;
      showResult(r.name, r.roll, r.need, r.title, r.gold, r.exp, r.got, r.cls, r.pet);
    });
    return;
  }
  // 1.5) 升级详情（v1.38r：在结算结果之后、昨日结算之前）
  if(levelupQueue.length){
    if(document.getElementById("modal").classList.contains("on")) return;
    if(_qanimBusy) return;
    showLevelUpDetail(levelupQueue.shift(), function(){ setTimeout(flushResults, 250); });
    return;
  }
  // 2) 结算队列清空、且没有委托仍在结算中，才弹「昨日结算」（优先级最低）
  if(_pendingSettles > 0) return;
  if(S.yesterday && !S.yesterdayShown && !document.getElementById("modal").classList.contains("on")){
    S.yesterdayShown = true;
    save();
    showYesterday();
    return;      // v1.41d：昨日结算之后还有节日欢迎窗（等它关闭再弹）
  }
  // 3) v1.41d：节日欢迎窗（队列最末——排在结算结果 / 昨日结算之后）
  if(S.pendingFestival && !document.getElementById("dlg").classList.contains("on")){
    const pf = S.pendingFestival;
    S.pendingFestival = null;
    save();
    showFestivalWelcome(pf);
  }
}

/* ── 跨天委托：在次日打卡时结算 ── */
function settlePending(){
  const keep = [];
  let n = 0;
  for(const a of S.active){
    if(a.pending){ settle(a); n++; }
    else keep.push(a);
  }
  S.active = keep;
  if(n) addLog("☀️ 打卡触发 "+n+" 个跨天委托的结算","gold");
  return n;
}

function sameDay(ts1, ts2){
  return todayStr(new Date(ts1)) === todayStr(new Date(ts2));
}

/* ══════════════════════════════════════════════════
   4. 操作
   ══════════════════════════════════════════════════ */
function acceptQuest(idx){
  tick();
  const q = S.pool.list[idx];
  if(!q) return;
  if(S.pool.taken) return showAlert("本次刷新已接取过了");
  if(poolExpired()) return showAlert("本批委托已失效。<br><br>接取窗口为刷新后 <b>"+fmtDur(poolWindowMs()/60000)+"</b>内（本批刷新点："+S.pool.point.split("@")[1]+":00）。<br>等下一个刷新点再来。");
  const limit = dailyLimitNow();
  if(S.accepted >= limit) return showAlert("今日接取已达上限（"+limit+" 个）");
  const simCap = simCapNow();
  if(activeNormalCount() >= simCap) return showAlert("同时进行的委托已达上限 "+simCap+" 个");
  const enCost = Math.max(1, Math.round(q[7] * (1 - gearEnCutFor(q[1]))));
  if(S.energy < enCost) return showAlert("精力不足：需要 "+enCost+"，当前 "+S.energy);
  // v1.46：任务门槛——接取消耗准备物（数量随委托等级递增，v1.53）
  const _prep = QUEST_ITEM[q[0]];
  if(_prep){
    const _pn = questItemNeed(q);
    if(!(S.items[_prep] >= _pn)) return showAlert("接取「"+q[0]+"」需要准备物：<b>"+_prep+" ×"+_pn+"</b>（当前 "+(S.items[_prep]||0)+"）。<br><br>可在商店购买，或在背包「⚗️ 炼金台」用材料合成。");
    S.items[_prep] -= _pn;
    if(S.items[_prep] <= 0) delete S.items[_prep];
    addLog("🧪 消耗「"+_prep+"」×"+_pn+"（「"+q[0]+"」的准备物）","");
  }

  S.energy -= enCost;
  S.accepted++;
  S.pool.taken = true;
  const rate = successRate(q);
  const _dur = Math.round(q[3] * (1 + (todayFestEff().dur || 0)));   // v1.41f：儿童节·委托耗时 −30%
  S.active.push({
    q:q, rate:rate,
    qlv: S.lvIdx+1,              // 接取时的委托等级（供传奇事件条件统计：完成 250 次 Lv5 以下委托）
    meal: activeMeal(),          // 记录接取当下生效的料理（只影响这一次委托）
    acceptTs: Date.now(),
    dur:_dur,
    finishTs: Date.now() + _dur*60*1000,
    name:q[0]
  });
  addLog("📥 接取「"+q[0]+"」耗时 "+fmtDur(_dur)+"，成功率 "+Math.round(rate*100)+"%","");
  save(); render();

const BUY_TIERS = {"普通":1, "精良":1, "稀有":1};
/* v1.38m：商店限购——lim:["日",N] / ["周",N]；记账在 S.shopDaily / S.shopWeekly（tick 跨天/跨周幂等重置）
   键带渠道前缀（c:/vit:/con:）——同商品在不同商店的限购互相独立 */
function shopLimBox(it){ return it.lim[0] === "周" ? S.shopWeekly : S.shopDaily; }
function shopLimKey(cur, it){ return cur + ":" + it.n; }
function shopLimUsed(it, cur){
  if(!it.lim) return 0;
  const b = shopLimBox(it);
  return (b && b.cnt && b.cnt[shopLimKey(cur, it)]) || 0;
}
function shopLimLeft(it, cur){ return it.lim ? Math.max(0, it.lim[1] - shopLimUsed(it, cur)) : Infinity; }
function shopLimCheck(it, n, cur){
  if(!it.lim) return null;
  const left = shopLimLeft(it, cur);
  if(left >= n) return null;
  return (it.lim[0] === "周" ? "本周" : "今日") + "限购 " + it.lim[1] + " 个" +
    (left > 0 ? "（还剩 " + left + " 个，本次买 " + n + " 个超了）" : "（已购满）") + "。";
}
function shopLimAdd(it, n, cur){
  if(!it.lim) return;
  const b = shopLimBox(it);
  if(b && b.cnt) b.cnt[shopLimKey(cur, it)] = (b.cnt[shopLimKey(cur, it)] || 0) + n;
}

/* v1.38：音效体系——Web Audio 合成（零外部资源），可在「冒险者信息」页开关 */
let _actx = null;
function soundOn(){ try{ return localStorage.getItem("adv_sound") !== "0"; }catch(e){ return true; } }

  try{ localStorage.setItem("adv_sound", soundOn() ? "0" : "1"); }catch(e){}

function _beep(seq){                 // seq: [频率, 起始秒, 时长, 音量]
  if(!soundOn()) return;
  try{
    _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
    if(_actx.state === "suspended") _actx.resume();
    const t0 = _actx.currentTime;
    seq.forEach(function(ns){
      const o = _actx.createOscillator(), g = _actx.createGain();
      o.type = "sine"; o.frequency.value = ns[0];
      g.gain.setValueAtTime(0.0001, t0 + ns[1]);
      g.gain.exponentialRampToValueAtTime(ns[3] || 0.11, t0 + ns[1] + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + ns[1] + ns[2]);
      o.connect(g); g.connect(_actx.destination);
      o.start(t0 + ns[1]); o.stop(t0 + ns[1] + ns[2] + 0.05);
    });
  }catch(e){}
}
